function applyBulkScheduleUpdate() {
  const ids = getSelectedScheduleIds();
  if (!ids.length) { showToast('No payments selected', 'warning'); return; }
  const doStatus = document.getElementById('bu_status_on')?.checked;
  const doPaid = document.getElementById('bu_paid_on')?.checked;
  const doMethod = document.getElementById('bu_method_on')?.checked;
  const doNotes = document.getElementById('bu_notes_on')?.checked;
  if (!doStatus && !doPaid && !doMethod && !doNotes) { showToast('Select at least one field to update', 'warning'); return; }
  const status = document.getElementById('bu_status')?.value;
  const paidDate = document.getElementById('bu_paid')?.value;
  const method = document.getElementById('bu_method')?.value || '';
  const notes = document.getElementById('bu_notes')?.value || '';
  const affectedLoans = new Set();
  setAuditAction(`Bulk updated ${ids.length} payment records`);
  ids.forEach(id => {
    const row = AppData.schedules.find(x => x.id === id);
    if (!row) return;
    if (doStatus) row.status = status;
    if (doPaid) row.paidDate = paidDate;
    if (doMethod) row.paymentMethod = normalizePaymentMethodValue(method);
    if (doNotes && notes) row.notes = row.notes ? `${row.notes} | ${notes}` : notes;
    if (row.status === 'Paid' && !row.paidDate) row.paidDate = today();
    if (row.status === 'Paid' && row.isEarlySettlement) applyEarlySettlementCompletion(row);
    if (row.loanId) affectedLoans.add(row.loanId);
  });
  affectedLoans.forEach(recalcLoanActualPaid);
  saveData();
  closeModal();
  schedSelected.clear();
  showToast(`${ids.length} payment records updated`, 'success');
  refreshScheduleTable();
}

function bulkMarkSelected(status) {
  const ids = getSelectedScheduleIds();
  if (!ids.length) { showToast('No payments selected', 'warning'); return; }
  const lockedIds = ids.filter(id => getTransactionsForLink('schedule', id).length > 0);
  const editableIds = ids.filter(id => !lockedIds.includes(id));
  if (!editableIds.length) {
    lockedIds.forEach(id => recalcPlanStatusFromTransactions('schedule', id));
    showToast('Selected installments already have related actual payments. Their status is system-calculated.', 'warning', 5000);
    refreshScheduleTable();
    return;
  }
  setAuditAction(`Bulk marked ${editableIds.length} payments as ${status}`);
  const affectedLoans = new Set();
  editableIds.forEach(id => {
    const s = AppData.schedules.find(x => x.id === id);
    if (s) {
      s.status = status;
      if (status === 'Paid') s.paidDate = s.paidDate || today();
      if (s.loanId) affectedLoans.add(s.loanId);
      if (status === 'Paid' && s.isEarlySettlement) applyEarlySettlementCompletion(s);
    }
  });
  AppData.schedules.filter(x => x.status === 'Paid' && x.isEarlySettlement).forEach(applyEarlySettlementCompletion);
  affectedLoans.forEach(recalcLoanActualPaid);
  saveData();
  schedSelected.clear();
  const skippedMsg = lockedIds.length ? ` · ${lockedIds.length} skipped because related payments control status` : '';
  showToast(`${editableIds.length} payments marked as ${status}${skippedMsg}`, lockedIds.length ? 'warning' : 'success', 5000);
  refreshScheduleTable();
}

function markPayment(id, status) {
  const s = AppData.schedules.find(x => x.id === id);
  if (!s) return;
  if (getTransactionsForLink('schedule', id).length > 0) {
    recalcPlanStatusFromTransactions('schedule', id);
    showToast('This installment has related actual payments. Its status is system-calculated; record/delete related payments instead.', 'warning', 5000);
    refreshScheduleTable();
    return;
  }
  setAuditAction(`Marked payment ${s.referenceNumber || generatePaymentReference(s.loanId, s.dueDate)} as ${status}`);
  s.status = status;
  if (status === 'Paid') s.paidDate = s.paidDate || today();
  if (status === 'Paid' && s.isEarlySettlement) applyEarlySettlementCompletion(s);
  recalcLoanActualPaid(s.loanId);
  saveData();
  showToast(s.isEarlySettlement && status === 'Paid' ? 'Early settlement completed. Future unpaid installments were cancelled.' : `Payment marked as ${status}`, 'success');
  refreshScheduleTable();
}

function deletePayment(id) {
  const row = AppData.schedules.find(s => s.id === id);
  const warning = row?.isEarlySettlement ? '<br><br><span class="text-yellow">⚠ This is an early settlement payment. Loan settlement status will be recalculated after deletion.</span>' : '';
  confirmAction('Delete this payment entry?' + warning, function() {
    const deletedRow = AppData.schedules.find(s => s.id === id);
    setAuditAction('Deleted payment schedule record');
    AppData.schedules = AppData.schedules.filter(s => s.id !== id);
    schedSelected.delete(id);
    if (deletedRow?.loanId) cleanupLoanAfterScheduleDeletion(deletedRow.loanId, [deletedRow]);
    saveData();
    showToast('Payment deleted', 'success');
    refreshScheduleTable();
  });
}


function cleanupLoanAfterScheduleDeletion(loanId, deletedRows=[]) {
  if (!loanId) return;
  recalcLoanActualPaid(loanId);
  const loan = AppData.loans.find(l => l.id === loanId);
  if (!loan) return;
  const deletedEarlySettlement = (deletedRows || []).some(r => r && r.loanId === loanId && r.isEarlySettlement);
  const remainingEarlySettlement = AppData.schedules.some(r => r.loanId === loanId && r.isEarlySettlement);
  if (deletedEarlySettlement && !remainingEarlySettlement) {
    loan.earlySettlementEnabled = false;
    loan.earlySettlementDate = '';
    loan.earlySettlementAmount = 0;
    loan.earlySettlementStatus = 'Not Planned';
    const total = parseFloat(loan.totalAmount || 0);
    const paid = parseFloat(loan.actualPaid || 0);
    if (loan.status === 'Completed' && paid < total) loan.status = 'Active';
  }
}

function deleteSelectedScheduleRecords() {
  const ids = getSelectedScheduleIds();
  if (!ids.length) { showToast('No payments selected', 'warning'); return; }
  const selectedRows = AppData.schedules.filter(s => ids.includes(s.id));
  const paidCount = selectedRows.filter(s => s.status === 'Paid').length;
  const earlyCount = selectedRows.filter(s => s.isEarlySettlement).length;
  const affectedLoans = [...new Set(selectedRows.map(s => s.loanId).filter(Boolean))];
  const warningParts = [];
  if (paidCount) warningParts.push(`<li><strong>${paidCount}</strong> paid payment${paidCount===1?'':'s'}</li>`);
  if (earlyCount) warningParts.push(`<li><strong>${earlyCount}</strong> early settlement payment${earlyCount===1?'':'s'}</li>`);
  const warningHtml = warningParts.length ? `
    <div class="dq-item warn" style="margin-top:12px">
      <div class="dq-icon">⚠</div>
      <div class="dq-content">
        <div class="dq-title">Financial impact warning</div>
        <div class="dq-desc">Your selection includes:<ul style="margin:6px 0 0 18px">${warningParts.join('')}</ul>Loan balances and early settlement status will be recalculated after deletion.</div>
      </div>
    </div>` : '';
  confirmAction(`
    Delete <strong>${ids.length}</strong> selected payment schedule record${ids.length===1?'':'s'}?<br><br>
    This will delete only the selected records, including records selected across pages or filters. This action is undoable using the Undo button.
    ${warningHtml}
  `, function() {
    const deleteIdSet = new Set(ids);
    const deletedRows = AppData.schedules.filter(s => deleteIdSet.has(s.id));
    setAuditAction(`Deleted ${deletedRows.length} selected payment schedule records`);
    AppData.schedules = AppData.schedules.filter(s => !deleteIdSet.has(s.id));
    ids.forEach(id => schedSelected.delete(id));
    affectedLoans.forEach(loanId => cleanupLoanAfterScheduleDeletion(loanId, deletedRows));
    saveData();
    showToast(`${deletedRows.length} selected payment schedule records deleted`, 'success');
    refreshScheduleTable();
  });
}

function renderScheduleRelatedPaymentsSection(scheduleId) {
  const s = AppData.schedules.find(x => x.id === scheduleId);
  if (!s) return '';
  const txns = getTransactionsForLink('schedule', scheduleId);
  const planned = parseFloat(s.amount) || 0;
  const paid = txns.reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);
  const remaining = Math.max(planned - paid, 0);
  const currency = s.currency || (AppData.loans.find(l => l.id === s.loanId)?.currency) || '';
  const rows = txns.length ? txns.map(t => `
    <tr>
      <td class="text-mono">${fmtDate(t.date)}</td>
      <td>${escapeHtml(t.method || '—')}</td>
      <td class="text-mono">${escapeHtml(t.currency || currency)} ${fmt(t.amount)}</td>
      <td class="text-muted text-sm">${escapeHtml(t.description || '—')}</td>
      <td style="text-align:right"><button class="btn btn-xs btn-danger" onclick="deleteTransactionFromPaymentModal('${t.id}','${scheduleId}')">✕</button></td>
    </tr>`).join('') : `<tr><td colspan="5" class="text-muted text-sm" style="text-align:center;padding:14px">No actual payments recorded against this installment yet.</td></tr>`;
  const statusLabel = paid <= 0.005 ? 'Planned' : (paid + 0.005 < planned ? 'Partial' : 'Paid');
  return `
    <div class="form-section" style="margin-top:14px">
      <div class="form-section-title">Related Actual Payments</div>
      <div class="kpi-grid kpi-grid-3" style="margin-bottom:12px">
        <div class="kpi-card green"><div class="kpi-label">Total Paid Against Installment</div><div class="kpi-value text-green" style="font-size:15px">${escapeHtml(currency)} ${fmt(paid)}</div></div>
        <div class="kpi-card ${remaining > 0.005 ? 'yellow' : 'green'}"><div class="kpi-label">Remaining</div><div class="kpi-value ${remaining > 0.005 ? 'text-yellow' : 'text-green'}" style="font-size:15px">${escapeHtml(currency)} ${fmt(remaining)}</div></div>
        <div class="kpi-card"><div class="kpi-label">Calculated Status</div><div class="kpi-value" style="font-size:15px">${escapeHtml(statusLabel)}</div><div class="kpi-sub">Based on linked transactions</div></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Method</th><th>Amount</th><th>Note</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="currency-note">These payments are read from the Transactions module using this installment ID. Deleting or adding payments recalculates this installment status automatically.</div>
    </div>`;
}

function updateManualPaymentDerivedFields() {
  const loanId = document.getElementById('mp_loan')?.value;
  const dueDate = document.getElementById('mp_due')?.value;

  if (amountEl) {
    const isEarly = document.getElementById('mp_early')?.checked || false;
    if (isEarly) {

      amountEl.value = c ? Math.max(0, c.remaining) : (amountEl.value || '');
    } else if (!amountEl.value) {
      const derived = getLoanDerivedInstallment(loan);
      if (derived > 0) amountEl.value = derived;
    }
  }

  const loanId = document.getElementById('mp_loan').value;

function getFilteredScheduleRows() {
  let scheds = [...AppData.schedules];
  if (schedFilter.search) {
    const q = schedFilter.search.toLowerCase();
    scheds = scheds.filter(s => (s.loanName||'').toLowerCase().includes(q) || (s.notes||'').toLowerCase().includes(q) || (s.referenceNumber||'').toLowerCase().includes(q));
  }
  if (schedFilter.loanId) scheds = scheds.filter(s => s.loanId === schedFilter.loanId);
  if (schedFilter.status) scheds = scheds.filter(s => s.status === schedFilter.status);
  if (schedFilter.month) scheds = scheds.filter(s => s.dueDate && s.dueDate.startsWith(schedFilter.month));
  if (schedFilter.quick === 'today') scheds = scheds.filter(s => s.dueDate === today());
  if (schedFilter.quick === 'overdue') scheds = scheds.filter(s => s.dueDate && s.dueDate < today() && s.status !== 'Paid' && s.status !== 'Cancelled');
  if (schedFilter.quick === 'next7') { const lim = addDaysISO(today(), ALERT_SOON_DAYS); scheds = scheds.filter(s => s.dueDate && s.dueDate >= today() && s.dueDate <= lim && s.status !== 'Paid' && s.status !== 'Cancelled' && s.status !== 'Skipped'); }
  scheds.forEach(normalizeScheduleRecord);
  scheds.sort((a,b) => {
    let av = a[schedSort.col]||'', bv = b[schedSort.col]||'';
    if (schedSort.col === 'loanName') {
      const la = AppData.loans.find(l => l.id === a.loanId || l.name === a.loanName);
      const lb = AppData.loans.find(l => l.id === b.loanId || l.name === b.loanName);
      const seq = getLoanSequence(la) - getLoanSequence(lb);
      if (seq !== 0) return seq * schedSort.dir;
    }
    return (av < bv ? -1 : av > bv ? 1 : 0) * schedSort.dir;
  });
  return scheds;
}

async function handleScheduleImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  try {
    let rows;
    const name = file.name.toLowerCase();
    if (name.endsWith('.xlsx')) rows = await readXlsxFirstSheet(file);
    else if (name.endsWith('.xls')) rows = await readExcelCompatibleFile(file);
    else rows = parseCSV(await file.text());
    scheduleImportRows = buildScheduleImportRows(rowsToObjects(rows));
    renderScheduleImportPreview();
  } catch (err) {
    scheduleImportRows = [];
    document.getElementById('sch_import_preview').innerHTML = `<div class="dq-item error"><div class="dq-icon">✕</div><div class="dq-content"><div class="dq-title">Import failed</div><div class="dq-desc">${escapeHtml(err.message || String(err))}</div></div></div>`;
    document.getElementById('sch_import_confirm').disabled = true;
  }
}

async function readExcelCompatibleFile(file) {
  const text = await file.text();
  if (text.includes('<table')) return parseHtmlTable(text);
  if (text.includes('<?xml') || text.includes('<Workbook')) return parseSpreadsheetXml(text);
  return parseCSV(text);
}

function parseHtmlTable(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const table = doc.querySelector('table');
  if (!table) throw new Error('No table found in Excel file.');
  return [...table.querySelectorAll('tr')].map(tr => [...tr.children].map(td => td.textContent.trim())).filter(r => r.length);
}

function parseSpreadsheetXml(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  const rows = [...doc.getElementsByTagName('Row')].map(row => [...row.getElementsByTagName('Cell')].map(cell => cell.textContent.trim()));
  if (!rows.length) throw new Error('No rows found in Excel XML file.');
  return rows;
}

async function readXlsxFirstSheet(file) {
  if (!('DecompressionStream' in window)) throw new Error('This browser cannot parse .xlsx offline. Please use CSV or Excel-compatible .xls.');
  const buffer = await file.arrayBuffer();
  const entries = parseZipEntries(buffer);
  const sheetName = entries['xl/worksheets/sheet1.xml'] ? 'xl/worksheets/sheet1.xml' : Object.keys(entries).find(k => k.startsWith('xl/worksheets/sheet'));
  if (!sheetName) throw new Error('No worksheet found in .xlsx file.');
  const sharedText = entries['xl/sharedStrings.xml'] ? await unzipEntryText(buffer, entries['xl/sharedStrings.xml']) : '';
  const sheetText = await unzipEntryText(buffer, entries[sheetName]);
  return parseXlsxSheetXml(sheetText, sharedText);
}

function parseZipEntries(buffer) {
  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Invalid .xlsx file.');
  const count = view.getUint16(eocd + 10, true);
  const dirOffset = view.getUint32(eocd + 16, true);
  const entries = {};
  let ptr = dirOffset;
  for (let i = 0; i < count; i++) {
    if (view.getUint32(ptr, true) !== 0x02014b50) break;
    const method = view.getUint16(ptr + 10, true);
    const compressedSize = view.getUint32(ptr + 20, true);
    const uncompressedSize = view.getUint32(ptr + 24, true);
    const nameLen = view.getUint16(ptr + 28, true);
    const extraLen = view.getUint16(ptr + 30, true);
    const commentLen = view.getUint16(ptr + 32, true);
    const localOffset = view.getUint32(ptr + 42, true);
    const name = new TextDecoder().decode(bytes.slice(ptr + 46, ptr + 46 + nameLen));
    entries[name] = { method, compressedSize, uncompressedSize, localOffset };
    ptr += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

async function unzipEntryText(buffer, entry) {
  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  let ptr = entry.localOffset;
  if (view.getUint32(ptr, true) !== 0x04034b50) throw new Error('Invalid ZIP local header.');
  const nameLen = view.getUint16(ptr + 26, true);
  const extraLen = view.getUint16(ptr + 28, true);
  const dataStart = ptr + 30 + nameLen + extraLen;
  const data = bytes.slice(dataStart, dataStart + entry.compressedSize);
  if (entry.method === 0) return new TextDecoder().decode(data);
  if (entry.method !== 8) throw new Error('Unsupported Excel compression method.');
  const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const out = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(out);
}

function parseXlsxSheetXml(sheetText, sharedText) {
  const parser = new DOMParser();
  const shared = [];
  if (sharedText) {
    const sharedDoc = parser.parseFromString(sharedText, 'application/xml');
    [...sharedDoc.getElementsByTagName('si')].forEach(si => shared.push([...si.getElementsByTagName('t')].map(t => t.textContent).join('')));
  }
  const doc = parser.parseFromString(sheetText, 'application/xml');
  const rows = [];
  [...doc.getElementsByTagName('row')].forEach(row => {
    const out = [];
    [...row.getElementsByTagName('c')].forEach(cell => {
      const ref = cell.getAttribute('r') || '';
      const colLetters = ref.replace(/\d+/g, '');
      const colIndex = colLetters ? colLetters.split('').reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0) - 1 : out.length;
      const type = cell.getAttribute('t');
      const v = cell.getElementsByTagName('v')[0]?.textContent || '';
      out[colIndex] = type === 's' ? (shared[parseInt(v, 10)] || '') : v;
    });
    if (out.some(v => String(v || '').trim() !== '')) rows.push(out.map(v => v || ''));
  });
  return rows;
}

function buildScheduleImportRows(objects) {
  return objects.map(obj => {
    const loanName = pickField(obj, ['LoanName','Loan Name','Loan','LoanName']);
    const dueDate = normalizeDateInput(pickField(obj, ['DueDate','Due Date','Date','Payment Date']));
    const amount = normalizeAmount(pickField(obj, ['Amount','Payment Amount','Installment','Installment Amount']));
    const status = normalizePaymentStatus(pickField(obj, ['Status','Payment Status']));
    const paidDate = normalizeDateInput(pickField(obj, ['PaidDate','Paid Date']));
    const paymentMethod = pickField(obj, ['Method','PaymentMethod','Payment Method']);
    const notes = pickField(obj, ['Notes','Note','Remarks']);
    const earlyFlagRaw = pickField(obj, ['EarlySettlement','Early Settlement','IsEarlySettlement','Settlement Payment']);
    const isEarlySettlement = ['yes','y','true','1','early','early settlement'].includes(String(earlyFlagRaw).trim().toLowerCase());
    const loan = AppData.loans.find(l => l.name.toLowerCase() === String(loanName).toLowerCase()) || AppData.loans.find(l => String(loanName).toLowerCase().includes(l.name.toLowerCase()));
    const errors = [];
    if (!loanName) errors.push('Loan is missing');
    if (loanName && !loan) errors.push('Loan not found');
    if (!dueDate) errors.push('Due date is invalid/missing');
    if (amount <= 0) errors.push('Amount must be > 0');
    const reference = loan && dueDate ? generatePaymentReference(loan.id, dueDate) : '';
    return { rowNumber: obj.__rowNumber, loanName, loan, dueDate, amount, status, paidDate, paymentMethod: normalizePaymentMethodValue(paymentMethod), notes, isEarlySettlement, reference, currency: loan?.currency || '', errors };
  });
}

function validateScheduleImportEarlySettlementRows() {
  const importEarlyByLoan = {};
  scheduleImportRows.forEach(r => {
    r.errors = (r.errors || []).filter(e => !String(e).includes('Early settlement'));
  });
  scheduleImportRows.forEach(r => {
    if (!r.isEarlySettlement || !r.loan) return;
    const existing = getExistingEarlySettlementForLoan(r.loan.id, '');
    if (existing && (existing.referenceNumber || generatePaymentReference(existing.loanId, existing.dueDate)) !== r.reference) {
      r.errors.push(`Early settlement already exists for this loan: ${existing.referenceNumber || generatePaymentReference(existing.loanId, existing.dueDate)}`);
    }
    if (importEarlyByLoan[r.loan.id] && importEarlyByLoan[r.loan.id] !== r.reference) {
      r.errors.push('Multiple early settlement rows found for the same loan in this import');
    }
    importEarlyByLoan[r.loan.id] = r.reference;
  });
}

function confirmScheduleImport() {
  validateScheduleImportEarlySettlementRows();
  const mode = document.getElementById('sch_import_mode').value;
  const validRows = scheduleImportRows.filter(r => !r.errors.length);
  setAuditAction(`Imported payment schedule rows (${mode})`);
  let added = 0, updated = 0, skipped = 0;
  const affectedLoans = new Set();
  validRows.forEach(r => {
    const existing = AppData.schedules.find(s => (s.referenceNumber || generatePaymentReference(s.loanId, s.dueDate)) === r.reference);
    if (existing && (mode === 'upsert' || mode === 'update')) {
      existing.loanId = r.loan.id;
      existing.loanName = r.loan.name;
      existing.dueDate = r.dueDate;
      existing.paymentMonth = r.dueDate.slice(0, 7);
      existing.amount = r.amount;
      existing.currency = r.loan.currency;
      existing.status = r.status;
      existing.paidDate = r.paidDate || (r.status === 'Paid' ? today() : '');
      existing.paymentMethod = r.paymentMethod;
      existing.notes = r.notes;
      existing.isEarlySettlement = r.isEarlySettlement;
      normalizeScheduleRecord(existing);
      if (existing.status === 'Paid' && existing.isEarlySettlement) applyEarlySettlementCompletion(existing);
      updated++;
      affectedLoans.add(r.loan.id);
    } else if (!existing && (mode === 'upsert' || mode === 'append')) {
      AppData.schedules.push(normalizeScheduleRecord({
        id: genId('sch'),
        loanId: r.loan.id,
        loanName: r.loan.name,
        dueDate: r.dueDate,
        paymentMonth: r.dueDate.slice(0, 7),
        amount: r.amount,
        currency: r.loan.currency,
        status: r.status,
        paidDate: r.paidDate || (r.status === 'Paid' ? today() : ''),
        paymentMethod: r.paymentMethod,
        referenceNumber: r.reference,
        isEarlySettlement: r.isEarlySettlement,
        notes: r.notes,
        createdDate: today()
      }));
      added++;
      affectedLoans.add(r.loan.id);
    } else {
      skipped++;
    }
  });
  affectedLoans.forEach(recalcLoanActualPaid);
  saveData();
  closeModal();

function getExpenseDueDay(exp) {
  if (!exp) return '';
  if (exp.dueDay !== undefined && exp.dueDay !== null && String(exp.dueDay).trim() !== '') return String(exp.dueDay);
  if (exp.dueDate) {
    const d = new Date(exp.dueDate);
    if (!isNaN(d)) return String(d.getDate());
  }
  return '';
}

function lastDayOfMonth(year, monthIndex) {
  return new Date(year, monthIndex + 1, 0).getDate();
}

function getMonthlyExpenseDueDate(exp, monthStr) {
  const base = monthStr || today().slice(0, 7);
  const [yearStr, monthNumStr] = base.split('-');
  const year = parseInt(yearStr, 10);
  const monthIndex = parseInt(monthNumStr, 10) - 1;
  if (isNaN(year) || isNaN(monthIndex)) return '';
  const last = lastDayOfMonth(year, monthIndex);
  const dueDayRaw = getExpenseDueDay(exp);
  let day;
  if (!dueDayRaw) return '';
  if (String(dueDayRaw).toUpperCase() === 'EOM') day = last;
  else {
    day = parseInt(dueDayRaw, 10);
    if (isNaN(day) || day < 1) return '';
    if (day > last) day = last;
  }
  return `${yearStr}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

function getExpenseEffectiveDueDate(exp, monthStr) {
  if (!exp) return '';
  if (exp.frequency === 'Monthly') return getMonthlyExpenseDueDate(exp, monthStr);
  return exp.dueDate || '';
}

function getExpenseTiming(exp) {
  if (exp.status === 'Paid') return { label: exp.paidDate ? `Paid ${fmtDate(exp.paidDate)}` : 'Paid', cls: 'text-green' };
  if (exp.status === 'Cancelled') return { label: 'Cancelled', cls: 'text-muted' };
  const t = today();
  const thisMonth = t.slice(0,7);
  const nextMonth = addMonths(t, 1).slice(0,7);
  const due = getExpenseEffectiveDueDate(exp, thisMonth);
  if (!due) return { label: exp.frequency === 'Monthly' ? 'No Due Day' : 'No Due Date', cls: 'text-muted' };
  if (due < t) return { label: 'Overdue', cls: 'text-red' };
  if (due === t) return { label: 'Due Today', cls: 'text-yellow' };
  if (due.slice(0,7) === thisMonth) return { label: exp.frequency === 'Monthly' ? `This Month · Day ${getExpenseDueDay(exp)}` : 'This Month', cls: 'text-yellow' };
  if (due.slice(0,7) === nextMonth) return { label: 'Next Month', cls: 'text-cyan' };
  return { label: 'Upcoming', cls: 'text-muted' };
}

function getFilteredExpenses() {
  let exps = [...AppData.expenses];
  if (expFilter.search) {
    const q = expFilter.search.toLowerCase();
    exps = exps.filter(e => (e.name||'').toLowerCase().includes(q) || (e.notes||'').toLowerCase().includes(q) || (e.paymentMethod||'').toLowerCase().includes(q));
  }
  if (expFilter.status) exps = exps.filter(e => e.status === expFilter.status);
  if (expFilter.category) exps = exps.filter(e => e.category === expFilter.category);
  if (expFilter.freq) exps = exps.filter(e => e.frequency === expFilter.freq);
  if (expFilter.quick) {
    const t = today();
    const thisMonth = t.slice(0,7);
    const nextMonth = addMonths(t, 1).slice(0,7);
    exps = exps.filter(e => {
      const dueThisMonth = getExpenseEffectiveDueDate(e, thisMonth);
      const dueNextMonth = getExpenseEffectiveDueDate(e, nextMonth);
      if (expFilter.quick === 'thisMonth') return !!dueThisMonth && dueThisMonth.slice(0,7) === thisMonth;
      if (expFilter.quick === 'nextMonth') return !!dueNextMonth && dueNextMonth.slice(0,7) === nextMonth;
      if (expFilter.quick === 'today') return dueThisMonth === t;
      if (expFilter.quick === 'overdue') return e.status !== 'Paid' && e.status !== 'Cancelled' && !!dueThisMonth && dueThisMonth < t;
      if (expFilter.quick === 'unpaid') return e.status !== 'Paid' && e.status !== 'Cancelled';
      if (expFilter.quick === 'paid') return e.status === 'Paid';
      return true;
    });
  }
  return exps;
}

function getSelectedExpenseIds() {
  return [...expSelected].filter(id => AppData.expenses.some(e => e.id === id));
}

function updateExpenseSelectionUI() {
  expSelected = new Set(getSelectedExpenseIds());
  const selectedCount = expSelected.size;
  let visibleSelected = 0;
  document.querySelectorAll('.exp-chk').forEach(c => {
    const isSelected = expSelected.has(c.dataset.id);
    c.checked = isSelected;
    if (isSelected) visibleSelected++;
    const row = c.closest('tr');
    if (row) row.classList.toggle('row-selected', isSelected);
  });
  const visible = document.querySelectorAll('.exp-chk').length;
  const allChk = document.getElementById('exp-all-chk');
  if (allChk) allChk.checked = visible > 0 && visibleSelected === visible;
  const bar = document.getElementById('expense-bulk-bar');
  if (bar) bar.classList.toggle('bulk-bar-empty', selectedCount === 0);
  const count = document.getElementById('expense-selected-count');
  if (count) count.textContent = selectedCount;
  const label = document.getElementById('expense-selected-label');
  if (label) label.textContent = selectedCount ? `expense record${selectedCount===1?'':'s'} selected${visibleSelected ? ` · ${visibleSelected} visible` : ''}` : 'No expense records selected';
}

function setExpenseSelection(id, selected, updateUI=true) {
  if (!id) return;
  if (!window.expSelected) window.expSelected = new Set();
  if (selected) expSelected.add(id); else expSelected.delete(id);
  if (updateUI) updateExpenseSelectionUI();
}

function toggleExpenseSelection(id, checked) {
  setExpenseSelection(id, checked, true);
}

function handleExpenseRowClick(event, id) {
  if (event.target.closest('button,input,select,textarea,a,.table-actions')) return;
  if (!window.expSelected) window.expSelected = new Set();
  if (expRowClickTimer) clearTimeout(expRowClickTimer);
  expLastClickId = id;
  expRowClickTimer = setTimeout(() => {
    if (expSelected.has(id)) expSelected.delete(id); else expSelected.add(id);
    updateExpenseSelectionUI();
    expRowClickTimer = null;
    expLastClickId = null;
  }, 220);
}

function handleExpenseRowDblClick(event, id) {
  if (event.target.closest('button,input,select,textarea,a,.table-actions')) return;
  if (expRowClickTimer) {
    clearTimeout(expRowClickTimer);
    expRowClickTimer = null;
    expLastClickId = null;
  }
  openExpenseForm(id);
}

function toggleAllExpenseCheck(chk) {
  const ids = [...document.querySelectorAll('.exp-chk')].map(c => c.dataset.id);
  ids.forEach(id => chk.checked ? expSelected.add(id) : expSelected.delete(id));
  updateExpenseSelectionUI();
}

function selectCurrentExpensePage() {
  [...document.querySelectorAll('.exp-chk')].forEach(c => expSelected.add(c.dataset.id));

  if (!name) { showToast('Expense name required', 'error'); return; }
  const status = document.getElementById('ex_status').value;
  const obj = {

  if (document.getElementById('bu_ex_day_chk').checked) updates.dueDay = document.getElementById('bu_ex_day').value;
  if (document.getElementById('bu_ex_paid_chk').checked) updates.paidDate = document.getElementById('bu_ex_paid').value;
  if (document.getElementById('bu_ex_cat_chk').checked) updates.category = document.getElementById('bu_ex_cat').value;
  if (document.getElementById('bu_ex_freq_chk').checked) updates.frequency = document.getElementById('bu_ex_freq').value;
  if (document.getElementById('bu_ex_curr_chk').checked) updates.currency = document.getElementById('bu_ex_curr').value;
  if (document.getElementById('bu_ex_method_chk').checked) updates.paymentMethod = normalizePaymentMethodValue(document.getElementById('bu_ex_method').value);
  if (document.getElementById('bu_ex_notes_chk').checked) updates.notes = document.getElementById('bu_ex_notes').value;
  if (!Object.keys(updates).length) { showToast('Choose at least one field to update', 'warning'); return; }
  setAuditAction(`Bulk updated ${ids.length} expenses`);
  ids.forEach(id => {
    const e = AppData.expenses.find(x => x.id === id);
    if (e) {
      Object.assign(e, updates);
      if (updates.frequency === 'Monthly') { e.dueDate = ''; if (!e.dueDay) e.dueDay = '1'; }
      if (updates.status === 'Paid' && !e.paidDate) e.paidDate = today();
      if (updates.status && updates.status !== 'Paid' && !Object.prototype.hasOwnProperty.call(updates, 'paidDate')) e.paidDate = '';
      if (Object.prototype.hasOwnProperty.call(updates, 'paidDate') && e.status !== 'Paid') e.paidDate = '';
      e.updatedDate = today();
    }
  });

  closeModal();
  showToast(`${ids.length} expenses updated`, 'success');
  refreshExpensesTable();

let dailyExpFilter = { search:'', category:'', month:'', method:'', quick:'' };
let dailyExpSelected = new Set();
let dailyExpRowClickTimer = null;
let dailyExpPage = 1;
const DAILY_EXP_PAGE_SIZE = 12;

function getDailyExpenseCategories() {
  if (!AppData.lookups) AppData.lookups = {};
  const defaults = ['Fuel','Transportation','Fitness','Groceries','Health & Supplements','Snacks & Beverages','Cash Withdrawal','Food & Dining','Government / Fines','Parking / Mobility','Supermarket','Barber','Restaurant','Coffee','Parking','Taxi','Medical','Pharmacy','Kids','Personal','Shopping','Car Maintenance','Car Wash','Mobile Recharge','Laundry','Entertainment','Other'];
  if (!Array.isArray(AppData.lookups.dailyExpenseCategories)) AppData.lookups.dailyExpenseCategories = [];

  // Merge defaults + configured values + categories already used in Daily Expenses.
  // This keeps the lookup user-manageable from Settings without losing historical data.
  const usedCategories = (AppData.dailyExpenses || []).map(r => r.category).filter(Boolean);
  const seen = new Set();
  const clean = [];
  [...AppData.lookups.dailyExpenseCategories, ...usedCategories, ...defaults].forEach(v => {
    const val = String(v || '').trim();
    const key = val.toLowerCase();
    if (!val || seen.has(key)) return;
    seen.add(key);
    clean.push(val);
  });
  AppData.lookups.dailyExpenseCategories = clean;
  return clean;
}
function getFilteredDailyExpenses() {
  let rows = [...(AppData.dailyExpenses || [])];
  if (dailyExpFilter.search) {
    const q = dailyExpFilter.search.toLowerCase();
    rows = rows.filter(r => (r.description||'').toLowerCase().includes(q) || (r.notes||'').toLowerCase().includes(q) || (r.category||'').toLowerCase().includes(q) || (r.merchant||'').toLowerCase().includes(q) || (r.location||'').toLowerCase().includes(q) || (r.cardEnding||'').toLowerCase().includes(q) || (r.originalSMS||'').toLowerCase().includes(q) || (r.transactionTime||'').toLowerCase().includes(q));
  }
  if (dailyExpFilter.category) rows = rows.filter(r => r.category === dailyExpFilter.category);
  if (dailyExpFilter.method) rows = rows.filter(r => r.paymentMethod === dailyExpFilter.method);
  if (dailyExpFilter.month) rows = rows.filter(r => r.date && r.date.slice(0,7) === dailyExpFilter.month);
  if (dailyExpFilter.quick === 'today') rows = rows.filter(r => r.date === today());
  if (dailyExpFilter.quick === 'yesterday') rows = rows.filter(r => r.date === getYesterdayDate());
  if (dailyExpFilter.quick === 'noTime') rows = rows.filter(r => !getDailyExpenseTime(r));
  if (dailyExpFilter.quick === 'duplicates') rows = rows.filter(r => String(r.possibleDuplicate || 'No') === 'Yes');
  rows.sort((a,b) => {
    const timeDiff = getDailyExpenseTimestamp(b) - getDailyExpenseTimestamp(a);
    if (timeDiff) return timeDiff;
    const fallbackDiff = getDailyExpenseFallbackSort(b) - getDailyExpenseFallbackSort(a);
    if (fallbackDiff) return fallbackDiff;
    return String(b.id || '').localeCompare(String(a.id || ''));
  });
  return rows;
}

function saveDailyExpense(id='') {
  const date = document.getElementById('dex_date')?.value || today();
  const merchant = document.getElementById('dex_merchant')?.value.trim() || '';
  const description = document.getElementById('dex_desc')?.value.trim() || (merchant ? `Purchase at ${merchant}` : '');
  const amount = normalizeAmount(document.getElementById('dex_amt')?.value);
  if (!description) { showToast('Description is required', 'error'); return; }
  if (amount <= 0) { showToast('Amount must be greater than 0', 'error'); return; }
  const balanceRaw = document.getElementById('dex_balance')?.value;
  const obj = {
    date,
    transactionTime: normalizeTimeInput(document.getElementById('dex_time')?.value || ''),
    transactionType: document.getElementById('dex_txntype')?.value || 'Purchase',
    category: document.getElementById('dex_cat')?.value || 'Other',
    description,
    amount,
    currency: document.getElementById('dex_curr')?.value || 'AED',
    paymentMethod: normalizePaymentMethodValue(document.getElementById('dex_method')?.value || ''),
    merchant,
    location: document.getElementById('dex_location')?.value.trim() || '',
    cardEnding: document.getElementById('dex_card')?.value.trim() || '',
    balanceAfter: balanceRaw === '' || balanceRaw === null || balanceRaw === undefined ? '' : normalizeAmount(balanceRaw),
    possibleDuplicate: document.getElementById('dex_dup')?.value || 'No',
    originalSMS: document.getElementById('dex_sms')?.value || '',
    notes: document.getElementById('dex_notes')?.value || '',
    updatedDate: today()
  };
  const duplicate = findDailyExpenseDuplicate(obj, id || '');
  if (duplicate && obj.possibleDuplicate !== 'Yes') obj.possibleDuplicate = 'Yes';
  setAuditAction(id ? 'Updated daily expense' : 'Added daily expense');
  if (id) {
    const idx = (AppData.dailyExpenses || []).findIndex(x => x.id === id);
    if (idx >= 0) AppData.dailyExpenses[idx] = { ...AppData.dailyExpenses[idx], ...obj };
  } else {
    obj.id = genId('dex'); obj.createdDate = today(); obj.importedAt = new Date().toISOString(); obj.importOrder = Date.now();
    if (!Array.isArray(AppData.dailyExpenses)) AppData.dailyExpenses = [];
    AppData.dailyExpenses.push(obj);
  }
  saveData(); closeModal(); showToast(id ? 'Daily expense updated' : 'Daily expense added', duplicate ? 'warning' : 'success'); refreshDailyExpensesTable();
}

function deleteDailyExpense(id) {
  const r = (AppData.dailyExpenses||[]).find(x => x.id === id);
  confirmAction(`Delete daily expense <strong>${escapeHtml(r?.description || '')}</strong>?<br><br>This action can be undone.`, function(){
    setAuditAction(`Deleted daily expense: ${r?.description || ''}`);

function deleteSelectedDailyExpenses() {
  const ids = getSelectedDailyExpenseIds();

let dailyExpenseImportRows = [];

function dailyExpenseDuplicateKey(r) {
  const amount = Math.round((normalizeAmount(r.amount) || 0) * 100) / 100;
  const balance = r.balanceAfter === '' || r.balanceAfter === undefined || r.balanceAfter === null ? '' : String(Math.round((normalizeAmount(r.balanceAfter) || 0) * 100) / 100);
  return [
    String(r.date || '').trim(),
    String(r.transactionType || 'Purchase').trim().toLowerCase(),
    String(r.currency || '').trim().toUpperCase(),
    amount,
    String(r.merchant || r.description || '').trim().toLowerCase(),
    String(r.cardEnding || '').trim(),
    balance
  ].join('|');
}

function findDailyExpenseDuplicate(row, ignoreId='') {
  const key = dailyExpenseDuplicateKey(row);
  const sms = String(row.originalSMS || '').trim().toLowerCase();
  return (AppData.dailyExpenses || []).find(existing => {
    if (ignoreId && existing.id === ignoreId) return false;
    const existingSms = String(existing.originalSMS || '').trim().toLowerCase();
    if (sms && existingSms && sms === existingSms) return true;
    return dailyExpenseDuplicateKey(existing) === key;
  }) || null;
}

function categorizeDailyExpense(merchant='', transactionType='Purchase') {
  const m = String(merchant || '').toUpperCase();
  if (String(transactionType).toLowerCase().includes('withdraw')) return 'Cash Withdrawal';
  if (m.includes('ADNOC')) return 'Fuel';
  if (m.includes('CARS TAXI')) return 'Transportation';
  if (m.includes('TIGER GYM')) return 'Fitness';
  if (m.includes('LULU') || m.includes('BAQALA')) return 'Groceries';
  if (m.includes('SPORT INN') || m.includes('ZERO WELLNESS')) return 'Health & Supplements';
  if (m.includes('CRAZY CORN')) return 'Snacks & Beverages';
  if (m.includes('SHAISTAS') || m.includes('ALBAIK') || m.includes('RESTA')) return 'Food & Dining';
  if (m.includes('POLICE')) return 'Government / Fines';
  if (m.includes('Q MOBILITY') || m.includes('PARK')) return 'Parking / Mobility';
  return 'Other';
}

function splitMerchantLocation(raw) {
  const text = String(raw || '').trim().replace(/\s+/g, ' ');
  const parts = text.split(',').map(p => p.trim()).filter(Boolean);
  if (parts.length >= 2) {
    const location = parts.pop();
    return { merchant: parts.join(', ').trim(), location };
  }
  return { merchant: text, location: '' };
}

function titleCaseMerchant(text) {
  return String(text || '').toLowerCase().replace(/\b\w/g, ch => ch.toUpperCase());
}

function parseBankSmsLines(rawText, defaultDate, defaultTime='') {
  const source = String(rawText || '').split(/\n+/).map(x => x.trim()).filter(Boolean);
  const rows = [];
  source.forEach((line, idx) => {
    const text = line.replace(/\s+/g, ' ').trim();
    const m = text.match(/^(Purchase|Cash Withdrawal)\s+of\s+([A-Z]{3})\s*([\d,]+(?:\.\d+)?)\s+with\s+(.+?)\s+ending\s+(\d{3,4})\s+at\s+(.+?)\.\s+Avl\s+Bal(?:ance)?\s+is\s+([A-Z]{3})?\s*([\d,]+(?:\.\d+)?)/i);
    if (!m) {
      rows.push({ __rowNumber: idx + 1, __rawLine: line, __smsParseError: 'Could not parse SMS format' });
      return;
    }
    const transactionType = m[1].replace(/\b\w/g, ch => ch.toUpperCase());
    const currency = m[2].toUpperCase();
    const amount = normalizeAmount(m[3]);
    const paymentMethod = normalizePaymentMethodValue(m[4]);
    const cardEnding = m[5];
    const ml = splitMerchantLocation(m[6]);
    const merchant = ml.merchant.toUpperCase();
    const location = (ml.location || '').toUpperCase().replace('ABUDHABI', 'ABU DHABI');
    const balanceAfter = normalizeAmount(m[8]);
    rows.push({
      __rowNumber: idx + 1,
      date: defaultDate || today(),
      transactiontime: normalizeTimeInput(defaultTime || ''),
      transactiontype: transactionType,
      category: categorizeDailyExpense(merchant, transactionType),
      description: transactionType === 'Cash Withdrawal' ? `Cash withdrawal at ${titleCaseMerchant(merchant)}` : `Purchase at ${titleCaseMerchant(merchant)}`,
      amount: String(amount),
      currency: currency,
      paymentmethod: paymentMethod,
      merchant: merchant,
      location: location,
      cardending: cardEnding,
      balanceafter: String(balanceAfter),
      possibleduplicate: 'No',
      originalsms: text
    });
  });
  return rows;
}

async function handleDailyExpenseImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  try {
    let rows;
    const name = file.name.toLowerCase();
    if (name.endsWith('.xlsx')) rows = await readXlsxFirstSheet(file);
    else if (name.endsWith('.xls')) rows = await readExcelCompatibleFile(file);
    else rows = parseCSV(await file.text());
    dailyExpenseImportRows = buildDailyExpenseImportRows(rowsToObjects(rows));
    renderDailyExpenseImportPreview();
  } catch (err) {
    dailyExpenseImportRows = [];
    const target = document.getElementById('dex_import_preview');
    if (target) target.innerHTML = `<div class="dq-item error"><div class="dq-icon">✕</div><div class="dq-content"><div class="dq-title">Import failed</div><div class="dq-desc">${escapeHtml(err.message || String(err))}</div></div></div>`;
    const confirm = document.getElementById('dex_import_confirm');
    if (confirm) confirm.disabled = true;
  }
}

function previewDailyExpenseSmsImport() {
  const raw = document.getElementById('dex_import_sms')?.value || '';
  const dt = document.getElementById('dex_import_sms_date')?.value || today();

  if (!raw.trim()) { showToast('Paste one or more bank SMS lines first', 'warning'); return; }
  dailyExpenseImportRows = buildDailyExpenseImportRows(parseBankSmsLines(raw, dt, tm));
  renderDailyExpenseImportPreview();
}

function buildDailyExpenseImportRows(objects) {
  const importKeys = new Map();
  return (objects || []).map((obj, idx) => {
    if (obj.__smsParseError) {
      return { rowNumber: obj.__rowNumber || idx + 1, date:'', transactionTime:'', transactionType:'', category:'', description: obj.__rawLine || '', amount:0, currency:'', paymentMethod:'', merchant:'', location:'', cardEnding:'', balanceAfter:'', possibleDuplicate:'No', originalSMS: obj.__rawLine || '', notes:'', errors:[obj.__smsParseError], warnings:[], duplicate:false, existingId:'' };
    }
    const date = normalizeDateInput(pickField(obj, ['Date','TransactionDate','Transaction Date'])) || today();
    const explicitTime = normalizeTimeInput(pickField(obj, ['Time','TransactionTime','Transaction Time','TxnTime','Txn Time']));
    const missingTimeMode = document.getElementById('dex_import_missing_time_mode')?.value || 'blank';
    const transactionTime = explicitTime || (missingTimeMode === 'current' ? nowTimeHHMM() : '');
    const transactionType = pickField(obj, ['TransactionType','Transaction Type','Type']) || 'Purchase';
    const merchant = (pickField(obj, ['Merchant','Store','Vendor','Payee']) || '').trim();
    const category = pickField(obj, ['Category']) || categorizeDailyExpense(merchant, transactionType);
    const description = pickField(obj, ['Description','Name','Details']) || (merchant ? `${transactionType === 'Cash Withdrawal' ? 'Cash withdrawal at' : 'Purchase at'} ${titleCaseMerchant(merchant)}` : 'Daily expense');
    const amount = normalizeAmount(pickField(obj, ['Amount','Value','Transaction Amount']));
    const currency = (pickField(obj, ['Currency','Curr']) || AppData.settings?.defaultCurrency || 'AED').toUpperCase();
    const paymentMethod = normalizePaymentMethodValue(pickField(obj, ['PaymentMethod','Payment Method','Method']));
    const location = pickField(obj, ['Location','City','Place']);
    const cardEnding = pickField(obj, ['CardEnding','Card Ending','Card','Last4','Last 4']);
    const balanceRaw = pickField(obj, ['BalanceAfter','Balance After','AvlBalance','Available Balance']);
    const balanceAfter = balanceRaw === '' ? '' : normalizeAmount(balanceRaw);
    const possibleDuplicateRaw = String(pickField(obj, ['PossibleDuplicate','Possible Duplicate','Duplicate']) || '').toLowerCase();
    const originalSMS = pickField(obj, ['OriginalSMS','Original SMS','SMS','SourceText','Source Text']);
    const notes = pickField(obj, ['Notes','Note','Remarks']);
    const txnId = pickField(obj, ['TxnID','TransactionID','Transaction ID','ID']);
    const row = { rowNumber: obj.__rowNumber || idx + 2, txnId, date, transactionTime, transactionType, category, description, amount, currency, paymentMethod, merchant, location, cardEnding, balanceAfter, possibleDuplicate: ['yes','y','true','1'].includes(possibleDuplicateRaw) ? 'Yes' : 'No', originalSMS, notes, errors:[], warnings:[], duplicate:false, existingId:'' };
    if (!date) row.errors.push('Date is invalid/missing');
    if (!description) row.errors.push('Description is missing');
    if (amount <= 0) row.errors.push('Amount must be > 0');
    if (!currency) row.errors.push('Currency is missing');
    const key = dailyExpenseDuplicateKey(row);
    if (importKeys.has(key)) { row.duplicate = true; row.possibleDuplicate = 'Yes'; row.warnings.push(`Duplicate inside import file (matches row ${importKeys.get(key)})`); }
    else importKeys.set(key, row.rowNumber);
    const existing = findDailyExpenseDuplicate(row);
    if (existing) { row.duplicate = true; row.existingId = existing.id; row.possibleDuplicate = 'Yes'; row.warnings.push('Potential duplicate of an existing daily expense'); }
    return row;
  });
}

function renderDailyExpenseImportPreview() {
  const valid = dailyExpenseImportRows.filter(r => !r.errors.length).length;
  const invalid = dailyExpenseImportRows.length - valid;
  const duplicateCount = dailyExpenseImportRows.filter(r => r.duplicate || r.possibleDuplicate === 'Yes').length;
  const summary = document.getElementById('dex_import_summary');
  if (summary) summary.innerHTML = `${dailyExpenseImportRows.length} rows read · <span class="import-result-ok">${valid} valid</span> · <span class="import-result-error">${invalid} invalid</span> · <span class="text-yellow">${duplicateCount} duplicate warning(s)</span>`;
  const confirm = document.getElementById('dex_import_confirm');
  if (confirm) confirm.disabled = valid === 0;
  const preview = dailyExpenseImportRows.slice(0, 50).map(r => {
    const result = r.errors.length ? `<span class="import-result-error">${escapeHtml(r.errors.join('; '))}</span>` : (r.warnings.length ? `<span class="text-yellow">${escapeHtml(r.warnings.join('; '))}</span>` : '<span class="import-result-ok">Valid</span>');
    return `<tr>
      <td class="mono">${escapeHtml(r.rowNumber)}</td>
      <td class="mono">${escapeHtml(r.date || '—')}</td>
      <td class="mono">${escapeHtml(r.transactionTime || '—')}</td>
      <td>${escapeHtml(r.category || '—')}</td>
      <td><strong>${escapeHtml(r.merchant || '—')}</strong><div class="text-muted text-sm">${escapeHtml(r.description || '')}</div></td>
      <td class="mono">${fmt(r.amount)} ${escapeHtml(r.currency || '')}</td>
      <td>${escapeHtml(r.paymentMethod || '—')}${r.cardEnding ? `<div class="mono text-muted">•••• ${escapeHtml(r.cardEnding)}</div>` : ''}</td>
      <td class="mono">${r.balanceAfter !== '' && r.balanceAfter !== undefined && r.balanceAfter !== null ? fmt(r.balanceAfter) : '—'}</td>
      <td>${result}</td>
    </tr>`;
  }).join('');
  const target = document.getElementById('dex_import_preview');
  if (target) target.innerHTML = `
    <div class="import-preview-wrap mt-8">
      <table><thead><tr><th>Row</th><th>Date</th><th>Time</th><th>Category</th><th>Merchant / Description</th><th>Amount</th><th>Method / Card</th><th>Balance</th><th>Result</th></tr></thead><tbody>${preview || '<tr><td colspan="9"><div class="no-data">No readable rows found</div></td></tr>'}</tbody></table>
    </div>
    ${dailyExpenseImportRows.length > 50 ? '<div class="form-hint mt-8">Preview limited to first 50 rows. All valid rows will be processed.</div>' : ''}
  `;
}

function confirmDailyExpenseImport() {
  const mode = document.getElementById('dex_import_mode')?.value || 'skip';
  const validRows = dailyExpenseImportRows.filter(r => !r.errors.length);
  if (!validRows.length) { showToast('No valid daily expense rows to import', 'warning'); return; }
  if (!Array.isArray(AppData.dailyExpenses)) AppData.dailyExpenses = [];
  setAuditAction(`Imported daily expense rows (${mode})`);
  let added = 0, updated = 0, skipped = 0;
  validRows.forEach(r => {
    const obj = {
      txnId: r.txnId || '', date: r.date, transactionTime: normalizeTimeInput(r.transactionTime || ''), transactionType: r.transactionType || 'Purchase', category: r.category || 'Other', description: r.description,
      amount: r.amount, currency: r.currency || 'AED', paymentMethod: r.paymentMethod || '', merchant: r.merchant || '', location: r.location || '', cardEnding: r.cardEnding || '',
      balanceAfter: r.balanceAfter === '' || r.balanceAfter === undefined || r.balanceAfter === null ? '' : normalizeAmount(r.balanceAfter), possibleDuplicate: r.possibleDuplicate || (r.duplicate ? 'Yes' : 'No'),
      originalSMS: r.originalSMS || '', notes: r.notes || '', updatedDate: today()
    };
    const existing = findDailyExpenseDuplicate(obj);
    if (existing && mode === 'skip') { skipped++; return; }
    if (existing && mode === 'upsert') {
      Object.assign(existing, obj);
      if (!existing.createdDate) existing.createdDate = today();
      existing.importedAt = existing.importedAt || new Date().toISOString();
      existing.importOrder = existing.importOrder || Date.now();
      updated++;
      return;
    }
    obj.id = genId('dex');
    obj.createdDate = today();
    obj.importedAt = new Date().toISOString();
    obj.importOrder = Date.now() + added;
    AppData.dailyExpenses.push(obj);
    added++;
  });
  dailyExpSelected.clear();
  saveData();
  closeModal();
  showToast(`Daily expenses import completed: ${added} added, ${updated} updated, ${skipped} skipped`, 'success', 5000);
  if (currentPage === 'expenses' && expenseView === 'daily') refreshDailyExpensesTable();
  else if (currentPage === 'backup') renderBackup();
}

const LED_PAGE_SIZE = 15;
let ledSort = { col:'date', dir:-1 };
let ledSelected = new Set();

function renderLedger() {
  document.getElementById('topbar-actions').innerHTML = `
    <button class="btn btn-primary btn-sm" onclick="openLedgerForm()">+ Add Record</button>
    <button class="btn btn-ghost btn-sm" onclick="exportLedgerCSV()">↓ CSV</button>
  `;
  refreshLedgerTable();
}

function refreshLedgerTable() {
  let recs = [...AppData.ledger];
  if (ledFilter.search) {
    const q = ledFilter.search.toLowerCase();
    recs = recs.filter(r => (r.personName||'').toLowerCase().includes(q) || (r.event||'').toLowerCase().includes(q) || (r.inkindDesc||'').toLowerCase().includes(q) || (r.notes||'').toLowerCase().includes(q));
  }
  if (ledFilter.direction) recs = recs.filter(r => r.direction === ledFilter.direction);
  if (ledFilter.type) recs = recs.filter(r => r.type === ledFilter.type);
  if (ledFilter.status) recs = recs.filter(r => r.status === ledFilter.status);
  if (ledFilter.owner) recs = recs.filter(r => r.owner === ledFilter.owner);
  if (ledFilter.event) recs = recs.filter(r => r.event === ledFilter.event);

  recs.sort((a,b) => {
    let av = a[ledSort.col]||'', bv = b[ledSort.col]||'';
    return (av < bv ? -1 : av > bv ? 1 : 0) * ledSort.dir;
  });

  const total = recs.length;
  const pages = Math.max(1, Math.ceil(total / LED_PAGE_SIZE));
  if (ledPage > pages) ledPage = pages;
  const paginated = recs.slice((ledPage-1)*LED_PAGE_SIZE, ledPage*LED_PAGE_SIZE);

  // Totals for filtered view
  let filterLina = 0, filterAlayna = 0;
  recs.filter(r=>r.status!=='Cancelled').forEach(r => {
    const v = getLedgerValue(r);
    if (v !== null) {
      if (r.direction==='لينا') filterLina += v;
      else filterAlayna += v;
    }
  });
  const filterNet = filterLina - filterAlayna;

  const eventList = [...new Set(AppData.events.map(e => e.name))];
  const thc = (c) => ledSort.col===c?(ledSort.dir===1?'sort-asc':'sort-desc'):'';
  const th = (c,l) => `<th class="${thc(c)}" onclick="ledSort.col='${c}';ledSort.dir=ledSort.col==='${c}'?-ledSort.dir:1;refreshLedgerTable()">${l}</th>`;

  document.getElementById('content').innerHTML = `
  <div class="kpi-grid kpi-grid-4" style="margin-bottom:16px">
    <div class="kpi-card green">
      <div class="kpi-label">لينا (Filtered)</div>
      <div class="kpi-value text-green" style="font-size:15px">${fmt(filterLina)}</div>
    </div>
    <div class="kpi-card red">
      <div class="kpi-label">علينا (Filtered)</div>
      <div class="kpi-value text-red" style="font-size:15px">${fmt(filterAlayna)}</div>
    </div>
    <div class="kpi-card ${filterNet>=0?'green':'red'}">
      <div class="kpi-label">Net (Filtered)</div>
      <div class="kpi-value ${filterNet>=0?'text-green':'text-red'}" style="font-size:15px">${filterNet>=0?'+':''}${fmt(filterNet)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Records</div>
      <div class="kpi-value">${total}</div>
      <div class="kpi-sub">${recs.filter(r=>r.status==='Open').length} open</div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-header"><span class="panel-title">Family Compensation Ledger</span></div>
    <div class="panel-body">
      <div class="filter-bar">
        <div class="search-input-wrap">
          <span class="search-icon">⌕</span>
          <input type="text" placeholder="Search person, event, description..." value="${escapeHtml(ledFilter.search)}"
            oninput="ledFilter.search=this.value;ledPage=1;refreshLedgerTable()">
        </div>
        <select class="filter-select" onchange="ledFilter.direction=this.value;ledPage=1;refreshLedgerTable()">
          <option value="">All Directions</option>
          <option value="لينا" ${ledFilter.direction==='لينا'?'selected':''}>لينا (Receivable)</option>
          <option value="علينا" ${ledFilter.direction==='علينا'?'selected':''}>علينا (Payable)</option>
        </select>
        <select class="filter-select" onchange="ledFilter.type=this.value;ledPage=1;refreshLedgerTable()">
          <option value="">All Types</option>
          <option value="Cash" ${ledFilter.type==='Cash'?'selected':''}>Cash</option>
          <option value="Other" ${ledFilter.type==='Other'?'selected':''}>In-Kind</option>
        </select>
        <select class="filter-select" onchange="ledFilter.status=this.value;ledPage=1;refreshLedgerTable()">
          <option value="">All Statuses</option>
          ${AppData.lookups.recordStatuses.map(s=>`<option value="${s}" ${ledFilter.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select class="filter-select" onchange="ledFilter.owner=this.value;ledPage=1;refreshLedgerTable()">
          <option value="">All Owners</option>
          ${AppData.lookups.owners.map(o=>`<option value="${o}" ${ledFilter.owner===o?'selected':''}>${o}</option>`).join('')}
        </select>
        <select class="filter-select" onchange="ledFilter.event=this.value;ledPage=1;refreshLedgerTable()">
          <option value="">All Events</option>
          ${eventList.map(e=>`<option value="${e}" ${ledFilter.event===e?'selected':''}>${escapeHtml(e)}</option>`).join('')}
        </select>
        <button class="btn btn-xs btn-ghost" onclick="ledFilter={search:'',direction:'',type:'',status:'',owner:'',event:''};ledPage=1;refreshLedgerTable()">Clear</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:32px"><input type="checkbox" id="led-all-chk" onchange="toggleAllLedCheck(this)"></th>
            ${th('personName','Person')}
            ${th('direction','Direction')}
            ${th('type','Type')}
            ${th('amount','Amount')}
            <th>Value</th>
            ${th('event','Event')}
            ${th('date','Date')}
            ${th('owner','Owner')}
            ${th('status','Status')}
            <th>Actions</th>
          </tr></thead>
          <tbody>
            ${paginated.length === 0 ? `<tr><td colspan="12"><div class="no-data"><div class="no-data-icon">⊞</div>No records found</div></td></tr>` :
              paginated.map(r => {
                const val = getLedgerValue(r);
                const settled = r.status === 'Settled';
                return `<tr class="${settled?'settled-row':''}">
                  <td><input type="checkbox" class="led-chk" data-id="${r.id}" ${ledSelected.has(r.id)?'checked':''}></td>
                  <td><strong>${escapeHtml(r.personName)}</strong></td>
                  <td><span class="badge badge-${r.direction==='لينا'?'lina':'alayna'}">${r.direction}</span></td>
                  <td>${r.type==='Other'?`<span class="inkind-tag">In-Kind</span>`:'Cash'}</td>
                  <td class="mono">${r.type==='Cash'&&r.amount!==null&&r.amount!==undefined?fmt(r.amount):'<span class="text-muted">—</span>'}</td>
                  <td class="mono">
                    ${val !== null ? fmt(val) : '<span class="text-yellow">⚠ Missing</span>'}
                    ${r.type==='Other'&&r.inkindDesc?`<div class="text-muted text-sm">${escapeHtml(r.inkindDesc)}</div>`:''}
                  </td>
                  <td class="text-sm">${escapeHtml(r.event||'—')}</td>
                  <td class="mono text-sm">${fmtDate(r.date)}</td>
                  <td class="text-sm text-muted">${r.owner}</td>
                  <td><span class="badge badge-${(r.status||'').toLowerCase().replace(/ /g,'-')}">${r.status}</span></td>
                  <td>
                    <div class="table-actions">
                      ${r.status==='Open'?`<button class="btn btn-xs btn-success" onclick="settleLedger('${r.id}')" title="Settle">✓</button>`:''}
                      <button class="btn btn-xs btn-ghost" onclick="openLedgerForm('${r.id}')" title="Edit">✎</button>
                      <button class="btn btn-xs btn-danger" onclick="deleteLedger('${r.id}')" title="Delete">✕</button>
                    </div>
                  </td>
                </tr>`;
              }).join('')}
          </tbody>
        </table>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
        <div>
          <button class="btn btn-xs btn-success" onclick="bulkSettleLedger()">✓ Settle Selected</button>
        </div>
        ${pages > 1 ? renderPagination(ledPage, pages, 'ledPage', 'refreshLedgerTable') : ''}
      </div>
    </div>
  </div>`;
}

function toggleAllLedCheck(chk) {
  document.querySelectorAll('.led-chk').forEach(c => {
    c.checked = chk.checked;
    if (chk.checked) ledSelected.add(c.dataset.id);
    else ledSelected.delete(c.dataset.id);
  });
}

function bulkSettleLedger() {
  setAuditAction('Bulk settled ledger records');
  const ids = [...document.querySelectorAll('.led-chk:checked')].map(c => c.dataset.id);
  if (!ids.length) { showToast('No records selected', 'warning'); return; }
  ids.forEach(id => {
    const r = AppData.ledger.find(x => x.id === id);
    if (r && r.status === 'Open') { r.status = 'Settled'; r.settlementDate = today(); }
  });
  saveData(); showToast(`${ids.length} records settled`, 'success'); refreshLedgerTable();
}

function settleLedger(id) {
  setAuditAction('Settled ledger record');
  const r = AppData.ledger.find(x => x.id === id);
  if (r) { r.status = 'Settled'; r.settlementDate = today(); saveData(); showToast('Record settled', 'success'); refreshLedgerTable(); }
}

function deleteLedger(id) {
  const r = AppData.ledger.find(x => x.id === id);
  confirmAction(`Delete record for <strong>${escapeHtml(r?.personName)}</strong>?`, function() {
    AppData.ledger = AppData.ledger.filter(x => x.id !== id);
    saveData(); showToast('Record deleted', 'success'); refreshLedgerTable();
  });
}

function openLedgerForm(id) {
  const r = id ? AppData.ledger.find(x => x.id === id) : null;
  const v = r || { personName:'', type:'Cash', direction:'علينا', amount:'', inkindDesc:'', estimatedValue:'', event:'', date:today(), owner:'Me', status:'Open', notes:'' };
  const personOpts = AppData.people.filter(p=>p.active).map(p=>`<option value="${escapeHtml(p.name)}" ${v.personName===p.name?'selected':''}>${escapeHtml(p.name)}</option>`).join('');
  const eventOpts = AppData.events.filter(e=>e.active).map(e=>`<option value="${escapeHtml(e.name)}" ${v.event===e.name?'selected':''}>${escapeHtml(e.name)}</option>`).join('');

  openModal(r ? 'Edit Record' : 'Add Ledger Record', `
    <div class="form-grid form-grid-2">
      <div class="form-group">
        <label class="form-label">Person <span class="required">*</span></label>
        <input id="lr_person" class="form-control" type="text" list="lr_person_list" value="${escapeHtml(v.personName)}">
        <datalist id="lr_person_list">${personOpts}</datalist>
      </div>
      <div class="form-group">
        <label class="form-label">Direction <span class="required">*</span></label>
        <select id="lr_dir" class="form-control">
          <option value="لينا" ${v.direction==='لينا'?'selected':''}>لينا — Receivable (To Us)</option>
          <option value="علينا" ${v.direction==='علينا'?'selected':''}>علينا — Payable (From Us)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select id="lr_type" class="form-control" onchange="toggleLedgerFields()">
          <option value="Cash" ${v.type==='Cash'?'selected':''}>Cash</option>
          <option value="Other" ${v.type==='Other'?'selected':''}>Other / In-Kind</option>
        </select>
      </div>
      <div class="form-group" id="lr_amt_grp">
        <label class="form-label">Amount</label>
        <input id="lr_amount" class="form-control" type="number" value="${v.amount!==null&&v.amount!==undefined?v.amount:''}" placeholder="0">
      </div>
      <div class="form-group" id="lr_inkind_grp" style="grid-column:span 2;display:none">
        <label class="form-label">In-Kind Description</label>
        <input id="lr_inkind" class="form-control" type="text" value="${escapeHtml(v.inkindDesc||'')}" placeholder="e.g. Gold bracelet, Kitchen appliances...">
      </div>
      <div class="form-group" id="lr_est_grp" style="display:none">
        <label class="form-label">Estimated Value</label>
        <input id="lr_estval" class="form-control" type="number" value="${v.estimatedValue!==null&&v.estimatedValue!==undefined?v.estimatedValue:''}" placeholder="Optional">
      </div>
      <div class="form-group">
        <label class="form-label">Event</label>
        <input id="lr_event" class="form-control" type="text" list="lr_event_list" value="${escapeHtml(v.event||'')}">
        <datalist id="lr_event_list">${eventOpts}</datalist>
      </div>
      <div class="form-group">
        <label class="form-label">Date</label>
        <input id="lr_date" class="form-control" type="date" value="${v.date||''}">
      </div>
      <div class="form-group">
        <label class="form-label">Owner / Relation</label>
        <select id="lr_owner" class="form-control">
          ${AppData.lookups.owners.map(o=>`<option value="${o}" ${v.owner===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select id="lr_status" class="form-control">
          ${AppData.lookups.recordStatuses.map(s=>`<option value="${s}" ${v.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="form-group" style="grid-column:span 2">
        <label class="form-label">Notes</label>
        <textarea id="lr_notes" class="form-control">${escapeHtml(v.notes||'')}</textarea>
      </div>
    </div>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveLedger('${id||''}')">Save Record</button>
  `);
  // Init field visibility
  setTimeout(toggleLedgerFields, 50);
}

function toggleLedgerFields() {
  const type = document.getElementById('lr_type')?.value;
  const isOther = type === 'Other';
  const amtGrp  = document.getElementById('lr_amt_grp');
  const inkindGrp = document.getElementById('lr_inkind_grp');
  const estGrp  = document.getElementById('lr_est_grp');
  // Use only style.display — avoids conflict with d-none class
  if (amtGrp)    amtGrp.style.display    = isOther ? 'none' : '';
  if (inkindGrp) inkindGrp.style.display = isOther ? ''     : 'none';
  if (estGrp)    estGrp.style.display    = isOther ? ''     : 'none';
  // Also remove d-none so initial hidden state doesn't persist
  [amtGrp, inkindGrp, estGrp].forEach(el => el && el.classList.remove('d-none'));
}

function saveLedger(id) {
  setAuditAction(id ? 'Updated ledger record' : 'Added ledger record');
  const person = document.getElementById('lr_person').value.trim();
  if (!person) { showToast('Person name is required', 'error'); return; }
  const type = document.getElementById('lr_type').value;
  const amountRaw = document.getElementById('lr_amount')?.value;
  const amount = type === 'Cash' ? (parseFloat(amountRaw) || null) : null;
  const estValRaw = document.getElementById('lr_estval')?.value;
  const estimatedValue = (estValRaw && !isNaN(parseFloat(estValRaw))) ? parseFloat(estValRaw) : null;

  const obj = {
    personName: person,
    type,
    direction: document.getElementById('lr_dir').value,
    amount: type === 'Cash' ? (parseFloat(amountRaw) || null) : null,
    inkindDesc: document.getElementById('lr_inkind')?.value.trim() || '',
    estimatedValue,
    event: document.getElementById('lr_event').value.trim(),
    date: document.getElementById('lr_date').value,
    owner: document.getElementById('lr_owner').value,
    status: document.getElementById('lr_status').value,
    notes: document.getElementById('lr_notes').value.trim(),
    updatedDate: today()
  };

  if (id) {
    const idx = AppData.ledger.findIndex(x => x.id === id);
    if (idx >= 0) AppData.ledger[idx] = { ...AppData.ledger[idx], ...obj };
    showToast('Record updated', 'success');
  } else {
    obj.id = genId('led'); obj.createdDate = today(); obj.tags = [];
    AppData.ledger.push(obj);
    showToast('Record added', 'success');
  }
  saveData(); closeModal(); updateBadges(); refreshLedgerTable();
}

function exportLedgerCSV() {
  const cols = ['Person','Direction','Type','Amount','InKindDesc','EstimatedValue','Event','Date','Owner','Status'];
  const rows = AppData.ledger.map(r =>
    [r.personName,r.direction,r.type,r.amount!==null?r.amount:'',r.inkindDesc||'',r.estimatedValue!==null?r.estimatedValue:'',r.event||'',r.date||'',r.owner,r.status].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')
  );
  downloadCSV('family_ledger.csv', [cols.join(','), ...rows].join('\n'));
}

function renderPeople() {
  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-primary btn-sm" onclick="openPersonForm()">+ Add Person</button>`;
  refreshPeopleTable();
}

function refreshPeopleTable() {
  const content = document.getElementById('content');
  const people = AppData.people;
  content.innerHTML = `
  <div class="panel">
    <div class="panel-header"><span class="panel-title">People / Contacts</span></div>
    <div class="panel-body">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Group / Family Side</th><th>Default Owner</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${people.length === 0 ? `<tr><td colspan="6"><div class="no-data">No people added</div></td></tr>` :
              people.map(p => {
                let balance = 0;
                AppData.ledger.filter(r=>r.personName===p.name&&r.status!=='Cancelled').forEach(r=>{
                  const v = getLedgerValue(r); if (v!==null) balance += r.direction==='لينا'?v:-v;
                });
                return `<tr>
                  <td><strong>${escapeHtml(p.name)}</strong></td>
                  <td class="text-muted text-sm">${escapeHtml(p.group||'—')}</td>
                  <td class="text-sm">${p.defaultOwner}</td>
                  <td class="mono ${balance>=0?'text-green':'text-red'}">${balance>=0?'+':''}${fmt(balance)}</td>
                  <td><span class="badge ${p.active?'badge-active':'badge-cancelled'}">${p.active?'Active':'Inactive'}</span></td>
                  <td>
                    <div class="table-actions">
                      <button class="btn btn-xs btn-ghost" onclick="openPersonForm('${p.id}')">✎</button>
                      <button class="btn btn-xs btn-danger" onclick="deletePerson('${p.id}')">✕</button>
                    </div>
                  </td>
                </tr>`;
              }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function openPersonForm(id) {
  const p = id ? AppData.people.find(x => x.id === id) : null;
  const v = p || { name:'', group:'', defaultOwner:'Me', active:true, notes:'' };
  openModal(p ? 'Edit Person' : 'Add Person', `
    <div class="form-grid form-grid-2">
      <div class="form-group">
        <label class="form-label">Name <span class="required">*</span></label>
        <input id="pn_name" class="form-control" type="text" value="${escapeHtml(v.name)}">
      </div>
      <div class="form-group">
        <label class="form-label">Group / Family Side</label>
        <input id="pn_group" class="form-control" type="text" value="${escapeHtml(v.group||'')}">
      </div>
      <div class="form-group">
        <label class="form-label">Default Owner</label>
        <select id="pn_owner" class="form-control">${AppData.lookups.owners.map(o=>`<option value="${o}" ${v.defaultOwner===o?'selected':''}>${o}</option>`).join('')}</select>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select id="pn_active" class="form-control">
          <option value="true" ${v.active?'selected':''}>Active</option>
          <option value="false" ${!v.active?'selected':''}>Inactive</option>
        </select>
      </div>
      <div class="form-group" style="grid-column:span 2">
        <label class="form-label">Notes</label>
        <textarea id="pn_notes" class="form-control">${escapeHtml(v.notes||'')}</textarea>
      </div>
    </div>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="savePerson('${id||''}')">Save</button>
  `);
}

function savePerson(id) {
  setAuditAction(id ? 'Updated person' : 'Added person');
  const name = document.getElementById('pn_name').value.trim();
  if (!name) { showToast('Name required', 'error'); return; }
  const obj = { name, group: document.getElementById('pn_group').value, defaultOwner: document.getElementById('pn_owner').value, active: document.getElementById('pn_active').value === 'true', notes: document.getElementById('pn_notes').value };
  if (id) {
    const idx = AppData.people.findIndex(p => p.id === id);
    if (idx >= 0) AppData.people[idx] = { ...AppData.people[idx], ...obj };
    showToast('Person updated', 'success');
  } else {
    obj.id = genId('per');
    AppData.people.push(obj);
    showToast('Person added', 'success');
  }
  saveData(); closeModal(); refreshPeopleTable();
}

function deletePerson(id) {
  const p = AppData.people.find(x => x.id === id);
  const linked = AppData.ledger.filter(r => r.personName === p?.name).length;
  const msg = linked > 0 ? `<strong>${escapeHtml(p?.name)}</strong> has ${linked} linked ledger records. Delete person anyway?` : `Delete person <strong>${escapeHtml(p?.name)}</strong>?`;
  confirmAction(msg, function() {
    AppData.people = AppData.people.filter(x => x.id !== id);
    saveData(); showToast('Person deleted', 'success'); refreshPeopleTable();
  });
}

}

  openModal(e ? 'Edit Event' : 'Add Event', `

function saveEvent(id) {
  setAuditAction(id ? 'Updated event' : 'Added event');
  const name = document.getElementById('ev_name').value.trim();
  if (!name) { showToast('Event name required', 'error'); return; }
  const obj = { name, category: document.getElementById('ev_cat').value, defaultAmount: parseFloat(document.getElementById('ev_amt').value)||0, active: document.getElementById('ev_active').value==='true', notes: document.getElementById('ev_notes').value };
  if (id) {
    const idx = AppData.events.findIndex(e => e.id === id);
    if (idx >= 0) AppData.events[idx] = { ...AppData.events[idx], ...obj };
    showToast('Event updated', 'success');
  } else {
    obj.id = genId('evt');
    AppData.events.push(obj);
    showToast('Event added', 'success');
  }
  saveData(); closeModal(); renderEvents();
}

function deleteEvent(id) {
  const e = AppData.events.find(x => x.id === id);
  confirmAction(`Delete event <strong>${escapeHtml(e?.name)}</strong>?`, function() {
    AppData.events = AppData.events.filter(x => x.id !== id);
    saveData(); showToast('Event deleted', 'success'); renderEvents();
  });
}

function renderFamilyBalanceReport() {

function renderDataQualityReport() {
  const warnings = [];
  // Ledger checks
  AppData.ledger.forEach((r,i) => {
    if (!r.personName) warnings.push({ type:'error', title:'Missing Person', desc:`Record #${i+1}: No person name assigned`, category:'Ledger' });
    if (!r.date) warnings.push({ type:'warn', title:'Missing Date', desc:`Record for ${r.personName||'unknown'}: No date`, category:'Ledger' });
    if (!r.event) warnings.push({ type:'warn', title:'Missing Event', desc:`Record for ${r.personName||'unknown'}: No event assigned`, category:'Ledger' });
    if (getLedgerValue(r) === null && r.status !== 'Cancelled') warnings.push({ type:'error', title:'Missing Value', desc:`Record for ${r.personName||'unknown'} (${r.type}): No amount or estimated value`, category:'Ledger' });
    if (r.type==='Other'&&!r.inkindDesc&&r.estimatedValue===null) warnings.push({ type:'warn', title:'In-Kind Without Description', desc:`Record for ${r.personName||'unknown'}: In-kind but no description or value`, category:'Ledger' });
  });
  // Loan checks
  AppData.loans.forEach(l => {
    if (!l.startDate) warnings.push({ type:'warn', title:'Loan Missing Start Date', desc:`${l.name}: No start date — schedule cannot be generated`, category:'Loans' });
    if ((l.actualPaid||0) > (l.totalAmount||0)) warnings.push({ type:'error', title:'Paid Exceeds Total', desc:`${l.name}: Actual paid exceeds total loan amount`, category:'Loans' });
  });
  // Payment schedule checks
  AppData.schedules.forEach((s,i) => {
    const ref = generatePaymentReference(s.loanId, s.dueDate);
    if (!s.referenceNumber) warnings.push({ type:'warn', title:'Missing Schedule Reference', desc:`Payment schedule row #${i+1}: Reference will be auto-generated as ${ref || 'N/A'}`, category:'Schedule' });
    if (s.referenceNumber && ref && s.referenceNumber !== ref) warnings.push({ type:'warn', title:'Schedule Reference Mismatch', desc:`${s.loanName || 'Payment'}: expected ${ref}, found ${s.referenceNumber}`, category:'Schedule' });
    if (s.isEarlySettlement && s.status === 'Paid') { const loan = AppData.loans.find(l => l.id === s.loanId); if (loan && loan.earlySettlementStatus !== 'Completed') warnings.push({ type:'warn', title:'Early Settlement Sync', desc:`${s.loanName || 'Payment'}: paid early settlement should complete the loan.`, category:'Schedule' }); }
    if (!s.currency) warnings.push({ type:'warn', title:'Missing Schedule Currency', desc:`${s.loanName || 'Payment'}: Currency should be derived from loan`, category:'Schedule' });
  });

  // Duplicate name check
  const names = AppData.people.map(p => p.name.toLowerCase().trim());
  const seen = {};
  names.forEach((n,i) => {
    if (seen[n] !== undefined) warnings.push({ type:'warn', title:'Duplicate Person Name', desc:`Duplicate entries: "${AppData.people[i].name}" appears more than once`, category:'People' });
    seen[n] = i;
  });

  const errorCount = warnings.filter(w=>w.type==='error').length;
  const warnCount = warnings.filter(w=>w.type==='warn').length;

  return `<div>
    <div class="kpi-grid kpi-grid-3" style="margin-bottom:16px">
      <div class="kpi-card ${errorCount>0?'red':'green'}">
        <div class="kpi-label">Critical Issues</div>
        <div class="kpi-value ${errorCount>0?'text-red':'text-green'}">${errorCount}</div>
      </div>
      <div class="kpi-card ${warnCount>0?'yellow':'green'}">
        <div class="kpi-label">Warnings</div>
        <div class="kpi-value ${warnCount>0?'text-yellow':'text-green'}">${warnCount}</div>
      </div>
      <div class="kpi-card ${warnings.length===0?'green':''}">
        <div class="kpi-label">Total Issues</div>
        <div class="kpi-value ${warnings.length===0?'text-green':''}">${warnings.length}</div>
        <div class="kpi-sub">${warnings.length===0?'✓ All clean':''}</div>
      </div>
    </div>
    ${warnings.length === 0 ? `<div class="dq-item info"><div class="dq-icon">✓</div><div class="dq-content"><div class="dq-title">No issues found</div><div class="dq-desc">All data looks clean and complete.</div></div></div>` :
      warnings.map(w => `<div class="dq-item ${w.type}">
        <div class="dq-icon">${w.type==='error'?'✕':'⚠'}</div>
        <div class="dq-content">
          <div class="dq-title">${escapeHtml(w.title)}</div>
          <div class="dq-desc">${escapeHtml(w.desc)}</div>
        </div>
        <div class="dq-count">${w.category}</div>
      </div>`).join('')}
  </div>`;
}
