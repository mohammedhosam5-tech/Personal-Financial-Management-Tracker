  return count === 1 ? singleText : mixedText;
}

/* ================================================================
   INCOME & CASHFLOW HELPERS (v4.2)
   Normalizes any frequency to a monthly-equivalent figure so income
   and outflow can be compared on the same monthly basis.
================================================================ */
function frequencyToMonthlyFactor(frequency) {
  switch (String(frequency || 'Monthly')) {
    case 'Monthly':   return 1;
    case 'Quarterly': return 1 / 3;
    case 'Yearly':    return 1 / 12;
    case 'One-time':  return 0; // excluded from recurring monthly cashflow
    default:          return 1;
  }
}

function getActiveIncomeSources(currencyFilter='ALL') {
  return (AppData.incomeSources || []).filter(src => {
    if (!src || src.active === false) return false;
    if (currencyFilter && currencyFilter !== 'ALL' && src.currency !== currencyFilter) return false;
    return true;
  });
}

// Monthly-equivalent income totals grouped by currency
function buildMonthlyIncomeTotals(sources) {
  return buildCurrencyTotals(
    sources,
    src => (parseFloat(src.amount) || 0) * frequencyToMonthlyFactor(src.frequency),
    src => src.currency
  );
}

/* ================================================================
   TRANSACTIONS — ACTUAL MONEY OUT (v4.3)
   A transaction is an actual payment. It auto-links to the planned
   item (a Payment Schedule row or a Planned Expense) it settles,
   and keeps that plan's status/paidDate in sync so the dashboard
   can compare planned vs actual.
================================================================ */
function getTransactions() { return AppData.transactions || (AppData.transactions = []); }

// Resolve the planned item a transaction links to. Returns {type, record, label, currency, plannedAmount} or null.
function resolveTransactionLink(txn) {
  if (!txn || !txn.linkType || !txn.linkId) return null;
  if (txn.linkType === 'schedule') {
    const rec = (AppData.schedules || []).find(s => s.id === txn.linkId);
    if (!rec) return null;
    return { type:'schedule', record:rec, label:`${rec.loanName || 'Loan'} · ${fmtDate(rec.dueDate)}`, currency:rec.currency, plannedAmount:parseFloat(rec.amount)||0 };
  }
  if (txn.linkType === 'expense') {
    const rec = (AppData.expenses || []).find(e => e.id === txn.linkId);
    if (!rec) return null;
    return { type:'expense', record:rec, label:`${rec.name} · ${rec.category}`, currency:rec.currency, plannedAmount:parseFloat(rec.amount)||0 };
  }
  return null;
}

// Sum of all recorded transactions linked to a given plan item.
function sumTransactionsForLink(linkType, linkId) {
  return getTransactions()
    .filter(t => t.linkType === linkType && t.linkId === linkId)
    .reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);
}

// Recompute the linked plan's status from the TOTAL recorded against it.
// < planned  -> Partial,  >= planned -> Paid,  nothing recorded -> Planned.
function recalcPlanStatusFromTransactions(linkType, linkId) {
  const paid = sumTransactionsForLink(linkType, linkId);
  if (linkType === 'schedule') {
    const rec = (AppData.schedules || []).find(s => s.id === linkId);
    if (!rec) return;
    const planned = parseFloat(rec.amount) || 0;
    if (paid <= 0.005) {
      rec.status = 'Planned';
      rec.paidDate = '';
      rec.paymentMethod = '';
    } else if (paid + 0.005 < planned) {
      rec.status = 'Partial';
      rec.paidDate = latestTransactionDate(linkType, linkId) || rec.paidDate || today();
      rec.paymentMethod = latestTransactionMethod(linkType, linkId) || rec.paymentMethod || '';
    } else {
      rec.status = 'Paid';
      rec.paidDate = latestTransactionDate(linkType, linkId) || today();
      rec.paymentMethod = latestTransactionMethod(linkType, linkId) || rec.paymentMethod || '';
    }
  } else if (linkType === 'expense') {
    const rec = (AppData.expenses || []).find(e => e.id === linkId);
    if (!rec) return;
    const planned = parseFloat(rec.amount) || 0;
    if (paid <= 0.005) {
      rec.status = 'Planned';
      rec.paidDate = '';
      rec.paymentMethod = '';
    } else if (paid + 0.005 < planned) {
      rec.status = 'Partial';
      rec.paidDate = latestTransactionDate(linkType, linkId) || rec.paidDate || today();
      rec.paymentMethod = latestTransactionMethod(linkType, linkId) || rec.paymentMethod || '';
    } else {
      rec.status = 'Paid';
      rec.paidDate = latestTransactionDate(linkType, linkId) || today();
      rec.paymentMethod = latestTransactionMethod(linkType, linkId) || rec.paymentMethod || '';
    }
  }
}

function latestTransactionDate(linkType, linkId) {
  const dates = getTransactions()
    .filter(t => t.linkType === linkType && t.linkId === linkId && t.date)
    .map(t => t.date)
    .sort();
  return dates.length ? dates[dates.length - 1] : '';
}

function latestTransactionMethod(linkType, linkId) {
  const rows = getTransactions()
    .filter(t => t.linkType === linkType && t.linkId === linkId)
    .sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')) || String(a.createdDate || '').localeCompare(String(b.createdDate || '')));
  return rows.length ? (rows[rows.length - 1].method || '') : '';
}

function getTransactionsForLink(linkType, linkId) {
  return getTransactions()
    .filter(t => t.linkType === linkType && t.linkId === linkId)
    .sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')) || String(a.createdDate || '').localeCompare(String(b.createdDate || '')));
}

// Mark the linked plan's status after a transaction is created or removed.
function syncPlanStatusFromTransaction(txn, _paid) {
  if (!txn || !txn.linkType || !txn.linkId) return;
  recalcPlanStatusFromTransactions(txn.linkType, txn.linkId);
  if (txn.linkType === 'schedule') {
    const rec = (AppData.schedules || []).find(s => s.id === txn.linkId);
    if (rec && txn.method && rec.status !== 'Planned') rec.paymentMethod = txn.method;
  }
}

// Actual money-out totals (by currency) for a given YYYY-MM month.
function buildActualOutflowTotals(month, currencyFilter='ALL') {
  const totals = {};
  const txnRows = getTransactions().filter(t => t.date && t.date.slice(0,7) === month
    && (currencyFilter === 'ALL' || t.currency === currencyFilter));
  txnRows.forEach(t => addCurrencyTotal(totals, t.currency, parseFloat(t.amount)||0));

  // Daily expenses are real outflows too. Exclude records manually flagged as possible duplicates
  // so the planned-vs-actual insight stays aligned with the cleaned dashboard graphs.
  const dailyRows = (AppData.dailyExpenses || []).filter(e => e.date && e.date.slice(0,7) === month
    && (currencyFilter === 'ALL' || e.currency === currencyFilter)
    && !isPossibleDuplicateDailyExpense(e));
  dailyRows.forEach(e => addCurrencyTotal(totals, e.currency, parseFloat(e.amount)||0));
  return totals;
}
// Planned money-out totals (by currency) for a given YYYY-MM month:
// scheduled loan payments due that month + expenses effectively due that month.
function buildPlannedOutflowTotals(month, currencyFilter='ALL') {
  const totals = {};
  (AppData.schedules || []).forEach(s => {
    if (!s.dueDate || s.dueDate.slice(0,7) !== month) return;
    if (['Cancelled','Skipped'].includes(s.status || '')) return;
    if (currencyFilter !== 'ALL' && s.currency !== currencyFilter) return;
    addCurrencyTotal(totals, s.currency, parseFloat(s.amount)||0);
  });
  (AppData.expenses || []).forEach(e => {
    if (e.status === 'Cancelled') return;
    if (currencyFilter !== 'ALL' && e.currency !== currencyFilter) return;
    const due = getExpenseEffectiveDueDate(e, month);
    if (!due || due.slice(0,7) !== month) return;
    addCurrencyTotal(totals, e.currency, parseFloat(e.amount)||0);
  });
  return totals;
}

// Unpaid OR partially-paid planned items available to record a payment against.
function getUnpaidPlannedItems() {
  const out = [];
  (AppData.schedules || []).forEach(s => {
    if (['Paid','Cancelled','Skipped'].includes(s.status || '')) return;
    const planned = parseFloat(s.amount)||0;
    const already = sumTransactionsForLink('schedule', s.id);
    const remaining = Math.max(planned - already, 0);
    const partTag = already > 0.005 ? ` (${s.currency} ${fmt(remaining)} left)` : '';
    out.push({ value:`schedule:${s.id}`, label:`[Loan] ${s.loanName || 'Loan'} — ${s.currency} ${fmt(planned)} — due ${fmtDate(s.dueDate)}${partTag}`, currency:s.currency, amount: remaining > 0.005 ? remaining : planned, sortKey: s.dueDate || '9999' });
  });
  (AppData.expenses || []).forEach(e => {
    if (['Paid','Cancelled'].includes(e.status || '')) return;
    const planned = parseFloat(e.amount)||0;
    const already = sumTransactionsForLink('expense', e.id);
    const remaining = Math.max(planned - already, 0);
    const partTag = already > 0.005 ? ` (${e.currency} ${fmt(remaining)} left)` : '';
    out.push({ value:`expense:${e.id}`, label:`[Expense] ${e.name} — ${e.currency} ${fmt(planned)}${partTag}`, currency:e.currency, amount: remaining > 0.005 ? remaining : planned, sortKey: getExpenseEffectiveDueDate(e, today().slice(0,7)) || '9999' });
  });
  // Sort chronologically by due date so the dropdown reads in date order.
  out.sort((a,b) => String(a.sortKey).localeCompare(String(b.sortKey)));
  return out;
}

function getLoanSequence(loan) {
  const n = parseFloat(loan?.displaySequence);
  return isFinite(n) ? n : 999999;
}

function getSortedLoans(loans = AppData.loans) {
  return [...(loans || [])].sort((a, b) => {
    const seq = getLoanSequence(a) - getLoanSequence(b);
    if (seq !== 0) return seq;
    return String(a?.name || '').localeCompare(String(b?.name || ''));
  });
}

function getCurrentMonthValue(offset = 0) {
  const d = new Date();
  d.setMonth(d.getMonth() + offset);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function applyScheduleQuickFilter(type) {
  schedSelected.clear();
  schedPage = 1;
  schedFilter.search = '';
  schedFilter.loanId = '';
  schedFilter.status = '';
  schedFilter.quick = type || '';
  if (type === 'thisMonth') { schedFilter.month = getCurrentMonthValue(0); }
  else if (type === 'nextMonth') { schedFilter.month = getCurrentMonthValue(1); }
  else if (type === 'today' || type === 'overdue' || type === 'next7') { schedFilter.month = ''; }
  else { schedFilter.month = ''; schedFilter.quick = ''; }
  refreshScheduleTable();
}

function resetScheduleFilters() {
  schedFilter = { search:'', loanId:'', status:'', month:'', quick:'' };
  schedSelected.clear();
  schedPage = 1;
  refreshScheduleTable();
}

function getLoanDerivedInstallment(loan) {
  if (!loan) return 0;
  // Priority 1: next upcoming unpaid (non-settlement) schedule entry
  const unpaid = (AppData.schedules || [])
    .filter(s => s.loanId === loan.id && s.status !== 'Paid' && s.status !== 'Cancelled' && !s.isEarlySettlement)
    .sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));
  if (unpaid.length > 0 && parseFloat(unpaid[0].amount) > 0) return parseFloat(unpaid[0].amount);
  // Priority 2: remaining balance spread over months left to end date
  const remaining = (parseFloat(loan.totalAmount) || 0) - (parseFloat(loan.actualPaid) || 0);
  if (remaining > 0.01 && loan.endDate) {
    const months = monthsBetween(today(), loan.endDate);
    if (months > 0) return Math.ceil(remaining / months);
  }
  return 0;
}

function getLoanCalc(loan) {
  const totalAmount = parseFloat(loan.totalAmount) || 0;
  const actualPaid = parseFloat(loan.actualPaid) || 0;
  const remaining = totalAmount - actualPaid;
  const paidPct = totalAmount > 0 ? (actualPaid / totalAmount * 100) : 0;
  const monthly = getLoanDerivedInstallment(loan);
  const monthsRemaining = monthly > 0 ? Math.ceil(remaining / monthly) : 0;
  const expectedEnd = monthly > 0 && loan.startDate ? addMonths(today(), monthsRemaining) : loan.endDate;
  return { totalAmount, actualPaid, remaining, paidPct, monthsRemaining, expectedEnd };
}

function getLedgerValue(rec) {
  if (rec.type === 'Cash' && rec.amount !== null && rec.amount !== undefined && !isNaN(parseFloat(rec.amount))) {
    return parseFloat(rec.amount);
  }
  if (rec.estimatedValue !== null && rec.estimatedValue !== undefined && !isNaN(parseFloat(rec.estimatedValue))) {
    return parseFloat(rec.estimatedValue);
  }
  return null;
}

function getNetLedger() {
  let lina = 0, alayna = 0, linaEst = 0, alaynaEst = 0;
  AppData.ledger.filter(r => r.status !== 'Cancelled').forEach(r => {
    const v = getLedgerValue(r);
    if (v !== null) {
      if (r.direction === 'لينا') { lina += v; if (r.type !== 'Cash') linaEst += v; }
      else { alayna += v; if (r.type !== 'Cash') alaynaEst += v; }
    }
  });
  return { lina, alayna, net: lina - alayna, linaEst, alaynaEst };
}

function showToast(msg, type='info', duration=3000) {
  const icons = { success:'✓', error:'✕', warning:'⚠', info:'ℹ' };
  const el = document.createElement('div');

function openModal(title, bodyHTML, footerHTML, size='') {
  const overlay = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-footer').innerHTML = footerHTML || '';
  box.className = 'modal' + (size ? ' modal-'+size : '');
  overlay.classList.remove('d-none');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('d-none');
  document.getElementById('modal-body').innerHTML = '';
  document.getElementById('modal-footer').innerHTML = '';
  pendingConfirmCallback = null;
}

function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    const overlay = document.getElementById('modal-overlay');
    if (overlay && !overlay.classList.contains('d-none')) {
      e.preventDefault();
      closeModal();
    }
  }
});

let pendingConfirmCallback = null;

function confirmAction(msg, onConfirm) {
  pendingConfirmCallback = typeof onConfirm === 'function' ? onConfirm : null;
  openModal('Confirm Action',
    `<div class="confirm-msg">${msg}</div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-danger" onclick="runConfirmAction()">Confirm</button>`,
    'sm'
  );
}

function runConfirmAction() {
  const cb = pendingConfirmCallback;
  pendingConfirmCallback = null;
  closeModal();
  if (typeof cb === 'function') cb();
}

/* ================================================================
   ALERTS & ATTENTION CENTER (v5.3)
================================================================ */
const ALERT_SOON_DAYS = 7;

function addDaysISO(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().split('T')[0];
}

function buildAlerts(dashboardCurrency = 'ALL') {
  const alerts = [];
  const todayDate = today();
  const soonLimit = addDaysISO(todayDate, ALERT_SOON_DAYS);

  const schedules = AppData.schedules.filter(s => scheduleMatchesDashboardCurrency(s, dashboardCurrency));
  const unpaidSchedules = schedules.filter(isUnpaidScheduleForForecast);

  // 1. Overdue installments (same rule as the dashboard Overdue KPI)
  const overdueScheds = unpaidSchedules.filter(s => s.status === 'Missed' || (s.status === 'Planned' && s.dueDate < todayDate));
  if (overdueScheds.length) {
    alerts.push({
      severity: 'critical',
      title: `${overdueScheds.length} overdue installment${overdueScheds.length === 1 ? '' : 's'}`,
      detail: renderCurrencyBreakdownPlain(buildCurrencyTotals(overdueScheds, 'amount', 'currency')) + ' past due — settle or reschedule',
      actionLabel: 'Review →',
      action: "gotoScheduleQuick('overdue')"
    });
  }

  // 2. Installments due within the next 7 days
  const dueSoonScheds = unpaidSchedules.filter(s => s.dueDate && s.dueDate >= todayDate && s.dueDate <= soonLimit);
  if (dueSoonScheds.length) {
    alerts.push({
      severity: 'warning',
      title: `${dueSoonScheds.length} installment${dueSoonScheds.length === 1 ? '' : 's'} due within ${ALERT_SOON_DAYS} days`,
      detail: renderCurrencyBreakdownPlain(buildCurrencyTotals(dueSoonScheds, 'amount', 'currency')) + ' coming up — make sure funds are available',
      actionLabel: 'View →',
      action: "gotoScheduleQuick('next7')"
    });
  }

  const expenses = AppData.expenses.filter(e => expenseMatchesDashboardCurrency(e, dashboardCurrency));
  const thisMonth = todayDate.slice(0, 7);
  const openExpenses = expenses.filter(e => e.status !== 'Paid' && e.status !== 'Cancelled');

  // 3. Overdue planned expenses (same rule as the dashboard KPI)
  const overdueExps = openExpenses.filter(e => { const due = getExpenseEffectiveDueDate(e, thisMonth); return due && due < todayDate; });
  if (overdueExps.length) {
    alerts.push({
      severity: 'critical',
      title: `${overdueExps.length} planned expense${overdueExps.length === 1 ? '' : 's'} overdue`,
      detail: renderCurrencyBreakdownPlain(buildCurrencyTotals(overdueExps, 'amount', 'currency')) + ' unpaid past the due date',
      actionLabel: 'Review →',
      action: "gotoExpenseQuick('overdue')"
    });
  }

  // 4. Planned expenses due within the next 7 days
  const dueSoonExps = openExpenses.filter(e => { const due = getExpenseEffectiveDueDate(e, thisMonth); return due && due >= todayDate && due <= soonLimit; });
  if (dueSoonExps.length) {
    alerts.push({
      severity: 'warning',
      title: `${dueSoonExps.length} planned expense${dueSoonExps.length === 1 ? '' : 's'} due within ${ALERT_SOON_DAYS} days`,
      detail: renderCurrencyBreakdownPlain(buildCurrencyTotals(dueSoonExps, 'amount', 'currency')) + ' to pay soon',
      actionLabel: 'View →',
      action: "gotoExpenseQuick('unpaid')"
    });
  }

  // 5. Net monthly deficit (only when income is configured)
  const incomeSources = getActiveIncomeSources(dashboardCurrency);
  if (incomeSources.length) {
    const incomeTotals = buildMonthlyIncomeTotals(incomeSources);
    const loans = AppData.loans.filter(l => loanMatchesDashboardCurrency(l, dashboardCurrency));
    const activeLoans = loans.filter(isActiveDashboardLoan);
    const outflow = {};
    Object.entries(buildCurrencyTotals(activeLoans, l => getLoanDerivedInstallment(l), l => l.currency)).forEach(([c, v]) => addCurrencyTotal(outflow, c, v));
    Object.entries(buildCurrencyTotals(expenses.filter(e => e.status !== 'Cancelled' && e.frequency === 'Monthly'), 'amount', 'currency')).forEach(([c, v]) => addCurrencyTotal(outflow, c, v));
    const net = subtractCurrencyTotals(incomeTotals, outflow);
    const deficits = sortedCurrencyEntries(net).filter(([, v]) => v < -0.000001);
    if (deficits.length) {
      alerts.push({
        severity: 'warning',
        title: 'Recurring outflow exceeds income',
        detail: deficits.map(([c, v]) => `${c} ${fmt(Math.abs(v))}`).join(' · ') + ' monthly deficit before daily spending',
        actionLabel: 'Analyze →',
        action: "closeModal(); navigate('reports')"
      });
    }
  }

  // 6. Positive: loans near completion
  const nearDone = AppData.loans.filter(l => loanMatchesDashboardCurrency(l, dashboardCurrency))
    .filter(isActiveDashboardLoan)
    .filter(l => { const c = getLoanCalc(l); return c.paidPct >= 80 && c.remaining > 0.01; });
  if (nearDone.length) {
    alerts.push({
      severity: 'info',
      title: `${nearDone.length} loan${nearDone.length === 1 ? '' : 's'} near completion`,
      detail: nearDone.map(l => escapeHtml(l.name)).join(', ') + ' — ≥80% paid, consider early settlement',
      actionLabel: 'Loans →',
      action: "closeModal(); navigate('loans')"
    });
  }

  return alerts;
}

function renderAlertRows(alerts) {
  if (!alerts.length) {
    return `<div class="alert-row ok">
      <span class="alert-sev"></span>
      <div class="alert-text">
        <div class="alert-title">All clear</div>
        <div class="alert-detail">No overdue items, nothing due in the next ${ALERT_SOON_DAYS} days.</div>
      </div>
    </div>`;
  }
  return alerts.map(a => `<div class="alert-row ${a.severity}">
    <span class="alert-sev"></span>
    <div class="alert-text">
      <div class="alert-title">${a.title}</div>
      <div class="alert-detail">${a.detail}</div>
    </div>
    ${a.action ? `<button class="btn btn-xs btn-secondary" onclick="${a.action}">${a.actionLabel || 'Open →'}</button>` : ''}
  </div>`).join('');
}

function renderAlertsPanel(alerts) {
  const critical = alerts.filter(a => a.severity === 'critical').length;
  const warning = alerts.filter(a => a.severity === 'warning').length;
  const summary = alerts.length
    ? `${critical} critical · ${warning} warning · ${alerts.length - critical - warning} info`
    : 'all clear';
  return `<div class="alert-center">
    <div class="alert-center-header">
      <div class="alert-center-title"><span class="dot" style="background:${critical ? 'var(--red)' : warning ? 'var(--yellow)' : 'var(--green)'}"></span> Attention Center</div>
      <div class="alert-center-count">${summary}</div>
    </div>
    <div class="alert-list">${renderAlertRows(alerts)}</div>
  </div>`;
}

function openAlertsCenter() {
  const alerts = buildAlerts('ALL');
  openModal(
    'Alerts & Reminders',
    `<div class="alert-list" style="margin:-4px 0">${renderAlertRows(alerts)}</div>
     <div class="currency-note" style="margin-top:10px">Covers all currencies. Overdue items, payments due within ${ALERT_SOON_DAYS} days, recurring deficit and loans near completion.</div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Close</button>`
  );
}

function updateAlertBell() {
  const bell = document.getElementById('alert-bell');
  const badge = document.getElementById('alert-bell-badge');
  if (!bell || !badge) return;
  const alerts = buildAlerts('ALL');
  const critical = alerts.filter(a => a.severity === 'critical').length;
  const actionable = critical + alerts.filter(a => a.severity === 'warning').length;
  bell.classList.toggle('has-critical', critical > 0);
  if (actionable > 0) {
    badge.style.display = 'flex';
    badge.textContent = actionable > 99 ? '99+' : actionable;
    badge.classList.toggle('warn', critical === 0);
  } else {
    badge.style.display = 'none';
  }
}

    <div class="alert-row ${p.id === reg.active ? 'info' : ''}" style="cursor:default">
      <span class="alert-sev" style="background:${p.id === reg.active ? 'var(--accent)' : 'var(--text-muted)'};box-shadow:none"></span>
      <div class="alert-text">
        <div class="alert-title">${escapeHtml(p.name)} ${p.id === reg.active ? '<span class="kpi-badge neutral" style="margin-left:6px">Active</span>' : ''}</div>
        <div class="alert-detail">${getProfileStorageLabel(p.id)} · created ${fmtDate((p.createdAt || '').slice(0,10)) || '—'}</div>
      </div>
      ${p.id !== reg.active ? `<button class="btn btn-xs btn-secondary" onclick="switchProfile('${p.id}')">Switch →</button>` : ''}
      <button class="btn btn-xs btn-ghost" onclick="renameProfileAction('${p.id}')">Rename</button>
      ${p.id !== reg.active && reg.list.length > 1 ? `<button class="btn btn-xs btn-ghost text-red" onclick="deleteProfileAction('${p.id}')">Delete</button>` : ''}
    </div>`).join('');
  openModal(
    'Profiles',
    `<div class="alert-list" style="border:1px solid var(--border);border-radius:var(--radius)">${rows}</div>
     <div class="divider"></div>
     <div class="form-group">
       <label class="form-label">Create New Profile</label>
       <div class="form-hint">Each profile keeps fully separate data. v6.0 stores main records in IndexedDB for long-term offline use.</div>
       <div style="display:flex;gap:8px;margin-top:8px">
         <input type="text" id="new_profile_name" class="form-control" placeholder="e.g. Family, Business" maxlength="40" style="flex:1">
         <button class="btn btn-primary" onclick="createProfile()">+ Create &amp; Switch</button>
       </div>
     </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Close</button>`
  );
}

async function createProfile() {
  const input = document.getElementById('new_profile_name');
  const name = (input?.value || '').trim();
  if (!name) { showToast('Enter a profile name', 'warning'); return; }
  const reg = getProfilesRegistry();
  if (reg.list.some(p => p.name.toLowerCase() === name.toLowerCase())) { showToast('A profile with this name already exists', 'warning'); return; }
  const id = 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 4);
  try {
    await writeProfileData(id, JSON.parse(JSON.stringify(defaultData)));
  } catch(e) { showToast('Could not create profile: storage is unavailable', 'error'); return; }
  reg.list.push({ id, name, createdAt: new Date().toISOString() });
  reg.active = id;
  saveProfilesRegistry(reg);
  await switchProfile(id);
}

async function switchProfile(id) {
  const reg = getProfilesRegistry();
  if (!reg.list.some(p => p.id === id)) { showToast('Profile not found', 'error'); return; }
  if (id === activeProfileId) { closeModal(); return; }
  await persistQueue;
  persistAppData(); // save current profile before leaving it
  await persistQueue;
  activeProfileId = id;
  reg.active = id;
  saveProfilesRegistry(reg);
  suppressAuditUndo = true;
  await loadData();
  suppressAuditUndo = false;
  applyTheme();
  applySidebarState();
  updateProfileLabel();
  closeModal();
  navigate('dashboard');
  updateBadges();
  updateUndoButton();
  showToast('Switched to profile: ' + (getActiveProfile()?.name || id), 'success');
}

function renameProfileAction(id) {
  const reg = getProfilesRegistry();
  const profile = reg.list.find(p => p.id === id);
  if (!profile) return;
  const name = window.prompt('New name for profile "' + profile.name + '":', profile.name);
  const clean = (name || '').trim();
  if (!clean) return;
  if (reg.list.some(p => p.id !== id && p.name.toLowerCase() === clean.toLowerCase())) { showToast('A profile with this name already exists', 'warning'); return; }
  profile.name = clean;
  saveProfilesRegistry(reg);
  updateProfileLabel();
  openProfileManager();
  showToast('Profile renamed', 'success');
}

function deleteProfileAction(id) {
  const reg = getProfilesRegistry();
  const profile = reg.list.find(p => p.id === id);
  if (!profile) return;
  if (id === reg.active) { showToast('Switch to another profile before deleting this one', 'warning'); return; }
  if (reg.list.length <= 1) { showToast('Cannot delete the last profile', 'warning'); return; }
  confirmAction(`<strong>Delete profile "${escapeHtml(profile.name)}"?</strong><br>All of its data (loans, schedule, expenses, transactions, settings) will be permanently removed from IndexedDB. This cannot be undone.`, async function() {
    await deleteProfileData(id);
    const reg2 = getProfilesRegistry();
    reg2.list = reg2.list.filter(p => p.id !== id);
    saveProfilesRegistry(reg2);
    openProfileManager();
    showToast('Profile deleted', 'success');
  });
}

function printCurrentPage() {
  document.body.setAttribute('data-print-meta',
    'Personal Finance — ' + (getActiveProfile()?.name || 'Personal') + ' · ' + fmtDate(today()) + ' · ' + (document.getElementById('page-title')?.textContent || ''));
  window.print();
}

function compactStorage() {
  confirmAction('Clean temporary undo history for the current profile?<br>This does not delete loans, expenses, transactions, schedules, audit log, or dashboard history.', function() {
    const before = getJsonByteSize(AppData.undoStack || []);
    AppData.undoStack = [];
    suppressAuditUndo = true;
    persistAppData();
    suppressAuditUndo = false;
    updateUndoButton();
    if (currentPage === 'backup') renderBackup();
    showToast('Temporary undo history cleaned — freed about ' + fmtBytes(before), 'success');
  });
}

async function clearMigratedLegacyStorage() {
  await ensureStorageReady();
  if (storageBackend !== 'indexedDB') { showToast('IndexedDB is not active, so legacy Local Storage cannot be cleared safely.', 'warning'); return; }
  const reg = getProfilesRegistry();
  let removed = 0;
  reg.list.forEach(p => {
    const k = dataKey(p.id);
    const raw = localStorage.getItem(k);
    if (raw) {
      removed += raw.length * 2;
      localStorage.removeItem(k);
      try { localStorage.setItem(k + '__migrated_to_indexeddb', new Date().toISOString()); } catch(e) {}
    }
  });
  if (currentPage === 'backup') renderBackup();
  showToast(removed ? 'Legacy Local Storage copies cleared — freed about ' + fmtBytes(removed) : 'No legacy Local Storage copies found', removed ? 'success' : 'info');
}

  return `

    <div class="panel-body">

      ${usingIDB ? `
        <div class="progress-bar" style="margin:10px 0 6px"><div class="progress-fill" style="width:100%;background:var(--green)"></div></div>
        <div class="form-hint">IndexedDB lifetime storage is active. The app no longer depends on the small ~5 MB Local Storage limit for main financial records.</div>
      ` : `
        <div class="progress-bar" style="margin:10px 0 6px"><div class="progress-fill" style="width:${u.pct}%;background:${u.pct >= 85 ? 'var(--red)' : u.pct >= 60 ? 'var(--yellow)' : 'var(--green)'}"></div></div>

      ${legacyWarning}

function getEffectiveTheme() {
  const selected = AppData.settings?.theme || 'dark';
  if (selected === 'auto') {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  return selected === 'light' ? 'light' : 'dark';

  if (label) label.textContent = selected === 'auto' ? `Theme: Auto (${effective})` : `Theme: ${selected.charAt(0).toUpperCase() + selected.slice(1)}`;

function isFinanciallyCompletedLoan(loan) {
  if (!loan) return false;
  const c = getLoanCalc(loan);
  return (loan.status === 'Completed') || c.remaining <= 0.01 || c.paidPct >= 99.999;
}

function isActiveDashboardLoan(loan) {
  return loan && !['Cancelled'].includes(loan.status || '') && !isFinanciallyCompletedLoan(loan);
}

function isUnpaidScheduleForForecast(row) {
  if (!row || !row.dueDate || ['Paid','Cancelled','Skipped'].includes(row.status || '')) return false;
  const loan = AppData.loans.find(l => l.id === row.loanId);
  if (loan && (loan.status === 'Cancelled' || isFinanciallyCompletedLoan(loan))) return false;
  return true;
}

function buildForecastMonthsFromSchedules(monthsAhead = 6, sourceRows = null) {
  const rows = (sourceRows || AppData.schedules).filter(isUnpaidScheduleForForecast);
  const out = [];
  const base = today();
  for (let i = 0; i < monthsAhead; i++) {
    const month = addMonths(base, i).slice(0,7);
    const label = new Date(month+'-01').toLocaleString('en-US', {month:'short', year:'2-digit'});
    const monthRows = rows.filter(r => r.dueDate && r.dueDate.slice(0,7) === month);
    out.push({ month, label, totals: buildCurrencyTotals(monthRows, 'amount', 'currency'), count: monthRows.length });
  }
  return out;
}

function renderPaymentStatusChart(rows) {
  const statuses = ['Planned','Paid','Partial','Missed','Skipped','Cancelled'];
  const counts = {};
  statuses.forEach(s => counts[s] = rows.filter(r => r.status === s).length);
  const max = Math.max(...Object.values(counts), 1);
  return `<div class="chart-wrap"><div class="bar-chart" style="height:130px">${statuses.map(st => `
    <div class="bar-item">
      <div class="bar-value">${counts[st]}</div>
      <div class="bar-fill" style="height:${Math.round(counts[st]/max*100)}%;background:var(--accent);opacity:${counts[st] ? 0.75 : 0.25}"></div>
      <div class="bar-label">${st}</div>
    </div>`).join('')}</div></div>`;
}

function renderForecastChart(months) {
  const values = months.map(m => m.count || 0);
  const max = Math.max(...values, 1);
  return `<div class="chart-wrap"><div class="bar-chart" style="height:130px">${months.map((m, i) => `
    <div class="bar-item" title="${m.label}: ${escapeHtml(renderCurrencyBreakdown(m.totals, { compact:true, inline:true, emptyText:'0' }).replace(/<[^>]*>/g,''))}">
      <div class="bar-value">${m.count}</div>
      <div class="bar-fill" style="height:${Math.round(values[i]/max*100)}%;background:var(--cyan);opacity:${values[i] ? 0.75 : 0.25}"></div>
      <div class="bar-label">${m.label}</div>
    </div>`).join('')}</div>
    <div class="currency-note">Bar height shows number of unpaid schedule records. Exact forecast amounts are shown by currency in the forecast card to avoid mixing currencies.</div>
  </div>`;
}

function getManualRateToBase(currency) {
  const cur = String(currency || '').trim();
  const rates = AppData.settings?.currencyRates || {};
  if (!cur) return null;
  if (cur === 'AED') return 1;
  const rate = parseFloat(rates[cur]);
  return isFinite(rate) && rate > 0 ? rate : null;
}

function convertCurrencyTotalsToBase(totals = {}) {
  const converted = { value: 0, missing: [] };
  sortedCurrencyEntries(totals).forEach(([cur, val]) => {
    const rate = getManualRateToBase(cur);
    if (rate === null) converted.missing.push(cur);
    else converted.value += (parseFloat(val) || 0) * rate;
  });
  return converted;
}

function getFinancialHealthRating(loadPct) {
  if (!isFinite(loadPct)) return { label:'Unavailable', color:'text-muted', css:'var(--text-muted)', desc:'Add income and rates to calculate the score.' };
  if (loadPct <= 30) return { label:'Strong', color:'text-green', css:'var(--green)', desc:'Comfortable commitment level.' };
  if (loadPct <= 50) return { label:'Stable', color:'text-green', css:'var(--green)', desc:'Manageable commitments; keep monitoring.' };
  if (loadPct <= 70) return { label:'Pressured', color:'text-yellow', css:'var(--yellow)', desc:'High commitments compared with income.' };
  if (loadPct <= 90) return { label:'Risky', color:'text-red', css:'var(--red)', desc:'Limited flexibility; review obligations.' };
  return { label:'Critical', color:'text-red', css:'var(--red)', desc:'Commitments consume most income.' };
}

function renderFinancialHealthScore(monthlyIncomeTotals = {}, loanTotals = {}, expenseTotals = {}, dailyExpenseTotals = {}, dashboardCurrency = 'ALL') {
  const commitmentTotals = {};
  Object.entries(loanTotals || {}).forEach(([c,v]) => addCurrencyTotal(commitmentTotals, c, v));
  Object.entries(expenseTotals || {}).forEach(([c,v]) => addCurrencyTotal(commitmentTotals, c, v));
  Object.entries(dailyExpenseTotals || {}).forEach(([c,v]) => addCurrencyTotal(commitmentTotals, c, v));

  const hasIncome = sortedCurrencyEntries(monthlyIncomeTotals).length > 0;
  if (!hasIncome) {
    return `<div class="health-score-wrap">
      <div class="empty-state" style="padding:26px 16px">
        <div class="empty-state-icon">◌</div>
        <div class="empty-state-title">Financial Health Score is not available yet</div>
        <div class="empty-state-sub">Add monthly income sources in Lookups &amp; Settings to calculate commitment load against income.</div>
        <button class="btn btn-sm btn-primary" onclick="navigate('settings')">Manage Income</button>
      </div>
    </div>`;
  }

  const incomeBase = convertCurrencyTotalsToBase(monthlyIncomeTotals);
  const commitmentsBase = convertCurrencyTotalsToBase(commitmentTotals);
  const missing = [...new Set([...(incomeBase.missing || []), ...(commitmentsBase.missing || [])])];
  if (missing.length) {
    return `<div class="health-score-wrap">
      <div class="dq-item warn">
        <div class="dq-icon">⚠</div>
        <div class="dq-content">
          <div class="dq-title">Financial Health Score needs manual rates</div>
          <div class="dq-desc">Missing conversion rate for: <strong>${missing.map(escapeHtml).join(', ')}</strong>. Add rates in Lookups &amp; Settings. Saved manual rates are used; no online fetch is required.</div>
        </div>
      </div>
      <div class="loan-stat-row"><span class="stat-key">Monthly Income</span><span class="stat-val">${renderCurrencyBreakdownPlain(monthlyIncomeTotals)}</span></div>
      <div class="loan-stat-row"><span class="stat-key">Monthly Commitments + Daily Spend</span><span class="stat-val">${renderCurrencyBreakdownPlain(commitmentTotals)}</span></div>
    </div>`;
  }

  const incomeVal = incomeBase.value;
  const commitmentVal = commitmentsBase.value;
  const loadPct = incomeVal > 0 ? (commitmentVal / incomeVal * 100) : NaN;
  const freeCapacity = incomeVal - commitmentVal;
  const rating = getFinancialHealthRating(loadPct);
  const angle = Math.max(0, Math.min(100, isFinite(loadPct) ? loadPct : 0)) * 3.6;
  const activeIdx = !isFinite(loadPct) ? -1 : loadPct <= 30 ? 0 : loadPct <= 50 ? 1 : loadPct <= 70 ? 2 : loadPct <= 90 ? 3 : 4;
  const contextNote = dashboardCurrency === 'ALL'
    ? 'All currencies converted to AED using saved manual rates.'
    : `${dashboardCurrency} view; AED equivalent shown for consistent scoring.`;

  return `<div class="health-score-wrap">
    <div class="health-exec-summary">
      <div class="health-score-panel">
        <div class="health-score-label">Commitment Load</div>
        <div class="health-score-row">
          <div class="health-score-value">${isFinite(loadPct) ? Math.round(loadPct) + '%' : '—'}</div>
          <span class="health-rating-pill ${rating.color}">● ${rating.label}</span>
        </div>
        <div class="health-score-caption ${rating.color}">${escapeHtml(rating.desc)}</div>
      </div>
      <div>
        <div class="health-metric-grid">
          <div class="health-metric"><div class="health-metric-key">Monthly Income</div><div class="health-metric-val">AED ${fmt(incomeVal)}</div><div class="health-metric-sub">AED equivalent</div></div>
          <div class="health-metric"><div class="health-metric-key">Total Commitments</div><div class="health-metric-val">AED ${fmt(commitmentVal)}</div><div class="health-metric-sub">Loans + planned + daily</div></div>
          <div class="health-metric"><div class="health-metric-key">Free Capacity</div><div class="health-metric-val ${freeCapacity < 0 ? 'text-red' : 'text-green'}">AED ${fmt(freeCapacity)}</div><div class="health-metric-sub">Remaining monthly capacity</div></div>
        </div>
        <div class="health-scale-wrap">
          <div class="health-scale-track" style="--health-pct:${Math.max(0, Math.min(100, isFinite(loadPct) ? loadPct : 0))}%">
            <div class="health-scale-marker">◆</div>
            ${['Strong','Stable','Pressured','Risky','Critical'].map((x,i)=>`<div class="health-scale-step ${i===activeIdx?'active':''}" title="${x}" style="background:${i<2?'var(--green)':i===2?'var(--yellow)':'var(--red)'}"></div>`).join('')}
          </div>
          <div class="health-scale-labels">
            ${['Strong','Stable','Pressured','Risky','Critical'].map((x,i)=>`<div class="health-scale-label ${i===activeIdx?'active':''}">${x}</div>`).join('')}
          </div>
        </div>
      </div>
    </div>
    <div class="mt-16">
      <div class="health-breakdown-row"><span class="health-breakdown-key">Scoring Basis</span><span class="health-breakdown-val">${dashboardCurrency === 'ALL' ? 'All loan currencies' : escapeHtml(dashboardCurrency)}</span></div>
      <div class="health-breakdown-row"><span class="health-breakdown-key">Included in Commitments</span><span class="health-breakdown-val">Active loans · Planned expenses · Daily expenses</span></div>
    </div>
    <div class="currency-note">${escapeHtml(contextNote)} Values are converted using saved manual rates and are shown as AED equivalent for consistent scoring.</div>
  </div>`;
}

function normalizeLoanSequences(orderedLoans) {
  (orderedLoans || getSortedLoans()).forEach((loan, idx) => {
    loan.displaySequence = (idx + 1) * 10;
  });
}

function reorderLoanBySequence(id, requestedSequence) {
  const loan = AppData.loans.find(l => l.id === id);
  if (!loan) return false;
  const val = parseFloat(requestedSequence);
  if (!isFinite(val)) return false;
  const currentOrdered = getSortedLoans();
  const others = currentOrdered.filter(l => l.id !== id);
  let insertIndex = others.findIndex(l => getLoanSequence(l) >= val);
  if (insertIndex < 0) insertIndex = others.length;
  others.splice(insertIndex, 0, loan);
  normalizeLoanSequences(others);
  return true;
}

function startLoanSeqEdit(id) {
  const loan = AppData.loans.find(l => l.id === id);
  const display = document.getElementById('loan_seq_display_' + id);
  if (!loan || !display) return;
  const current = getLoanSequence(loan);
  display.outerHTML = `<input id="loan_seq_edit_${id}" class="form-control seq-edit-input" type="number" value="${escapeHtml(String(current))}" onkeydown="handleLoanSeqEditKey(event,'${id}')" onblur="commitLoanSeqEdit('${id}', this.value)" title="Press Enter or click outside to save">`;
  setTimeout(() => {
    const input = document.getElementById('loan_seq_edit_' + id);
    if (input) { input.focus(); input.select(); }
  }, 20);
}

function handleLoanSeqEditKey(event, id) {
  if (event.key === 'Enter') event.target.blur();
  if (event.key === 'Escape') { event.preventDefault(); refreshLoansTable(); }
}

function commitLoanSeqEdit(id, value) {
  const loan = AppData.loans.find(l => l.id === id);
  if (!loan) return;
  const val = parseFloat(value);
  if (!isFinite(val)) { showToast('Enter a valid sequence number', 'warning'); refreshLoansTable(); return; }
  setAuditAction(`Updated loan sequence for ${loan.name}`);
  reorderLoanBySequence(id, val);
  saveData();
  showToast('Loan sequence updated and order normalized', 'success');
  refreshLoansTable();
}

function updateLoanSequenceInline(id, input) {
  commitLoanSeqEdit(id, input && input.value);
}

function handleLoanRowDblClick(event, id) {
  if (event.target.closest('button,input,select,textarea,a')) return;
  viewLoanDetail(id);
}


function getLoanCurrenciesInUse() {
  const set = new Set();
  (AppData.loans || []).forEach(l => {
    const cur = String(l.currency || '').trim();
    if (cur) set.add(cur);
  });
  const order = getCurrencyOrder();
  return [...set].sort((a,b) => {
    const ai = order.indexOf(a), bi = order.indexOf(b);
    if (ai !== -1 || bi !== -1) return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    return a.localeCompare(b);
  });
}

function getDashboardCurrency() {
  const available = getLoanCurrenciesInUse();
  const selected = AppData.settings?.dashboardCurrency || 'ALL';
  if (selected !== 'ALL' && !available.includes(selected)) {
    if (!AppData.settings) AppData.settings = {};
    AppData.settings.dashboardCurrency = 'ALL';
    return 'ALL';
  }
  return selected;
}

function setDashboardCurrency(value) {
  if (!AppData.settings) AppData.settings = {};
  AppData.settings.dashboardCurrency = value || 'ALL';
  saveData();
  if (currentPage === 'dashboard') renderDashboard();
  appendUndoTopbarButton();
}

function renderDashboardCurrencyControl(selected) {
  const currencies = getLoanCurrenciesInUse();
  const options = ['ALL', ...currencies].map(cur => {
    const label = cur === 'ALL' ? 'All Currencies' : cur;
    return `<option value="${escapeHtml(cur)}" ${selected === cur ? 'selected' : ''}>${escapeHtml(label)}</option>`;
  }).join('');
  return `<div class="topbar-control dashboard-currency-control">
    <label>Currency View</label>
    <select onchange="setDashboardCurrency(this.value)" title="Filter dashboard by loan currency">
      ${options || '<option value="ALL">All Currencies</option>'}
    </select>
  </div>`;
}

function loanMatchesDashboardCurrency(loan, currency) {
  return currency === 'ALL' || String(loan?.currency || '') === currency;
}

function scheduleMatchesDashboardCurrency(row, currency) {
  if (currency === 'ALL') return true;
  const loan = AppData.loans.find(l => l.id === row.loanId);
  const cur = loan?.currency || row.currency || '';
  return String(cur) === currency;
}

function expenseMatchesDashboardCurrency(row, currency) {
  return currency === 'ALL' || String(row?.currency || '') === currency;
}

function renderDashboard() {
  const dashboardCurrency = getDashboardCurrency();
  document.getElementById('topbar-actions').innerHTML = renderDashboardCurrencyControl(dashboardCurrency);
  const loans = getSortedLoans(AppData.loans).filter(l => loanMatchesDashboardCurrency(l, dashboardCurrency));
  const activeLoans = loans.filter(isActiveDashboardLoan);
  const completedLoans = loans.filter(isFinanciallyCompletedLoan);
  const expenses = AppData.expenses.filter(e => expenseMatchesDashboardCurrency(e, dashboardCurrency));
  const dailyExpenses = (AppData.dailyExpenses || []).filter(e => expenseMatchesDashboardCurrency(e, dashboardCurrency));
  const schedules = AppData.schedules.filter(s => scheduleMatchesDashboardCurrency(s, dashboardCurrency));

  // Active loan stats only — completed/cancelled loans are kept out of the working dashboard
  const activeLoanTotals = buildCurrencyTotals(activeLoans, l => getLoanCalc(l).totalAmount, l => l.currency);
  const activeRemainingTotals = buildCurrencyTotals(activeLoans, l => getLoanCalc(l).remaining, l => l.currency);
  const completedLoanTotals = buildCurrencyTotals(completedLoans, l => getLoanCalc(l).actualPaid || l.totalAmount, l => l.currency);
  const activeLoanMonthlyTotals = buildCurrencyTotals(activeLoans, l => getLoanDerivedInstallment(l), l => l.currency);
  const nearCompletion = activeLoans.filter(l => { const c = getLoanCalc(l); return c.paidPct >= 80 && c.paidPct < 100 && c.remaining > 0.01; }).length;

  const todayDate = today();
  const thisMonth = getDashboardMonth();
  const dailyThisMonthRows = dailyExpenses.filter(e => e.date && e.date.slice(0,7) === thisMonth);
  const dailyThisMonthTotals = buildCurrencyTotals(dailyThisMonthRows, 'amount', 'currency');
  const dailyDaysElapsed = Math.max(1, new Date().getDate());
  const dailyProjectedTotals = {};
  sortedCurrencyEntries(dailyThisMonthTotals).forEach(([c,v]) => addCurrencyTotal(dailyProjectedTotals, c, (parseFloat(v) || 0) / dailyDaysElapsed * lastDayOfMonth(new Date().getFullYear(), new Date().getMonth())));
  const unpaidSchedules = schedules.filter(isUnpaidScheduleForForecast);
  const overdueCount = unpaidSchedules.filter(s => s.status === 'Missed' || (s.status === 'Planned' && s.dueDate < todayDate)).length;
  const dueThisMonthRows = unpaidSchedules.filter(s => s.dueDate && s.dueDate.slice(0,7) === thisMonth);
  const dueThisMonth = dueThisMonthRows.length;
  const dueThisMonthTotals = buildCurrencyTotals(dueThisMonthRows, 'amount', 'currency');

  const monthlyExpenseRows = expenses.filter(e => e.status !== 'Cancelled' && e.frequency === 'Monthly');
  const monthlyExpenseTotals = buildCurrencyTotals(monthlyExpenseRows, 'amount', 'currency');
  const unpaidExpenseRows = expenses.filter(e => e.status !== 'Paid' && e.status !== 'Cancelled');
  const overdueExpenseRows = expenses.filter(e => { const due = getExpenseEffectiveDueDate(e, thisMonth); return e.status !== 'Paid' && e.status !== 'Cancelled' && due && due < todayDate; });
  const cashflowMonths = buildForecastMonthsFromSchedules(6, schedules);

  // === Income vs Expenses comparison (v4.2) ===
  const incomeSources = getActiveIncomeSources(dashboardCurrency);
  const monthlyIncomeTotals = buildMonthlyIncomeTotals(incomeSources);
  // Total monthly outflow = active loan installments + monthly fixed expenses
  const monthlyOutflowTotals = {};
  Object.entries(activeLoanMonthlyTotals).forEach(([c,v]) => addCurrencyTotal(monthlyOutflowTotals, c, v));
  Object.entries(monthlyExpenseTotals).forEach(([c,v]) => addCurrencyTotal(monthlyOutflowTotals, c, v));
  Object.entries(dailyThisMonthTotals).forEach(([c,v]) => addCurrencyTotal(monthlyOutflowTotals, c, v));
  const netCashflowTotals = subtractCurrencyTotals(monthlyIncomeTotals, monthlyOutflowTotals);
  const hasIncome = sortedCurrencyEntries(monthlyIncomeTotals).length > 0;

  // === Planned vs Actual (this month) ===

  document.getElementById('content').innerHTML = `${renderDashboardTabs()}${dashboardTab === 'visual' ? visualHtml : overviewHtml}`;
}

function renderFamilyDonut(net) {
  const total = net.lina + net.alayna || 1;
  const linaAngle = (net.lina / total) * 360;
  const r = 50, cx = 60, cy = 60;
  function polar(angle) {
    const rad = (angle - 90) * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }
  const [x1,y1] = polar(0);
  const [x2,y2] = polar(linaAngle);
  const large = linaAngle > 180 ? 1 : 0;
  const svgPath = linaAngle === 360 ?
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--green)" opacity="0.5"/>` :
    linaAngle === 0 ?
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--red)" opacity="0.5"/>` :
    `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="var(--green)" opacity="0.6"/>
     <path d="M${cx},${cy} L${x2},${y2} A${r},${r} 0 ${1-large},1 ${x1},${y1} Z" fill="var(--red)" opacity="0.5"/>`;
  return `<div class="panel-body">
    <div class="donut-wrap">
      <svg width="120" height="120" viewBox="0 0 120 120">
        ${svgPath}
        <circle cx="${cx}" cy="${cy}" r="28" fill="var(--bg-card)"/>
        <text x="${cx}" y="${cy+5}" text-anchor="middle" fill="var(--text-secondary)" font-size="10" font-family="var(--font-mono)">${total>0?Math.round(net.lina/total*100):0}%</text>
      </svg>
      <div class="donut-legend">
        <div class="legend-item">
          <div class="legend-dot" style="background:var(--green)"></div>
          <div class="legend-label">لينا (Recv.)</div>
          <div class="legend-value text-green">${fmt(net.lina)}</div>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:var(--red)"></div>
          <div class="legend-label">علينا (Pay.)</div>
          <div class="legend-value text-red">${fmt(net.alayna)}</div>
        </div>
        <div class="legend-item" style="border-top:1px solid var(--border);padding-top:6px;margin-top:2px">
          <div class="legend-dot" style="background:${net.net>=0?'var(--green)':'var(--red)'}"></div>
          <div class="legend-label">Net Balance</div>
          <div class="legend-value ${net.net>=0?'text-green':'text-red'}">${net.net>=0?'+':''}${fmt(net.net)}</div>
        </div>
      </div>
    </div>
  </div>`;
}

let loanSort = { col: 'displaySequence', dir: 1 };
let loanFilter = { search: '', status: '', currency: '', type: '' };
let loanPage = 1;
const LOAN_PAGE_SIZE = 10;

function renderLoans() {
  document.getElementById('topbar-actions').innerHTML = `
    <button class="btn btn-primary btn-sm" onclick="openLoanForm()">+ Add Loan</button>
  `;
  refreshLoansTable();
}

function refreshLoansTable() {
  let loans = [...AppData.loans];

  if (loanFilter.search) {
    const q = loanFilter.search.toLowerCase();
    loans = loans.filter(l => l.name.toLowerCase().includes(q) || (l.lender||'').toLowerCase().includes(q));
  }
  if (loanFilter.status) loans = loans.filter(l => l.status === loanFilter.status);
  if (loanFilter.currency) loans = loans.filter(l => l.currency === loanFilter.currency);
  if (loanFilter.type) loans = loans.filter(l => l.type === loanFilter.type);

  if (loanSort.col) {
    loans.sort((a, b) => {
      let av = a[loanSort.col], bv = b[loanSort.col];
      if (loanSort.col === 'displaySequence' || typeof av === 'number' || typeof bv === 'number') {
        av = parseFloat(av) || 0;
        bv = parseFloat(bv) || 0;
      } else {
        if (typeof av === 'string') av = av.toLowerCase();
        if (typeof bv === 'string') bv = bv.toLowerCase();
      }
      return (av < bv ? -1 : av > bv ? 1 : 0) * loanSort.dir;
    });
  } else {
    loans = getSortedLoans(loans);
  }

  const total = loans.length;
  const pages = Math.max(1, Math.ceil(total / LOAN_PAGE_SIZE));
  if (loanPage > pages) loanPage = pages;
  const paginated = loans.slice((loanPage-1)*LOAN_PAGE_SIZE, loanPage*LOAN_PAGE_SIZE);

  const thClass = (col) => loanSort.col === col ? (loanSort.dir === 1 ? 'sort-asc' : 'sort-desc') : '';
  const th = (col, label) => `<th class="${thClass(col)}" onclick="sortLoans('${col}')">${label}</th>`;

  document.getElementById('content').innerHTML = `
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Loans & Installments</span>
      <span style="font-size:11px;color:var(--text-muted);">${total} record${total!==1?'s':''}</span>
    </div>
    <div class="panel-body">
      <div class="filter-bar">
        <div class="search-input-wrap">
          <span class="search-icon">⌕</span>
          <input type="text" placeholder="Search loans..." value="${escapeHtml(loanFilter.search)}"
            oninput="loanFilter.search=this.value;loanPage=1;refreshLoansTable()">
        </div>
        <select class="filter-select" onchange="loanFilter.status=this.value;loanPage=1;refreshLoansTable()">
          <option value="">All Statuses</option>
          ${AppData.lookups.loanStatuses.map(s => `<option value="${s}" ${loanFilter.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select class="filter-select" onchange="loanFilter.currency=this.value;loanPage=1;refreshLoansTable()">
          <option value="">All Currencies</option>
          ${AppData.lookups.currencies.map(c => `<option value="${c}" ${loanFilter.currency===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <select class="filter-select" onchange="loanFilter.type=this.value;loanPage=1;refreshLoansTable()">
          <option value="">All Types</option>

        </select>
        <button class="btn btn-ghost btn-sm" onclick="exportLoansCSV()">↓ CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            ${th('displaySequence','Seq')}
            ${th('name','Loan Name')}
            ${th('type','Type')}
            ${th('currency','Currency')}
            ${th('totalAmount','Total Loan')}
            ${th('actualPaid','Actual Paid')}

function sortLoans(col) {

}

function renderPagination(page, pages, pageVar, refreshFn) {
  let btns = '';
  for (let i = 1; i <= pages; i++) {
    btns += `<button class="page-btn ${i===page?'active':''}" onclick="${pageVar}=${i};${refreshFn}()">${i}</button>`;
  }
  return `<div class="pagination">
    <span class="page-info">Page ${page} of ${pages}</span>
    <button class="page-btn" onclick="if(${pageVar}>1){${pageVar}--;${refreshFn}()}">‹</button>
    ${btns}
    <button class="page-btn" onclick="if(${pageVar}<${pages}){${pageVar}++;${refreshFn}()}">›</button>
  </div>`;
}

function nextLoanSequence() {
  const maxSeq = Math.max(0, ...AppData.loans.map(l => parseFloat(l.displaySequence) || 0));
  return maxSeq + 10;
}

function moveLoanSequence(id, direction) {
  const ordered = getSortedLoans();
  const idx = ordered.findIndex(l => l.id === id);
  const targetIdx = idx + direction;
  if (idx < 0 || targetIdx < 0 || targetIdx >= ordered.length) return;
  setAuditAction('Changed loan display sequence');
  const [current] = ordered.splice(idx, 1);
  ordered.splice(targetIdx, 0, current);
  normalizeLoanSequences(ordered);
  saveData();
  refreshLoansTable();
  showToast('Loan order updated', 'success');
}

function generateSchedule(loanId) {
  const loan = AppData.loans.find(l => l.id === loanId);
  if (!loan) return;
  if (!loan.startDate) { showToast('Loan must have a start date to generate schedule', 'error'); return; }

  const suggestedAmt = getLoanDerivedInstallment(loan) || '';
  const earlyNote = loan.earlySettlementEnabled && loan.earlySettlementDate
    ? '<div class="form-hint" style="color:var(--yellow);margin-top:8px"><strong>Early settlement:</strong> a settlement entry will be created and installments will stop at that date.</div>'
    : '';

  openModal(`Generate Schedule — ${escapeHtml(loan.name)}`, `
    <p class="text-secondary" style="margin-bottom:14px">
      Existing <strong>Paid</strong> entries are kept. Unconfirmed future entries will be replaced.
    </p>
    <div class="form-group">
      <label class="form-label">Default Installment Amount <span class="required">*</span></label>
      <input id="gs_amount" class="form-control" type="number" min="0.01" step="any"
             value="${suggestedAmt}" placeholder="Amount per payment">
      <div class="form-hint">Each unpaid entry will use this amount. The last entry is automatically capped to the actual remaining balance.</div>
    </div>
    ${earlyNote}
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="confirmGenerateSchedule('${loanId}')">Generate</button>
  `);
}

function confirmGenerateSchedule(loanId) {
  const loan = AppData.loans.find(l => l.id === loanId);
  if (!loan) return;
  const monthly = parseFloat(document.getElementById('gs_amount')?.value) || 0;
  if (monthly <= 0) { showToast('Default installment amount must be greater than 0', 'error'); return; }
  closeModal();
  // Run generation
  (function() {
      AppData.schedules = AppData.schedules.filter(s => !(s.loanId === loanId && s.status !== 'Paid'));

      const total = parseFloat(loan.totalAmount) || 0;
      const end = loan.endDate ? new Date(loan.endDate + 'T00:00:00') : null;
      const earlyEnabled = !!(loan.earlySettlementEnabled && loan.earlySettlementDate);
      const earlyDate = earlyEnabled ? normalizeDateInput(loan.earlySettlementDate) : '';
      const earlyTime = earlyDate ? new Date(earlyDate + 'T00:00:00').getTime() : null;
      let remaining = total - (parseFloat(loan.actualPaid) || 0);
      let month = 0;
      let created = 0;
      const MAX_MONTHS = 360;

      while (remaining > 0.01 && month < MAX_MONTHS) {
        const dueDate = addMonths(loan.startDate, month);
        const dueTime = new Date(dueDate + 'T00:00:00').getTime();
        if (end && new Date(dueDate + 'T00:00:00') > end) break;

        if (earlyEnabled && earlyTime !== null && dueTime >= earlyTime) {
          const settlementAmount = parseFloat(loan.earlySettlementAmount) > 0 ? Math.min(parseFloat(loan.earlySettlementAmount), remaining) : remaining;
          AppData.schedules.push(normalizeScheduleRecord({
            id: genId('sch'),
            loanId,
            loanName: loan.name,
            dueDate: earlyDate,
            paymentMonth: earlyDate.slice(0,7),
            amount: settlementAmount,
            currency: loan.currency,
            status: 'Planned',
            paidDate: '',
            paymentMethod: '',
            referenceNumber: generatePaymentReference(loanId, earlyDate),
            isEarlySettlement: true,
            notes: 'Early settlement payment',
            createdDate: today()
          }));
          loan.earlySettlementStatus = 'Planned';
          remaining = 0;
          created++;
          break;
        }

        const amt = Math.min(month === 0 && loan.firstPaymentAmount ? parseFloat(loan.firstPaymentAmount) : monthly, remaining);
        AppData.schedules.push(normalizeScheduleRecord({
          id: genId('sch'),
          loanId,
          loanName: loan.name,
          dueDate,
          paymentMonth: dueDate.slice(0,7),
          amount: amt,
          currency: loan.currency,
          status: 'Planned',
          paidDate: '',
          paymentMethod: '',
          referenceNumber: generatePaymentReference(loanId, dueDate),
          isEarlySettlement: false,
          notes: '',
          createdDate: today()
        }));
        remaining -= amt;
        month++;
        created++;
      }

      saveData();
      showToast(`Schedule generated: ${created} payment entries`, 'success');
  })();
}

  });

function downloadFile(filename, content, mimeType) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mimeType || 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function downloadCSV(filename, content) {
  downloadFile(filename, '\ufeff' + content, 'text/csv;charset=utf-8;');
}

function csvEscape(value) {
  const v = value === null || value === undefined ? '' : String(value);
  return '"' + v.replace(/"/g, '""') + '"';
}

function parseCSV(text) {
  const rows = [];
  let row = [], cur = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const next = text[i + 1];
    if (ch === '"') {
      if (inQuotes && next === '"') { cur += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      row.push(cur); cur = '';
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (ch === '\r' && next === '\n') i++;
      row.push(cur);
      if (row.some(v => String(v).trim() !== '')) rows.push(row);
      row = []; cur = '';
    } else {
      cur += ch;
    }
  }
  row.push(cur);
  if (row.some(v => String(v).trim() !== '')) rows.push(row);
  return rows;
}

function rowsToObjects(rows) {
  if (!rows || rows.length < 2) return [];
  const headers = rows[0].map(h => normalizeHeader(h));
  return rows.slice(1).map((row, idx) => {
    const obj = { __rowNumber: idx + 2 };
    headers.forEach((h, j) => obj[h] = row[j] !== undefined ? String(row[j]).trim() : '');
    return obj;
  });
}

function normalizeHeader(h) {
  return String(h || '').toLowerCase().replace(/^\ufeff/, '').replace(/[#_.\-\s/()]/g, '');
}

function pickField(obj, keys) {
  for (const key of keys) {
    const normalized = normalizeHeader(key);
    if (obj[normalized] !== undefined && obj[normalized] !== '') return obj[normalized];
  }
  return '';
}

function normalizeAmount(value) {
  if (value === null || value === undefined || value === '') return 0;
  const n = parseFloat(String(value).replace(/,/g, '').replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 0 : n;
}

function excelSerialToDate(serial) {
  const n = Number(serial);
  if (!isFinite(n)) return '';
  const d = new Date(Math.round((n - 25569) * 86400 * 1000));
  return d.toISOString().split('T')[0];
}

function normalizeDateInput(value) {
  if (value === null || value === undefined) return '';
  const raw = String(value).trim();
  if (!raw) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  if (/^\d+(\.\d+)?$/.test(raw) && Number(raw) > 25000) return excelSerialToDate(raw);
  const clean = raw.replace(/[.]/g, '/');
  let m = clean.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m) {
    let a = parseInt(m[1], 10), b = parseInt(m[2], 10), y = parseInt(m[3], 10);
    if (y < 100) y += 2000;
    const dayFirst = a > 12 || AppData.settings.dateFormat === 'DD/MM/YYYY';
    const day = dayFirst ? a : b;
    const month = dayFirst ? b : a;
    if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
      return `${y}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }
  }
  const parsed = new Date(raw);
  if (!isNaN(parsed.getTime())) return parsed.toISOString().split('T')[0];
  return '';
}

function normalizePaymentStatus(value) {
  const raw = String(value || 'Planned').trim();
  const found = AppData.lookups.paymentStatuses.find(s => s.toLowerCase() === raw.toLowerCase());
  return found || 'Planned';
}

function escapeXml(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function getLoanReferencePrefix(loan) {
  const prefixes = (AppData.settings && AppData.settings.scheduleReferencePrefixes) || defaultData.settings.scheduleReferencePrefixes;
  if (loan && prefixes[loan.type]) return prefixes[loan.type];
  const text = `${loan?.type || ''} ${loan?.name || ''}`.toLowerCase();
  if (text.includes('apartment')) return 'AP';
  if (text.includes('car')) return 'CR';
  if (text.includes('credit')) return 'CC';
  if (text.includes('personal')) return 'PR';
  const words = String(loan?.name || loan?.type || 'Other').replace(/loan/ig, '').trim().split(/\s+/).filter(Boolean);
  return (words.map(w => w[0]).join('').slice(0, 2) || 'OT').toUpperCase();
}

function generatePaymentReference(loanIdOrLoan, dueDate) {
  const loan = typeof loanIdOrLoan === 'object' ? loanIdOrLoan : AppData.loans.find(l => l.id === loanIdOrLoan);
  if (!loan || !dueDate) return '';
  const normalizedDate = normalizeDateInput(dueDate) || dueDate;
  const d = new Date(normalizedDate + 'T00:00:00');
  if (isNaN(d.getTime())) return '';
  return `${getLoanReferencePrefix(loan)}-${d.getMonth() + 1}-${String(d.getFullYear()).slice(-2)}`;
}

function normalizeScheduleRecord(schedule) {
  const loan = AppData.loans.find(l => l.id === schedule.loanId) || AppData.loans.find(l => l.name === schedule.loanName);
  if (loan) {
    schedule.loanId = loan.id;
    schedule.loanName = loan.name;
    schedule.currency = loan.currency;
  }
  if (schedule.dueDate) {
    schedule.dueDate = normalizeDateInput(schedule.dueDate) || schedule.dueDate;
    schedule.paymentMonth = schedule.dueDate.slice(0, 7);
  }
  schedule.referenceNumber = generatePaymentReference(schedule.loanId, schedule.dueDate);
  schedule.isEarlySettlement = schedule.isEarlySettlement === true || schedule.isEarlySettlement === 'true' || schedule.isEarlySettlement === 'Yes' || schedule.isEarlySettlement === 'Y';
  return schedule;
}

function recalcLoanActualPaid(loanId) {
  const loan = AppData.loans.find(l => l.id === loanId);
  if (!loan) return;
  const loanSchedules = AppData.schedules.filter(x => x.loanId === loanId);
  const scheduleIdsWithTransactions = new Set(getTransactions()
    .filter(t => t.linkType === 'schedule' && loanSchedules.some(s => s.id === t.linkId))
    .map(t => t.linkId));
  const transactionPaid = getTransactions()
    .filter(t => t.linkType === 'schedule' && loanSchedules.some(s => s.id === t.linkId))
    .reduce((t, x) => t + parseFloat(x.amount || 0), 0);
  const legacyPaid = loanSchedules
    .filter(x => x.status === 'Paid' && !scheduleIdsWithTransactions.has(x.id))
    .reduce((t, x) => t + parseFloat(x.amount || 0), 0);
  loan.actualPaid = transactionPaid + legacyPaid;
  loan.updatedDate = today();
}

function getExistingEarlySettlementForLoan(loanId, excludeId='') {
  return AppData.schedules.find(row => row.loanId === loanId && row.isEarlySettlement && row.id !== excludeId);
}

function canSetEarlySettlement(scheduleId, loanId) {
  const existing = getExistingEarlySettlementForLoan(loanId, scheduleId);
  if (existing) {
    showToast(`This loan already has an Early Settlement Payment: ${existing.referenceNumber || generatePaymentReference(existing.loanId, existing.dueDate)}. Remove it first or edit the existing settlement payment.`, 'error', 5000);
    return false;
  }
  return true;
}

function validateEarlySettlementUniqueness() {
  const seen = {};
  let changed = false;
  AppData.schedules.forEach(row => {
    if (!row.isEarlySettlement || !row.loanId) return;
    if (seen[row.loanId]) { row.isEarlySettlement = false; changed = true; }
    else seen[row.loanId] = row.id;
  });
  return changed;
}

function applyEarlySettlementCompletion(schedule) {
  if (!schedule || !schedule.loanId || !schedule.isEarlySettlement || schedule.status !== 'Paid') return;
  const loan = AppData.loans.find(l => l.id === schedule.loanId);
  if (!loan) return;
  loan.earlySettlementEnabled = true;
  loan.earlySettlementDate = schedule.dueDate;
  loan.earlySettlementAmount = parseFloat(schedule.amount || 0);
  loan.earlySettlementStatus = 'Completed';
  loan.status = 'Completed';
  const settlementTime = new Date(schedule.dueDate + 'T00:00:00').getTime();
  AppData.schedules.forEach(row => {
    if (row.loanId === schedule.loanId && row.id !== schedule.id && row.status !== 'Paid' && row.dueDate) {
      const rowTime = new Date(row.dueDate + 'T00:00:00').getTime();
      if (rowTime > settlementTime) {
        row.status = 'Cancelled';
        row.notes = row.notes ? `${row.notes} | Cancelled after early settlement` : 'Cancelled after early settlement';
      }
    }
  });
  recalcLoanActualPaid(schedule.loanId);
}

function toggleEarlySettlementPayment(id) {
  const s = AppData.schedules.find(x => x.id === id);
  if (!s) return;
  const nextValue = !s.isEarlySettlement;
  if (nextValue && !canSetEarlySettlement(id, s.loanId)) return;
  setAuditAction(nextValue ? 'Marked payment as early settlement' : 'Removed early settlement flag');
  s.isEarlySettlement = nextValue;
  s.notes = s.isEarlySettlement && !s.notes ? 'Early settlement payment' : s.notes;
  if (s.status === 'Paid') applyEarlySettlementCompletion(s);
  saveData();
  showToast(s.isEarlySettlement ? 'Payment marked as early settlement' : 'Early settlement flag removed', 'success');
  refreshScheduleTable();
}


function getPaymentMethods() {
  const defaults = ['Cash','Bank Transfer','Apple Pay','Debit Card','Credit Card','Other'];
  if (!AppData.lookups) AppData.lookups = {};
  if (!Array.isArray(AppData.lookups.paymentMethods) || !AppData.lookups.paymentMethods.length) {
    AppData.lookups.paymentMethods = defaults.slice();
  }
  // Keep the list controlled and clean; append only valid configured values, preserve order.
  const seen = new Set();
  const clean = [];
  [...defaults, ...AppData.lookups.paymentMethods].forEach(v => {
    const val = String(v || '').trim();
    if (val && !seen.has(val.toLowerCase())) { seen.add(val.toLowerCase()); clean.push(val); }
  });
  AppData.lookups.paymentMethods = clean;
  return clean;
}

function normalizePaymentMethodValue(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  const key = raw.toLowerCase().replace(/[_\-]+/g, ' ').replace(/\s+/g, ' ').trim();
  const map = {
    'cash': 'Cash',
    'bank': 'Bank Transfer',
    'transfer': 'Bank Transfer',
    'bank transfer': 'Bank Transfer',
    'wire': 'Bank Transfer',
    'wire transfer': 'Bank Transfer',
    'applepay': 'Apple Pay',
    'apple pay': 'Apple Pay',
    'debit': 'Debit Card',
    'debit card': 'Debit Card',
    'credit': 'Credit Card',
    'credit card': 'Credit Card',
    'card': 'Debit Card',
    'online payment': 'Other',
    'wallet': 'Other',
    'cheque': 'Other',
    'check': 'Other',
    'other': 'Other'
  };
  return map[key] || (getPaymentMethods().some(m => m.toLowerCase() === key) ? getPaymentMethods().find(m => m.toLowerCase() === key) : 'Other');
}

function paymentMethodOptions(selected) {
  const normalized = normalizePaymentMethodValue(selected);
  return `<option value="">Select payment method</option>` + getPaymentMethods().map(m => `<option value="${escapeHtml(m)}" ${normalized===m?'selected':''}>${escapeHtml(m)}</option>`).join('');
}

function migrateData() {
  if (!AppData.settings) AppData.settings = JSON.parse(JSON.stringify(defaultData.settings));
  if (!AppData.settings.currentUser) AppData.settings.currentUser = 'Local User';
  if (!Array.isArray(AppData.auditLog)) AppData.auditLog = [];
  if (!Array.isArray(AppData.undoStack)) AppData.undoStack = [];
  AppData.settings.scheduleReferencePrefixes = Object.assign({}, defaultData.settings.scheduleReferencePrefixes, AppData.settings.scheduleReferencePrefixes || {});
  if (!Array.isArray(AppData.loans)) AppData.loans = [];
  AppData.loans.forEach((l, idx) => {
    if (l.displaySequence === undefined || l.displaySequence === null || l.displaySequence === '') l.displaySequence = (idx + 1) * 10;
    else l.displaySequence = parseFloat(l.displaySequence) || ((idx + 1) * 10);
    if (l.earlySettlementEnabled === undefined) l.earlySettlementEnabled = !!l.earlySettlementDate;
    if (l.earlySettlementAmount === undefined) l.earlySettlementAmount = 0;
    if (!l.earlySettlementStatus) l.earlySettlementStatus = l.earlySettlementEnabled ? 'Planned' : 'Not Planned';
  });
  if (!Array.isArray(AppData.expenses)) AppData.expenses = [];
  AppData.expenses.forEach(e => {
    if (!e.frequency) e.frequency = 'One-time';
    if (e.frequency === 'Monthly') {
      if (e.dueDay === undefined || e.dueDay === null || String(e.dueDay).trim() === '') {
        if (e.dueDate) {
          const d = new Date(e.dueDate);
          e.dueDay = !isNaN(d) ? String(d.getDate()) : '1';
        } else {
          e.dueDay = '1';
        }
      }
    }
    if (e.paymentReference !== undefined) delete e.paymentReference;
    if (e.paymentMethod) e.paymentMethod = normalizePaymentMethodValue(e.paymentMethod);
  });
  if (!Array.isArray(AppData.dailyExpenses)) AppData.dailyExpenses = [];
  AppData.dailyExpenses.forEach(d => {
    if (!d.id) d.id = genId('dex');
    if (!d.date) d.date = today();
    d.transactionTime = normalizeTimeInput(d.transactionTime || d.time || '');
    if (d.time !== undefined) delete d.time;
    if (!d.importedAt) d.importedAt = '';
    if (d.importOrder === undefined || d.importOrder === null || d.importOrder === '') d.importOrder = parseFloat(d.txnId || 0) || 0;
    if (!d.category) d.category = 'Other';
    if (!d.description) d.description = d.merchant ? `Purchase at ${d.merchant}` : (d.category || 'Daily expense');
    d.amount = parseFloat(d.amount) || 0;
    if (!d.currency) d.currency = AppData.settings?.defaultCurrency || 'AED';
    if (d.paymentMethod) d.paymentMethod = normalizePaymentMethodValue(d.paymentMethod);
    if (!d.transactionType) d.transactionType = 'Purchase';
    if (d.merchant === undefined) d.merchant = '';
    if (d.location === undefined) d.location = '';
    if (d.cardEnding === undefined) d.cardEnding = '';
    if (d.balanceAfter === undefined || d.balanceAfter === null || d.balanceAfter === '') d.balanceAfter = '';
    else d.balanceAfter = normalizeAmount(d.balanceAfter);
    if (d.possibleDuplicate === true) d.possibleDuplicate = 'Yes';
    if (d.possibleDuplicate === false || d.possibleDuplicate === undefined || d.possibleDuplicate === null || d.possibleDuplicate === '') d.possibleDuplicate = 'No';
    if (d.originalSMS === undefined) d.originalSMS = '';
    if (d.txnId === undefined) d.txnId = '';
    if (!d.createdDate) d.createdDate = d.date || today();
    if (!d.updatedDate) d.updatedDate = today();
  });
  if (!Array.isArray(AppData.schedules)) AppData.schedules = [];
  let changed = false;
  AppData.schedules.forEach(s => {
    const before = JSON.stringify({ loanId: s.loanId, loanName: s.loanName, dueDate: s.dueDate, currency: s.currency, paymentMonth: s.paymentMonth, referenceNumber: s.referenceNumber, isEarlySettlement: s.isEarlySettlement, paymentMethod: s.paymentMethod });
    normalizeScheduleRecord(s);
    if (s.paymentMethod) s.paymentMethod = normalizePaymentMethodValue(s.paymentMethod);
    const after = JSON.stringify({ loanId: s.loanId, loanName: s.loanName, dueDate: s.dueDate, currency: s.currency, paymentMonth: s.paymentMonth, referenceNumber: s.referenceNumber, isEarlySettlement: s.isEarlySettlement, paymentMethod: s.paymentMethod });
    if (before !== after) changed = true;
  });
  if (!Array.isArray(AppData.transactions)) AppData.transactions = [];
  AppData.transactions.forEach(t => {
    const oldMethod = t.method;
    if (t.method) t.method = normalizePaymentMethodValue(t.method);
    if (oldMethod !== t.method) changed = true;
  });
  if (validateEarlySettlementUniqueness()) changed = true;
  // Recalculate linked schedule/expense statuses from actual transactions so old partial-payment data stays consistent.
  const links = new Set(AppData.transactions.filter(t => t.linkType && t.linkId).map(t => `${t.linkType}:${t.linkId}`));
  links.forEach(key => {
    const [type, id] = key.split(':');
    recalcPlanStatusFromTransactions(type, id);
  });
  AppData.loans.forEach(l => recalcLoanActualPaid(l.id));
  if (changed && typeof localStorage !== 'undefined') persistAppData();
}

      <div class="kpi-label">Missed</div>

  <div class="panel">
    <div class="panel-header">

      <span style="font-size:11px;color:var(--text-muted)">${total} entries${hasMixedScheduleCurrencies ? ' · mixed currencies shown separately' : ''}</span>

        </select>

        </select>

function sortSched(col) {
  if (schedSort.col === col) schedSort.dir *= -1;
  else { schedSort.col = col; schedSort.dir = 1; }
  refreshScheduleTable();
}

function toggleAllSchedCheck(chk) {
  document.querySelectorAll('.sched-chk').forEach(c => {
    c.checked = chk.checked;
    setScheduleSelection(c.dataset.id, chk.checked, false);
  });
  updateScheduleSelectionUI();
}

function getSelectedScheduleIds() {
  return [...schedSelected].filter(id => AppData.schedules.some(s => s.id === id));
}

function setScheduleSelection(id, selected, updateUI=true) {
  if (!id) return;
  if (selected) schedSelected.add(id);
  else schedSelected.delete(id);
  if (updateUI) updateScheduleSelectionUI();
}

function toggleScheduleSelection(id) {
  setScheduleSelection(id, !schedSelected.has(id));
}

function selectVisibleScheduleRows() {
  document.querySelectorAll('.sched-chk').forEach(c => schedSelected.add(c.dataset.id));
  updateScheduleSelectionUI();
  showToast(`${document.querySelectorAll('.sched-chk').length} visible payment records selected`, 'success');
}

function selectAllFilteredScheduleRows() {
  const ids = getFilteredScheduleRows().map(s => s.id);
  ids.forEach(id => schedSelected.add(id));
  updateScheduleSelectionUI();
  showToast(`${ids.length} payment records matching current filters selected`, 'success');
}

function clearScheduleSelection() {
  schedSelected.clear();
  updateScheduleSelectionUI();
}

function handleScheduleRowClick(event, id) {
  if (event.target.closest('button,input,select,a,.table-actions')) return;
  if (schedRowClickTimer) clearTimeout(schedRowClickTimer);
  schedRowClickTimer = setTimeout(() => {
    toggleScheduleSelection(id);
    schedRowClickTimer = null;
  }, 220);
}

function handleScheduleRowDblClick(event, id) {
  if (event.target.closest('button,input,select,a,.table-actions')) return;
  if (schedRowClickTimer) {
    clearTimeout(schedRowClickTimer);
    schedRowClickTimer = null;
  }
  editPayment(id);
}

function updateScheduleSelectionUI() {
  schedSelected = new Set(getSelectedScheduleIds());
  const selectedTotal = schedSelected.size;
  let selectedVisible = 0;
  document.querySelectorAll('.sched-chk').forEach(c => {
    const isSelected = schedSelected.has(c.dataset.id);
    c.checked = isSelected;
    if (isSelected) selectedVisible++;
    const row = c.closest('tr');
    if (row) row.classList.toggle('row-selected', isSelected);
  });
  const visible = document.querySelectorAll('.sched-chk').length;
  const allChk = document.getElementById('sched-all-chk');
  if (allChk) allChk.checked = visible > 0 && selectedVisible === visible;
  const counter = document.getElementById('schedule-selection-counter');
  if (counter) counter.textContent = `${selectedTotal} selected${selectedVisible ? ` · ${selectedVisible} visible` : ''}`;
  const bar = document.getElementById('schedule-bulk-bar');
  if (bar) {
    bar.classList.toggle('bulk-bar-empty', selectedTotal === 0);
    const strong = document.getElementById('schedule-selected-count');
    if (strong) strong.textContent = selectedTotal;
    const label = document.getElementById('schedule-selected-label');
    if (label) label.textContent = selectedTotal ? `payment record${selectedTotal===1?'':'s'} selected` : 'No payment records selected';
  }
}
