function renderTransactions() {
  const txns = [...getTransactions()].sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
  const q = (txnFilter.search||'').toLowerCase();
  const filtered = txns.filter(t => {
    if (txnFilter.month && (t.date||'').slice(0,7) !== txnFilter.month) return false;
    if (q) {
      const link = resolveTransactionLink(t);
      const hay = `${t.description||''} ${t.method||''} ${link?link.label:''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const thisMonth = today().slice(0,7);
  const monthActual = buildActualOutflowTotals(thisMonth);
  const monthPlanned = buildPlannedOutflowTotals(thisMonth);
  const monthVariance = subtractCurrencyTotals(monthPlanned, monthActual); // planned - actual; positive = under budget

  const methods = (AppData.lookups.paymentMethods || ['Cash']);

  const rows = filtered.map(t => {
    const link = resolveTransactionLink(t);
    const planned = link ? link.plannedAmount : null;
    const actual = parseFloat(t.amount)||0;
    const totalPaid = link ? sumTransactionsForLink(t.linkType, t.linkId) : actual;
    const remaining = planned !== null ? planned - totalPaid : null;
    let diffHtml;
    if (planned === null) diffHtml = '<span class="text-muted">—</span>';
    else if (remaining > 0.005) diffHtml = `<span class="text-yellow">partial · ${escapeHtml(t.currency)} ${fmt(remaining)} left</span>`;
    else if (remaining < -0.005) diffHtml = `<span class="text-red">over by ${fmt(-remaining)}</span>`;
    else diffHtml = '<span class="text-green">settled</span>';
    return `<tr>
      <td class="text-mono">${fmtDate(t.date)}</td>
      <td>${link ? `<span class="kpi-badge neutral">${link.type==='schedule'?'Loan':'Expense'}</span> ${escapeHtml(link.label)}` : `<span class="text-muted">${escapeHtml(t.description||'Unlinked')}</span>`}</td>
      <td class="text-mono">${escapeHtml(t.currency)} ${fmt(actual)}</td>
      <td class="text-mono">${planned!==null ? escapeHtml(t.currency)+' '+fmt(planned) : '—'}</td>
      <td class="text-mono">${diffHtml}</td>
      <td>${escapeHtml(t.method||'—')}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-sm btn-ghost text-red" onclick="deleteTransaction('${t.id}')">✕</button>
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" class="text-muted text-sm" style="text-align:center;padding:18px">No transactions recorded${txnFilter.month||q?' for this filter':''}. Click "Record Payment" to log an actual payment against a planned item.</td></tr>`;

  const monthLabel = new Date(thisMonth+'-01').toLocaleString('en-US',{month:'long',year:'numeric'});

  document.getElementById('content').innerHTML = `
  <div class="kpi-grid kpi-grid-3" style="margin-bottom:16px">
    <div class="kpi-card"><div class="kpi-label">Planned This Month</div><div class="kpi-value" style="font-size:15px">${renderCurrencyBreakdown(monthPlanned)}</div><div class="kpi-sub">${monthLabel} · loans + expenses due</div></div>
    <div class="kpi-card cyan"><div class="kpi-label">Actually Paid</div><div class="kpi-value" style="font-size:15px">${renderCurrencyBreakdown(monthActual)}</div><div class="kpi-sub">Recorded transactions this month</div></div>
    <div class="kpi-card"><div class="kpi-label">Remaining vs Plan</div><div class="kpi-value" style="font-size:15px">${renderCurrencyBreakdown(monthVariance, { emptyText:'Fully settled' })}</div><div class="kpi-sub">Planned minus paid · positive = still to pay</div></div>
  </div>
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Recorded Transactions</span>
      <button class="btn btn-sm btn-primary" onclick="openTransactionDialog()">+ Record Payment</button>
    </div>
    <div class="panel-body">
      <div class="table-actions" style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <input class="form-control" style="max-width:240px" type="text" placeholder="Search description / linked item" value="${escapeHtml(txnFilter.search)}" oninput="txnFilter.search=this.value;renderTransactions()">
        <input class="form-control" style="max-width:160px" type="month" value="${escapeHtml(txnFilter.month)}" onchange="txnFilter.month=this.value;renderTransactions()">
        ${(txnFilter.search||txnFilter.month)?`<button class="btn btn-sm btn-ghost" onclick="txnFilter={search:'',month:''};renderTransactions()">Clear</button>`:''}
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Linked To</th><th>Paid</th><th>Planned</th><th>Variance</th><th>Method</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="currency-note" style="margin-top:10px">Variance shows planned minus actual per item. Green means you paid the planned amount or less; red means you paid more than planned. Recording a payment automatically marks the linked loan installment or expense as Paid.</div>
    </div>
  </div>`;
}

function openTransactionDialog(presetLink) {
  let items = getUnpaidPlannedItems();
  const methods = (AppData.lookups.paymentMethods || ['Cash']);
  const currencies = (AppData.lookups.currencies || ['AED']);
  if (presetLink && !items.some(it => it.value === presetLink)) {
    const [ptype, pid] = String(presetLink).split(':');
    const rec = ptype === 'schedule' ? (AppData.schedules || []).find(s => s.id === pid) : (AppData.expenses || []).find(e => e.id === pid);
    if (rec) {
      const planned = parseFloat(rec.amount) || 0;
      const already = sumTransactionsForLink(ptype, pid);
      const remaining = Math.max(planned - already, 0);
      items.unshift({
        value: presetLink,
        label: ptype === 'schedule'
          ? `[Loan] ${rec.loanName || 'Loan'} — ${rec.currency} ${fmt(planned)} — due ${fmtDate(rec.dueDate)}`
          : `[Expense] ${rec.name} — ${rec.currency} ${fmt(planned)}`,
        currency: rec.currency,
        amount: remaining > 0.005 ? remaining : planned,
        sortKey: rec.dueDate || today()
      });
    }
  }
  if (!items.length && !presetLink) {
    showToast('No unpaid planned items to record against. Add a loan schedule or expense first.', 'error');
    return;
  }
  const options = items.map(it => `<option value="${it.value}" ${presetLink===it.value?'selected':''} data-currency="${it.currency}" data-amount="${it.amount}">${escapeHtml(it.label)}</option>`).join('');
  const body = `
    <div class="form-group">
      <label class="form-label">Pay Against <span class="required">*</span></label>
      <select id="txn_link" class="form-control" onchange="onTxnLinkChange()">${options}</select>
      <div class="form-hint">Recording this marks the selected item as Paid.</div>
    </div>
    <div class="form-grid form-grid-2">
      <div class="form-group">
        <label class="form-label">Amount Paid <span class="required">*</span></label>
        <input id="txn_amount" class="form-control" type="number" step="0.01" placeholder="0.00">
      </div>
      <div class="form-group">
        <label class="form-label">Currency</label>

// Prefill amount + currency from the selected planned item
function onTxnLinkChange() {
  const sel = document.getElementById('txn_link');
  if (!sel) return;
  const opt = sel.options[sel.selectedIndex];
  if (!opt) return;
  const cur = opt.getAttribute('data-currency');
  const amt = opt.getAttribute('data-amount');
  const curEl = document.getElementById('txn_currency');
  const amtEl = document.getElementById('txn_amount');
  if (cur && curEl) curEl.value = cur;
  if (amt && amtEl && !amtEl.value) amtEl.value = amt;
}

function saveTransaction() {
  const linkVal = document.getElementById('txn_link').value;
  const amount = parseFloat(document.getElementById('txn_amount').value);
  if (!linkVal) { showToast('Select an item to pay against', 'error'); return; }
  if (!(amount > 0)) { showToast('Enter a valid amount', 'error'); return; }
  const [linkType, linkId] = linkVal.split(':');
  const txn = {
    id: genId('txn'),
    linkType, linkId,
    amount,
    currency: document.getElementById('txn_currency').value,
    date: document.getElementById('txn_date').value || today(),
    method: normalizePaymentMethodValue(document.getElementById('txn_method').value),
    description: document.getElementById('txn_desc').value.trim(),
    createdDate: today()
  };
  setAuditAction('Recorded payment transaction');
  getTransactions().push(txn);
  syncPlanStatusFromTransaction(txn, true);
  if (linkType === 'schedule') {
    const schedule = (AppData.schedules || []).find(s => s.id === linkId);
    if (schedule?.loanId) recalcLoanActualPaid(schedule.loanId);
  }
  saveData();
  closeModal();
  showToast('Payment recorded', 'success');
  renderTransactions();
}

function deleteTransaction(id) {
  confirmAction('Delete this transaction? The linked item status will be recalculated from remaining linked payments.', function() {
    const txn = getTransactions().find(t => t.id === id);
    setAuditAction('Deleted payment transaction');
    AppData.transactions = getTransactions().filter(t => t.id !== id);
    if (txn) {
      recalcPlanStatusFromTransactions(txn.linkType, txn.linkId);
      if (txn.linkType === 'schedule') {
        const schedule = (AppData.schedules || []).find(s => s.id === txn.linkId);
        if (schedule?.loanId) recalcLoanActualPaid(schedule.loanId);
      }
    }
    saveData();
    showToast('Transaction deleted and linked item recalculated', 'success');
    if (currentPage === 'transactions') renderTransactions();
    else if (currentPage === 'schedule') refreshScheduleTable();
    else navigate(currentPage || 'dashboard');
  });
}

function deleteTransactionFromPaymentModal(transactionId, scheduleId) {
  confirmAction('Delete this related payment? The installment status will be recalculated from remaining related payments.', function() {
    const txn = getTransactions().find(t => t.id === transactionId);
    setAuditAction('Deleted related installment payment');
    AppData.transactions = getTransactions().filter(t => t.id !== transactionId);
    if (txn) recalcPlanStatusFromTransactions(txn.linkType, txn.linkId);
    const schedule = (AppData.schedules || []).find(s => s.id === scheduleId);
    if (schedule?.loanId) recalcLoanActualPaid(schedule.loanId);
    saveData();
    closeModal();
    showToast('Related payment deleted and installment recalculated', 'success');
    editPayment(scheduleId);
    if (currentPage === 'schedule') refreshScheduleTable();
  });
}

                <button class="btn btn-xs btn-danger" onclick="removeLookup('${g.key}',${i})" title="Delete">✕</button>
              </div>
            </div>
          `).join('') || '<div class="text-muted text-sm">No values configured.</div>'}
        </div>
        <div style="display:flex;gap:6px">
          <input id="lk_new_${g.key}" class="form-control" type="text" placeholder="Add new..." style="flex:1" onkeydown="if(event.key==='Enter')addLookup('${g.key}')">

        </div>
      </div>

function addLookup(key) {
  const input = document.getElementById('lk_new_'+key);
  const val = input?.value.trim();
  if (!val) return;
  if (!AppData.lookups[key]) AppData.lookups[key] = [];
  if (AppData.lookups[key].some(v => String(v).toLowerCase() === val.toLowerCase())) { showToast('Already exists', 'warning'); return; }
  setAuditAction(`Added lookup value: ${key}`);
  AppData.lookups[key].push(val);
  if (key === 'dailyExpenseCategories') getDailyExpenseCategories();
  saveData();
  showToast('Added', 'success');
  renderSettings();
}

function removeLookup(key, idx) {
  if (!AppData.lookups[key]) return;
  setAuditAction(`Removed lookup value: ${key}`);
  AppData.lookups[key].splice(idx, 1);
  if (key === 'dailyExpenseCategories') getDailyExpenseCategories();
  saveData();
  renderSettings();
}

function moveLookup(key, idx, direction) {
  const arr = AppData.lookups[key];
  if (!Array.isArray(arr)) return;
  const target = idx + direction;
  if (idx < 0 || target < 0 || target >= arr.length) return;
  setAuditAction(`Reordered lookup values: ${key}`);
  const [item] = arr.splice(idx, 1);
  arr.splice(target, 0, item);
  saveData();
  renderSettings();
}

function sortLookupAZ(key) {
  const arr = AppData.lookups[key];
  if (!Array.isArray(arr)) return;
  setAuditAction(`Sorted lookup values A-Z: ${key}`);
  arr.sort((a,b) => String(a).localeCompare(String(b), undefined, { sensitivity:'base' }));
  saveData();
  renderSettings();
  showToast('Lookup sorted A–Z', 'success');
}

function renameLookup(key, idx) {
  const arr = AppData.lookups[key];
  if (!Array.isArray(arr) || idx < 0 || idx >= arr.length) return;
  const oldVal = arr[idx];
  const next = prompt('Rename lookup value', oldVal);
  if (next === null) return;
  const val = String(next || '').trim();
  if (!val) { showToast('Value cannot be empty', 'warning'); return; }
  if (arr.some((v, i) => i !== idx && String(v).toLowerCase() === val.toLowerCase())) { showToast('Already exists', 'warning'); return; }
  setAuditAction(`Renamed lookup value: ${key}`);
  arr[idx] = val;
  saveData();
  renderSettings();
}

function fmtDateTime(value) {
  if (!value) return '—';
  try { return new Date(value).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); } catch(e) { return value; }

  const rows = (AppData.auditLog || []).map(a => [a.timestamp,a.user,a.module,a.action,a.recordRef].map(csvEscape).join(','));
  downloadCSV('audit_log.csv', [cols.join(','), ...rows].join('\n'));
}

            <button class="btn btn-secondary" style="margin-top:10px" onclick="openScheduleImportDialog()">↑ Import Payment Schedule</button>
          </div>
          <div class="divider"></div>
          <div class="form-group" style="margin-bottom:12px">
            <label class="form-label">Import Daily Expenses</label>
            <div class="form-hint">CSV / Excel columns follow the bank transaction export: TxnID, Date, TransactionType, Category, Description, Amount, Currency, PaymentMethod, Merchant, Location, CardEnding, BalanceAfter, PossibleDuplicate, OriginalSMS.</div>
            <button class="btn btn-secondary" style="margin-top:10px" onclick="openDailyExpenseImportDialog()">↑ Import Daily Expenses / Bank SMS</button>
          </div>
          <div class="divider"></div>
          <div class="form-group">
            <label class="form-label">Import Loans from CSV</label>
            <div class="form-hint">CSV columns: Name, Type, Currency, TotalAmount, MonthlyInstallment, ActualPaid, StartDate, EndDate, Status, Lender</div>
            <input type="file" id="import_loans_csv" accept=".csv" style="display:none" onchange="importLoansCSV(this)">
            <button class="btn btn-secondary" style="margin-top:10px" onclick="document.getElementById('import_loans_csv').click()">↑ Import Loans CSV</button>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Module Exports</span></div>
        <div class="panel-body">
          <div style="display:flex;flex-direction:column;gap:8px">
            <button class="btn btn-secondary" onclick="exportLoansCSV()">↓ Loans CSV (${AppData.loans.length} records)</button>
            <button class="btn btn-secondary" onclick="openScheduleExportDialog()">↓ Payment Schedule Export (${AppData.schedules.length} records)</button>
            <button class="btn btn-secondary" onclick="exportExpensesCSV()">↓ Planned Expenses CSV (${AppData.expenses.length} records)</button>
            <button class="btn btn-secondary" onclick="exportDailyExpensesCSV()">↓ Daily Expenses CSV (${(AppData.dailyExpenses||[]).length} records)</button>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Data Summary</span></div>
        <div class="panel-body">
          ${[
            ['Loans', AppData.loans.length],
            ['Payment Schedule Entries', AppData.schedules.length],
            ['Planned Expenses', AppData.expenses.length],
            ['Daily Expenses', (AppData.dailyExpenses||[]).length],
            ['Income Sources', (AppData.incomeSources||[]).length],
            ['Transactions', (AppData.transactions||[]).length],
          ].map(([k,v]) => `<div class="loan-stat-row"><span class="stat-key">${k}</span><span class="stat-val">${v}</span></div>`).join('')}
        </div>
      </div>
      ${renderStoragePanel()}
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Danger Zone</span></div>
        <div class="panel-body">
          <div style="display:flex;flex-direction:column;gap:8px">
            <button class="btn btn-danger" onclick="clearAllData()">✕ Clear All Data</button>
            <button class="btn btn-secondary" onclick="resetSampleData()">⟳ Reset to Sample Data</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function exportFullBackup() {
  const data = JSON.stringify(AppData, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pfm_backup_${today()}.json`;
  a.click();
  showToast('Backup downloaded', 'success');
}

function restoreBackup(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.loans || !data.ledger) { showToast('Invalid backup file format', 'error'); return; }
      confirmAction('This will replace ALL current data with the backup. Continue?', function() {
        setAuditAction('Restored full backup');
        AppData = data;
        saveData();
        showToast('Backup restored successfully', 'success');
        navigate('dashboard');
      });
    } catch(err) {
      showToast('Failed to parse backup file', 'error');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function importLedgerCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const lines = e.target.result.split('\n').filter(l => l.trim());
      const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim().toLowerCase());
      let imported = 0;
      for (let i = 1; i < lines.length; i++) {
        const vals = lines[i].split(',').map(v => v.replace(/^"|"$/g,'').trim());
        const obj = {};
        headers.forEach((h,j) => obj[h] = vals[j]||'');
        const person = obj['person'] || obj['name'];
        if (!person) continue;
        AppData.ledger.push({
          id: genId('led'),
          personName: person,
          direction: obj['direction'] || 'علينا',
          type: obj['type'] || 'Cash',
          amount: obj['amount'] && !isNaN(parseFloat(obj['amount'])) ? parseFloat(obj['amount']) : null,
          inkindDesc: obj['inkinddesc'] || obj['inkind_desc'] || '',
          estimatedValue: obj['estimatedvalue'] && !isNaN(parseFloat(obj['estimatedvalue'])) ? parseFloat(obj['estimatedvalue']) : null,
          event: obj['event'] || '',
          date: obj['date'] || '',
          owner: obj['owner'] || 'Me',
          status: obj['status'] || 'Open',
          notes: obj['notes'] || '',
          tags: [],
          createdDate: today(),
          updatedDate: today()
        });
        imported++;
      }
      saveData();
      showToast(`Imported ${imported} ledger records`, 'success');
      renderBackup();
    } catch(err) {
      showToast('CSV import failed: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function importLoansCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const lines = e.target.result.split('\n').filter(l => l.trim());
      const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim().toLowerCase());
      let imported = 0;
      for (let i = 1; i < lines.length; i++) {
        const vals = lines[i].split(',').map(v => v.replace(/^"|"$/g,'').trim());
        const obj = {};
        headers.forEach((h,j) => obj[h] = vals[j]||'');
        if (!obj['name']) continue;
        AppData.loans.push({
          id: genId('loan'),
          name: obj['name'],
          displaySequence: parseFloat(obj['sequence'] || obj['displaysequence'] || obj['seq'] || 0) || nextLoanSequence(),
          type: obj['type'] || 'Other',
          currency: obj['currency'] || 'AED',
          totalAmount: parseFloat(obj['totalamount']||obj['total_amount']||0) || 0,
          monthlyInstallment: parseFloat(obj['monthlyinstallment']||obj['monthly']||0) || 0,
          firstPaymentAmount: parseFloat(obj['firstpayment']||0) || 0,
          actualPaid: parseFloat(obj['actualpaid']||obj['actual_paid']||0) || 0,
          startDate: obj['startdate']||obj['start_date']||'',
          endDate: obj['enddate']||obj['end_date']||'',
          earlySettlementEnabled: false,
          earlySettlementDate: '',
          earlySettlementAmount: 0,
          earlySettlementStatus: 'Not Planned',
          status: obj['status'] || 'Active',
          lender: obj['lender'] || '',
          notes: obj['notes'] || '',
          tags: [],
          createdDate: today(),
          updatedDate: today()
        });
        imported++;
      }
      saveData();
      showToast(`Imported ${imported} loans`, 'success');
      renderBackup();
    } catch(err) {
      showToast('Loan CSV import failed: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function clearAllData() {
  confirmAction('<strong>WARNING:</strong> This will permanently delete ALL data including loans, schedule, ledger, people, and events. This cannot be undone.', function() {
    setAuditAction('Cleared all data');
    AppData = JSON.parse(JSON.stringify(defaultData));
    saveData();
    showToast('All data cleared', 'success');
    navigate('dashboard');
  });
}

function resetSampleData() {
  confirmAction('This will replace all data with sample/demo data. Any custom entries will be lost.', function() {
    setAuditAction('Reset sample data');
    AppData = JSON.parse(JSON.stringify(defaultData));
    seedData();
    saveData();
    showToast('Sample data restored', 'success');
    navigate('dashboard');
  });
}

/* ================================================================
   INIT
================================================================ */
async function startApp() {
  initProfiles();
  await loadData();
  applyRTL();
  applyTheme();
  applySidebarState();
  updateProfileLabel();
  navigate('dashboard');
  updateBadges();
  updateUndoButton();
}

startApp().catch(function(err) {
  console.error('Application startup failed', err);
  document.getElementById('content').innerHTML = '<div class="panel"><div class="panel-header"><span class="panel-title">Startup Error</span></div><div class="panel-body">The app could not start. Please export/import from a backup if the issue continues.</div></div>';
});
</script>
