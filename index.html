<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Financial Management Control Center v6.0</title>
<style>
/* ================================================
   CSS VARIABLES & RESET
================================================ */
:root {
  --bg-base: #0d0f12;
  --bg-panel: #13161b;
  --bg-card: #181c22;
  --bg-elevated: #1e2330;
  --bg-hover: #232839;
  --border: #252b38;
  --border-active: #3a4257;
  --text-primary: #e2e8f0;
  --text-secondary: #8892a4;
  --text-muted: #4a5568;
  --accent: #3b82f6;
  --accent-dim: rgba(59,130,246,0.15);
  --accent-hover: #2563eb;
  --green: #22c55e;
  --green-dim: rgba(34,197,94,0.12);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.12);
  --yellow: #f59e0b;
  --yellow-dim: rgba(245,158,11,0.12);
  --purple: #a855f7;
  --purple-dim: rgba(168,85,247,0.12);
  --cyan: #06b6d4;
  --cyan-dim: rgba(6,182,212,0.12);
  --font-main: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  --sidebar-w: 220px;
  --header-h: 52px;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --transition: 0.15s ease;
}

html[data-theme="light"] {
  --bg-base: #f4f7fb;
  --bg-panel: #ffffff;
  --bg-card: #ffffff;
  --bg-elevated: #eef2f7;
  --bg-hover: #e6edf6;
  --border: #d8e1ec;
  --border-active: #b6c4d6;
  --text-primary: #182230;
  --text-secondary: #526173;
  --text-muted: #8794a6;
  --accent: #2563eb;
  --accent-dim: rgba(37,99,235,0.10);
  --accent-hover: #1d4ed8;
  --green: #15803d;
  --green-dim: rgba(21,128,61,0.10);
  --red: #dc2626;
  --red-dim: rgba(220,38,38,0.10);
  --yellow: #b45309;
  --yellow-dim: rgba(180,83,9,0.12);
  --purple: #7e22ce;
  --purple-dim: rgba(126,34,206,0.10);
  --cyan: #0891b2;
  --cyan-dim: rgba(8,145,178,0.10);
  --shadow: 0 4px 20px rgba(15,23,42,0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font-main);
  background: var(--bg-base);
  color: var(--text-primary);
  line-height: 1.5;
  overflow: hidden;
  height: 100vh;
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg-base); }
::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ================================================
   LAYOUT
================================================ */
#app { display: flex; height: 100vh; }

/* SIDEBAR */
#sidebar {
  width: var(--sidebar-w);
  transition: width 0.24s ease, box-shadow 0.24s ease;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  z-index: 100;
}
.sidebar-brand {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 11px;
}
.sidebar-brand .brand-icon {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 9px;
  background: var(--accent-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
}
.sidebar-brand .brand-icon svg { width: 19px; height: 19px; display: block; }
.sidebar-brand .brand-text { display: flex; flex-direction: column; min-width: 0; }
.sidebar-brand .brand-label {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-bottom: 2px;
}
.sidebar-brand .brand-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.3;
}
.sidebar-brand .brand-version {
  font-size: 10px;
  color: var(--accent);
  font-family: var(--font-mono);
  margin-top: 2px;
}
.sidebar-nav { padding: 8px 0; flex: 1; }
.nav-section {
  padding: 10px 16px 4px;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  font-family: var(--font-mono);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 13px;
  transition: all var(--transition);
  border-left: 2px solid transparent;
  position: relative;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active {
  background: var(--accent-dim);
  color: var(--accent);
  border-left-color: var(--accent);
}
.nav-item .nav-icon { width: 16px; text-align: center; font-size: 14px; opacity: 0.7; flex-shrink: 0; }
.nav-item.active .nav-icon { opacity: 1; }
.nav-badge {
  margin-left: auto;
  background: var(--red);
  color: white;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 10px;
  font-family: var(--font-mono);
  font-weight: 500;
}
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
}
.sidebar-footer .rtl-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 6px 0;
  color: var(--text-secondary);
}
.sidebar-footer .rtl-toggle:hover { color: var(--text-primary); }


body.sidebar-collapsed { --sidebar-w: 56px; }
body.sidebar-collapsed #sidebar { width: 56px; }
body.sidebar-collapsed .sidebar-brand { justify-content: center; padding-left: 0; padding-right: 0; }
body.sidebar-collapsed .sidebar-brand .brand-text { display: none; }
body.sidebar-collapsed .sidebar-brand .brand-label,
body.sidebar-collapsed .sidebar-brand .brand-title,
body.sidebar-collapsed .sidebar-brand .brand-version,
body.sidebar-collapsed .nav-section,
body.sidebar-collapsed .nav-item span:not(.nav-icon):not(.nav-badge),
body.sidebar-collapsed .sidebar-footer span:not(:first-child) {
  opacity: 0;
  max-width: 0;
  overflow: hidden;
  white-space: nowrap;
  transition: opacity 0.18s ease, max-width 0.18s ease;
}
body.sidebar-collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
body.sidebar-collapsed .nav-item .nav-icon { width: auto; }
body.sidebar-collapsed .sidebar-footer { padding-left: 10px; padding-right: 10px; }
.sidebar-collapse-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: var(--radius);
  padding: 5px 8px;
  cursor: pointer;
  font-size: 13px;
}
.sidebar-collapse-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item span:not(.nav-icon):not(.nav-badge), .sidebar-brand .brand-label, .sidebar-brand .brand-title, .sidebar-brand .brand-version, .nav-section, .sidebar-footer span {
  transition: opacity 0.18s ease, max-width 0.18s ease;
}
body.sidebar-collapsed .sidebar-collapse-btn { transform: rotate(180deg); }
.sidebar-collapse-btn { transition: background var(--transition), color var(--transition), transform 0.24s ease; }
.loan-seq-input { width: 68px; text-align:center; padding:4px 6px; font-family:var(--font-mono); }
.seq-display {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 54px;
  height: 30px;
  padding: 4px 10px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  background: var(--bg-elevated);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.seq-display:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
.seq-edit-input {
  width: 64px;
  text-align: center;
  padding: 5px 8px;
  font-family: var(--font-mono);
  font-weight: 600;
}
.lookup-list { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.lookup-row {
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  padding:6px 8px;
  border-radius:var(--radius);
  font-size:12px;
}
.lookup-row-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lookup-row-actions { display:flex; gap:4px; align-items:center; }
.lookup-order-index { width:22px; color:var(--text-muted); font-family:var(--font-mono); font-size:10px; text-align:right; }
.lookup-tools { display:flex; justify-content:space-between; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.loan-row { cursor: pointer; }
.loan-row:hover td { background: var(--bg-hover); }

.inline-seq-input {
  width: 58px;
  text-align: center;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-primary);
  border-radius: var(--radius);
  padding: 4px 6px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.inline-seq-input:focus { outline: none; border-color: var(--accent); }
.dashboard-chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .dashboard-chart-row { grid-template-columns: 1fr; } }

/* MAIN CONTENT */
#main {
  flex: 1;
  transition: margin-left 0.24s ease;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#topbar {
  height: var(--header-h);
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  flex-shrink: 0;
}
.topbar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  flex: 1;
}
.topbar-actions { display: flex; align-items: center; gap: 8px; }
#content {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background: var(--bg-base);
}

/* ================================================
   COMPONENTS
================================================ */


.topbar-control {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-secondary);
  white-space: nowrap;
}
.topbar-control label {
  color: var(--text-muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-family: var(--font-mono);
}
.topbar-control select {
  background: var(--bg-elevated);
  border: 1px solid var(--border-active);
  color: var(--text-primary);
  border-radius: var(--radius);
  padding: 5px 9px;
  font-size: 12px;
  min-width: 130px;
}
.undo-action-btn {
  position: relative;
}
.undo-action-btn[disabled] {
  opacity: 0.45;
  cursor: not-allowed;
}
.undo-count-badge {
  min-width: 16px;
  height: 16px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid rgba(59,130,246,0.25);
  font-size: 10px;
  line-height: 14px;
  font-family: var(--font-mono);
  text-align: center;
}
.form-section {
  grid-column: 1 / -1;
  border: 1px solid var(--border);
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-top: 2px;
}
.form-section-title {
  font-size: 10px;
  font-family: var(--font-mono);
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.form-section .form-grid {
  gap: 14px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font-main);
  font-weight: 500;
  transition: all var(--transition);
  white-space: nowrap;
  line-height: 1.5;
}
.btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--border-active); }
.btn-secondary:hover { background: var(--bg-hover); border-color: var(--text-muted); }
.btn-ghost { background: transparent; color: var(--text-secondary); border-color: transparent; }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
.btn-danger { background: var(--red-dim); color: var(--red); border-color: rgba(239,68,68,0.3); }
.btn-danger:hover { background: var(--red); color: white; }
.btn-success { background: var(--green-dim); color: var(--green); border-color: rgba(34,197,94,0.3); }
.btn-success:hover { background: var(--green); color: white; }
.btn-sm { padding: 4px 10px; font-size: 11px; }
.btn-xs { padding: 2px 7px; font-size: 10px; }
.btn-icon { padding: 6px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }


/* Cards & KPI Cards */
.kpi-grid { display: grid; gap: 12px; }
.kpi-grid-4 { grid-template-columns: repeat(4, 1fr); }
.kpi-grid-3 { grid-template-columns: repeat(3, 1fr); }
.kpi-grid-2 { grid-template-columns: repeat(2, 1fr); }
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  opacity: 0.4;
}
.kpi-card.green::before { background: var(--green); }
.kpi-card.red::before { background: var(--red); }
.kpi-card.yellow::before { background: var(--yellow); }
.kpi-card.purple::before { background: var(--purple); }
.kpi-card.cyan::before { background: var(--cyan); }
.kpi-label {
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-bottom: 8px;
}
.kpi-value {
  font-size: 20px;
  font-weight: 600;
  color: var(--text-primary);
  font-family: var(--font-mono);
  line-height: 1.2;
}
.kpi-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}
.kpi-badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-weight: 500;
  margin-top: 6px;
}
.kpi-badge.up { background: var(--green-dim); color: var(--green); }
.kpi-badge.down { background: var(--red-dim); color: var(--red); }
.kpi-badge.neutral { background: var(--bg-elevated); color: var(--text-secondary); }

/* Section Headers */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title span.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  display: inline-block;
}

/* Panel/Card container */
.panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 16px;
}
.panel-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-panel);
}
.panel-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
.panel-body { padding: 16px; }

/* Tables */
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
thead tr { background: var(--bg-panel); }
th {
  padding: 9px 12px;
  text-align: left;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  font-family: var(--font-mono);
}
th:hover { color: var(--text-secondary); }
th.sort-asc::after { content: ' ↑'; color: var(--accent); }
th.sort-desc::after { content: ' ↓'; color: var(--accent); }
tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background var(--transition);
}
tbody tr:hover { background: var(--bg-hover); }
tbody tr:last-child { border-bottom: none; }
td {
  padding: 9px 12px;
  color: var(--text-primary);
  vertical-align: middle;
}
td.mono { font-family: var(--font-mono); font-size: 11px; }
td.muted { color: var(--text-muted); }
.table-actions { display: flex; gap: 4px; align-items: center; }
.no-data {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 12px;
}
.no-data .no-data-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.4; }

/* Badges/Pills */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 500;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.badge-active, .badge-paid { background: var(--green-dim); color: var(--green); }
.badge-planned { background: var(--cyan-dim); color: var(--cyan); }
.badge-missed, .badge-overdue { background: var(--red-dim); color: var(--red); }
.badge-paused, .badge-partial { background: var(--yellow-dim); color: var(--yellow); }
.badge-completed, .badge-settled { background: var(--purple-dim); color: var(--purple); }
.badge-cancelled { background: var(--bg-elevated); color: var(--text-muted); }
.badge-open { background: var(--accent-dim); color: var(--accent); }
.badge-lina { background: var(--green-dim); color: var(--green); }
.badge-alayna { background: var(--red-dim); color: var(--red); }
.badge-egp { background: rgba(245,158,11,0.1); color: var(--yellow); }
.badge-aed { background: rgba(6,182,212,0.1); color: var(--cyan); }
.badge-usd { background: rgba(34,197,94,0.1); color: var(--green); }

/* Progress bars */
.progress-bar {
  height: 4px;
  background: var(--bg-elevated);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 8px;
}
.progress-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--accent);
  transition: width 0.4s ease;
}
.progress-fill.green { background: var(--green); }
.progress-fill.yellow { background: var(--yellow); }
.progress-fill.red { background: var(--red); }

/* Forms */
.form-grid { display: grid; gap: 14px; }
.form-grid-2 { grid-template-columns: 1fr 1fr; }
.form-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: 0.3px;
}
.form-label .required { color: var(--red); margin-left: 2px; }
.form-control {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 7px 10px;
  border-radius: var(--radius);
  font-size: 12px;
  font-family: var(--font-main);
  transition: border-color var(--transition);
  width: 100%;
}
.form-control:focus { outline: none; border-color: var(--accent); }
.form-control::placeholder { color: var(--text-muted); }
select.form-control { cursor: pointer; }
.form-control[type="date"] { color: var(--text-primary); }
textarea.form-control { resize: vertical; min-height: 70px; }
.form-hint { font-size: 10px; color: var(--text-muted); }
.readonly-display {
  background: var(--bg-panel);
  border: 1px dashed var(--border-active);
  color: var(--text-secondary);
  padding: 7px 10px;
  border-radius: var(--radius);
  font-size: 12px;
  font-family: var(--font-mono);
  min-height: 34px;
  display: flex;
  align-items: center;
}
.import-preview-wrap {
  max-height: 280px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.import-result-ok { color: var(--green); font-family: var(--font-mono); font-size: 10px; }
.import-result-error { color: var(--red); font-family: var(--font-mono); font-size: 10px; }
.import-result-warn { color: var(--yellow); font-family: var(--font-mono); font-size: 10px; }

/* Search + Filter bar */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.search-input-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
}
.search-input-wrap input {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 6px 10px 6px 30px;
  border-radius: var(--radius);
  font-size: 12px;
  font-family: var(--font-main);
  width: 100%;
}
.search-input-wrap input:focus { outline: none; border-color: var(--accent); }
.search-input-wrap .search-icon {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 12px;
}
.filter-select {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 6px 10px;
  border-radius: var(--radius);
  font-size: 12px;
  cursor: pointer;
  font-family: var(--font-main);
}
.filter-select:focus { outline: none; border-color: var(--accent); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--bg-panel);
  border: 1px solid var(--border-active);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
}
.modal-lg { max-width: 860px; }
.modal-sm { max-width: 440px; }
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--bg-panel);
  z-index: 1;
}
.modal-title { font-size: 14px; font-weight: 600; }
.modal-body { padding: 20px; }
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.modal-close {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 2px;
}
.modal-close:hover { color: var(--text-primary); }

/* Toast */
#toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: var(--bg-elevated);
  border: 1px solid var(--border-active);
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: 12px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 260px;
  max-width: 380px;
  box-shadow: var(--shadow);
  animation: slideIn 0.2s ease;
}
.toast.success { border-left: 3px solid var(--green); }
.toast.error { border-left: 3px solid var(--red); }
.toast.warning { border-left: 3px solid var(--yellow); }
.toast.info { border-left: 3px solid var(--accent); }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; transform: translateX(40px); } }

/* Charts */
.chart-wrap { padding: 16px; }
.bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 140px; }
.bar-item { display: flex; flex-direction: column; align-items: center; flex: 1; gap: 4px; height: 100%; justify-content: flex-end; }
.bar-fill { width: 100%; border-radius: 3px 3px 0 0; transition: height 0.4s ease; min-height: 2px; }
.bar-label { font-size: 9px; color: var(--text-muted); font-family: var(--font-mono); text-align: center; }
.bar-value { font-size: 9px; color: var(--text-secondary); font-family: var(--font-mono); }
.donut-wrap { display: flex; align-items: center; gap: 20px; }
.donut-legend { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.legend-label { color: var(--text-secondary); }
.legend-value { margin-left: auto; color: var(--text-primary); font-family: var(--font-mono); font-size: 11px; }


/* Visual Insights dashboard charts */
.dashboard-tabs { margin-bottom: 16px; }
.visual-insights-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}
.visual-insights-header .visual-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text-primary);
}
.visual-insights-header .visual-subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
}
.visual-insights-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.visual-chart-body { padding: 14px 16px 16px; }
.visual-chart-empty {
  min-height: 170px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 12px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  background: var(--bg-panel);
}
.visual-svg-chart { width: 100%; height: 190px; display:block; overflow: visible; }
.visual-axis-label { fill: var(--text-muted); font-family: var(--font-mono); font-size: 10px; }
.visual-line { fill:none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.visual-area { fill: var(--accent-dim); }
.visual-point { fill: var(--accent); stroke: var(--bg-card); stroke-width: 2; }
.visual-grid-line { stroke: var(--border); stroke-width: 1; opacity: 0.75; }
.visual-bar-list { display:flex; flex-direction:column; gap:10px; }
.visual-bar-row { display:grid; grid-template-columns:minmax(120px, 1fr) 2.2fr auto; gap:10px; align-items:center; }
.visual-bar-name { font-size:12px; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.visual-bar-track { height:10px; border-radius:999px; background:var(--bg-elevated); overflow:hidden; border:1px solid var(--border); }
.visual-bar-fill { height:100%; border-radius:999px; background:linear-gradient(90deg, var(--accent), var(--cyan)); min-width:2px; }
.visual-bar-value { font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); text-align:right; min-width:86px; }
.visual-donut-layout { display:flex; gap:18px; align-items:center; min-height:178px; }
.visual-donut {
  width: 142px;
  height: 142px;
  border-radius: 50%;
  position: relative;
  flex: 0 0 142px;
  box-shadow: inset 0 0 0 1px var(--border);
}
.visual-donut::after {
  content: '';
  position: absolute;
  inset: 33px;
  border-radius: 50%;
  background: var(--bg-card);
  box-shadow: 0 0 0 1px var(--border);
}
.visual-donut-center {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:1;
  pointer-events:none;
}
.visual-donut-center strong { font-family:var(--font-mono); font-size:16px; }
.visual-donut-center span { color:var(--text-muted); font-size:10px; text-transform:uppercase; letter-spacing:0.7px; }
.visual-legend { display:flex; flex-direction:column; gap:8px; flex:1; min-width:0; }
.visual-legend-row { display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:8px; align-items:center; font-size:12px; }
.visual-legend-swatch { width:10px; height:10px; border-radius:999px; }
.visual-legend-name { color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.visual-legend-value { font-family:var(--font-mono); color:var(--text-primary); font-size:11px; }
.visual-chart-footer { color:var(--text-muted); font-size:11px; margin-top:10px; border-top:1px solid var(--border); padding-top:9px; }
.visual-month-scope {
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  color:var(--text-secondary);
  font-size:11px;
}
.visual-month-badge {
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 8px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--bg-card);
  color:var(--text-secondary);
  font-family:var(--font-mono);
}
.visual-insight-note,
.visual-definition-box {
  margin-top:10px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--bg-panel);
  color:var(--text-secondary);
  font-size:11px;
  line-height:1.45;
}
.visual-definition-box strong { color:var(--text-primary); }
.payment-method-summary {
  display:grid;
  grid-template-columns: minmax(180px, 0.9fr) minmax(220px, 1.1fr);
  gap:18px;
  align-items:center;
  min-height:178px;
}
.payment-method-single-card {
  min-height:142px;
  border:1px solid var(--border);
  border-radius:18px;
  background:linear-gradient(135deg, var(--accent-dim), var(--bg-card));
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;
  padding:18px;
}
.payment-method-single-card .big { font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--text-primary); }
.payment-method-single-card .muted { color:var(--text-secondary); font-size:12px; }
.payment-method-list { display:flex; flex-direction:column; gap:8px; min-width:0; }
.payment-method-row { display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:9px; align-items:center; font-size:12px; }
.payment-method-row .name { color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.payment-method-row .value { font-family:var(--font-mono); color:var(--text-primary); font-size:11px; text-align:right; }
.payment-method-row .detail { grid-column:2 / 4; color:var(--text-muted); font-size:10px; margin-top:-3px; }
.visual-donut-layout { gap:28px; justify-content:flex-start; }
.visual-donut { width:118px; height:118px; flex-basis:118px; }
.visual-donut::after { inset:30px; }
.visual-donut-center strong { font-size:13px; }
.visual-legend-row { grid-template-columns:10px minmax(120px,1fr) auto; gap:10px; }
.pva-summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
.pva-summary-card { border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-panel); padding:10px; }
.pva-summary-card .label { color:var(--text-muted); font-size:10px; text-transform:uppercase; letter-spacing:0.7px; }
.pva-summary-card .value { color:var(--text-primary); font-family:var(--font-mono); font-size:16px; font-weight:700; margin-top:4px; }
.pva-summary-card .sub { color:var(--text-secondary); font-size:10px; margin-top:4px; line-height:1.35; }
@media (max-width: 980px) {
  .payment-method-summary { grid-template-columns:1fr; }
  .pva-summary-grid { grid-template-columns:1fr; }
}


/* Dividers */
.divider { height: 1px; background: var(--border); margin: 16px 0; }

/* Grid layouts */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.flex-row { display: flex; gap: 12px; align-items: center; }
.flex-wrap { flex-wrap: wrap; }


.quick-filter.active {
  background: var(--accent-dim);
  color: var(--accent);
  border-color: var(--accent);
}
.loan-seq-actions { display:flex; gap:3px; align-items:center; }
.loan-seq { font-family: var(--font-mono); color: var(--text-secondary); font-size:11px; }

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  gap: 4px;
  justify-content: flex-end;
  padding: 12px 0 0;
}
.page-btn {
  padding: 4px 9px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 11px;
  font-family: var(--font-mono);
}
.page-btn:hover, .page-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.page-info { font-size: 11px; color: var(--text-muted); margin-right: 8px; font-family: var(--font-mono); }

/* Checkbox */
input[type="checkbox"] {
  accent-color: var(--accent);
  width: 13px;
  height: 13px;
  cursor: pointer;
}

/* Confirmation prompt */
.confirm-msg { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
.confirm-msg strong { color: var(--text-primary); }

/* Loan card in detail view */
.loan-stat-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.loan-stat-row:last-child { border-bottom: none; }
.loan-stat-row .stat-key { color: var(--text-secondary); }
.loan-stat-row .stat-val { color: var(--text-primary); font-family: var(--font-mono); }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab-item {
  padding: 8px 16px;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all var(--transition);
}
.tab-item:hover { color: var(--text-primary); }
.tab-item.active { color: var(--accent); border-bottom-color: var(--accent); }

/* RTL */
[dir="rtl"] .nav-item { border-left: none; border-right: 2px solid transparent; }
[dir="rtl"] .nav-item.active { border-right-color: var(--accent); }
[dir="rtl"] th { text-align: right; }
[dir="rtl"] td { text-align: right; }
[dir="rtl"] .form-label { text-align: right; }
[dir="rtl"] .toast { flex-direction: row-reverse; }

/* Data quality warning */
.dq-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius);
  margin-bottom: 6px;
  font-size: 12px;
}
.dq-item.warn { background: var(--yellow-dim); border: 1px solid rgba(245,158,11,0.2); }
.dq-item.error { background: var(--red-dim); border: 1px solid rgba(239,68,68,0.2); }
.dq-item.info { background: var(--accent-dim); border: 1px solid rgba(59,130,246,0.2); }
.dq-icon { font-size: 14px; margin-top: 1px; flex-shrink: 0; }
.dq-content { flex: 1; }
.dq-title { font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
.dq-desc { color: var(--text-secondary); }
.dq-count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }

/* Report tables */
.report-total td { background: var(--bg-elevated); font-weight: 600; font-family: var(--font-mono); }

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
}
.empty-state-icon { font-size: 40px; opacity: 0.2; margin-bottom: 12px; }
.empty-state-title { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; }
.empty-state-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }


.theme-toggle, .sidebar-footer .theme-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 6px 0;
  color: var(--text-secondary);
}
.theme-toggle:hover, .sidebar-footer .theme-toggle:hover { color: var(--text-primary); }
.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-elevated);
}
.badge-early-settlement, .badge-early { background: var(--purple-dim); color: var(--purple); }
.early-settlement-row td { box-shadow: inset 3px 0 0 var(--purple); }
html[data-theme="light"] .settled-row td { opacity: 0.65; }
html[data-theme="light"] .badge { font-weight: 600; }

/* ================================================
   PAGE-SPECIFIC EXTRAS
================================================ */
.dashboard-grid { display: grid; gap: 16px; }
.chart-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.chart-card-header {
  padding: 12px 16px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.chart-card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); font-family: var(--font-mono); }

/* Bulk action bar */
.bulk-bar {
  background: var(--accent-dim);
  border: 1px solid rgba(59,130,246,0.3);
  border-radius: var(--radius);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--accent);
}
.selection-toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin: 0 0 10px;
}
.selection-counter {
  font-size: 11px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-elevated);
}
tr.row-selected td {
  background: var(--accent-dim) !important;
  box-shadow: inset 3px 0 0 var(--accent);
}
tr.row-selected:hover td { background: var(--accent-dim) !important; }
tr.row-selectable { cursor: pointer; }
.bulk-bar .bulk-spacer { flex: 1; }
.bulk-bar-stable {
  min-height: 42px;
  transition: opacity var(--transition), background var(--transition), border-color var(--transition);
}
.bulk-bar-empty {
  background: transparent;
  border-style: dashed;
  border-color: var(--border);
  color: var(--text-muted);
  opacity: 0.75;
}
.bulk-bar-empty .bulk-action-btn { display: none; }
.bulk-bar-empty strong { color: var(--text-muted); }
.bulk-bar-status-text { color: inherit; }

/* Settlement indicator */
.settled-row td { opacity: 0.5; }

/* In-kind label */
.inkind-tag {
  display: inline-block;
  padding: 1px 6px;
  background: var(--purple-dim);
  color: var(--purple);
  border-radius: 3px;
  font-size: 10px;
  font-family: var(--font-mono);
}


/* Currency-safe financial totals */
.money-breakdown {
  display: flex;
  flex-direction: column;
  gap: 3px;
  line-height: 1.25;
}
.money-line {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  font-family: var(--font-mono);
  white-space: nowrap;
}
.money-line .money-currency {
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: 0.4px;
}
.money-line .money-amount {
  color: inherit;
  font-size: 15px;
  font-weight: 600;
}
.money-breakdown.inline {
  display: inline-flex;
  min-width: 120px;
}
.money-breakdown.compact .money-line {
  justify-content: flex-start;
}
.money-breakdown.compact .money-amount {
  font-size: 12px;
  font-weight: 500;
}
.money-breakdown.single .money-line {
  justify-content: flex-start;
}
.currency-note {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 6px;
}


/* Loan progress overview */
.loan-progress-list { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.loan-progress-item {
  border: 1px solid var(--border);
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 12px 14px;
}
.loan-progress-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:10px; }
.loan-progress-name { font-weight:600; color:var(--text-primary); font-size:12px; }
.loan-progress-meta { font-size:10px; color:var(--text-muted); font-family:var(--font-mono); margin-top:2px; }
.loan-progress-pct { font-size:16px; font-weight:700; color:var(--accent); font-family:var(--font-mono); }
.loan-progress-amounts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.loan-progress-amount { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:8px; }
.loan-progress-amount .label { font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.7px; font-family:var(--font-mono); }
.loan-progress-amount .value { font-size:12px; color:var(--text-primary); font-family:var(--font-mono); margin-top:2px; }
.status-lock-note {
  grid-column: 1 / -1;
  border: 1px solid rgba(245,158,11,0.28);
  background: var(--yellow-dim);
  color: var(--text-secondary);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 11px;
}


/* Financial Health Score — aligned executive summary */
.health-score-wrap { padding: 18px; }
.health-exec-summary {
  display: grid;
  grid-template-columns: minmax(190px, 0.85fr) minmax(280px, 1.4fr);
  gap: 18px;
  align-items: stretch;
}
.health-score-panel {
  border: 1px solid var(--border);
  background: var(--bg-panel);
  border-radius: var(--radius-lg);
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 180px;

<script>
/* ================================================================
   DATA MODEL & STORAGE
================================================================ */
const DB_BASE_KEY = 'pfm_v2_data';
const PROFILES_KEY = 'pfm_profiles';
const STORAGE_ENGINE_KEY = 'pfm_storage_engine_v6';
const DB_NAME = 'pfm_lifetime_storage_v1';
const DB_VERSION = 1;
const DB_PROFILE_STORE = 'profiles';
const DB_META_STORE = 'meta';
let activeProfileId = 'default';
let pfmDb = null;
let storageBackend = 'indexedDB';
let storageReadyPromise = null;
let persistQueue = Promise.resolve();

/* Profile-aware legacy key. v6.0 stores main data in IndexedDB, but these
   keys are still used for one-time migration from older Local Storage builds. */
function dataKey(profileId) {
  const id = profileId || activeProfileId;
  return id === 'default' ? DB_BASE_KEY : DB_BASE_KEY + '__' + id;
}

function getProfilesRegistry() {
  try {
    const raw = localStorage.getItem(PROFILES_KEY);
    if (raw) {
      const reg = JSON.parse(raw);
      if (reg && Array.isArray(reg.list) && reg.list.length) {
        if (!reg.list.some(p => p.id === reg.active)) reg.active = reg.list[0].id;
        return reg;
      }
    }
  } catch(e) { /* fall through to default */ }
  return { active: 'default', list: [{ id: 'default', name: 'Personal', createdAt: new Date().toISOString() }] };
}

function saveProfilesRegistry(reg) {
  try { localStorage.setItem(PROFILES_KEY, JSON.stringify(reg)); } catch(e) { /* registry is tiny; ignore */ }
}

function clonePlain(obj) {
  return JSON.parse(JSON.stringify(obj || {}));
}

function supportsIndexedDB() {
  return typeof indexedDB !== 'undefined';
}

function openFinanceDB() {
  return new Promise((resolve, reject) => {
    if (!supportsIndexedDB()) {
      storageBackend = 'localStorageFallback';
      resolve(null);
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(event) {
      const db = event.target.result;
      if (!db.objectStoreNames.contains(DB_PROFILE_STORE)) {
        db.createObjectStore(DB_PROFILE_STORE, { keyPath: 'profileId' });
      }
      if (!db.objectStoreNames.contains(DB_META_STORE)) {
        db.createObjectStore(DB_META_STORE, { keyPath: 'key' });
      }
    };
    req.onsuccess = function(event) {
      pfmDb = event.target.result;
      storageBackend = 'indexedDB';
      try { localStorage.setItem(STORAGE_ENGINE_KEY, 'indexedDB'); } catch(e) {}
      resolve(pfmDb);
    };
    req.onerror = function() {
      storageBackend = 'localStorageFallback';
      resolve(null);
    };
    req.onblocked = function() {
      storageBackend = 'localStorageFallback';
      resolve(null);
    };
  });
}

function ensureStorageReady() {
  if (!storageReadyPromise) storageReadyPromise = openFinanceDB();
  return storageReadyPromise;
}

function idbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    if (!pfmDb) { resolve(null); return; }
    const tx = pfmDb.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function idbPut(storeName, value) {
  return new Promise((resolve, reject) => {
    if (!pfmDb) { reject(new Error('IndexedDB is not available')); return; }
    const tx = pfmDb.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    store.put(value);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error || new Error('IndexedDB write failed'));
    tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
  });
}

function idbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    if (!pfmDb) { resolve(true); return; }
    const tx = pfmDb.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    store.delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error || new Error('IndexedDB delete failed'));
  });
}

async function readProfileData(profileId) {
  await ensureStorageReady();
  if (storageBackend === 'indexedDB' && pfmDb) {
    const record = await idbGet(DB_PROFILE_STORE, profileId || activeProfileId);
    return record && record.data ? record.data : null;
  }
  const raw = localStorage.getItem(dataKey(profileId || activeProfileId));
  return raw ? JSON.parse(raw) : null;
}

async function writeProfileData(profileId, data) {
  const id = profileId || activeProfileId;
  await ensureStorageReady();
  const payload = clonePlain(data);
  if (storageBackend === 'indexedDB' && pfmDb) {
    await idbPut(DB_PROFILE_STORE, { profileId: id, data: payload, updatedAt: new Date().toISOString(), version: '6.0' });
    return true;
  }
  localStorage.setItem(dataKey(id), JSON.stringify(payload));
  return true;
}

async function deleteProfileData(profileId) {
  const id = profileId || activeProfileId;
  await ensureStorageReady();
  if (storageBackend === 'indexedDB' && pfmDb) await idbDelete(DB_PROFILE_STORE, id);
  localStorage.removeItem(dataKey(id));
  localStorage.removeItem(dataKey(id) + '__migrated_to_indexeddb');
}

async function migrateLegacyLocalStorageProfile(profileId) {
  const id = profileId || activeProfileId;
  if (storageBackend !== 'indexedDB' || !pfmDb) return null;
  const legacyKey = dataKey(id);
  const raw = localStorage.getItem(legacyKey);
  if (!raw) return null;
  const legacyData = JSON.parse(raw);
  await writeProfileData(id, legacyData);
  /* Free the small Local Storage quota after the durable IndexedDB write succeeds.
     This is a move, not a delete: main finance data now lives in IndexedDB. */
  localStorage.removeItem(legacyKey);
  try { localStorage.setItem(legacyKey + '__migrated_to_indexeddb', new Date().toISOString()); } catch(e) {}
  return legacyData;
}

function fallbackLocalStorageSave(profileId, data) {
  try {
    localStorage.setItem(dataKey(profileId), JSON.stringify(data));
    storageBackend = 'localStorageFallback';
    return true;
  } catch(e) {
    return false;
  }
}

/* v6.0 persistence: main financial records are saved in IndexedDB.
   Local Storage is kept only for tiny profile/settings metadata and for fallback. */
function persistAppData() {
  const profileId = activeProfileId;
  const snapshot = clonePlain(AppData);
  persistQueue = persistQueue.then(async () => {
    try {
      await writeProfileData(profileId, snapshot);
      return true;
    } catch(e) {
      const ok = fallbackLocalStorageSave(profileId, snapshot);
      if (!ok && typeof showToast === 'function') {
        showToast('SAVE FAILED: browser storage is unavailable. Export a backup immediately.', 'error', 8000);
      } else if (ok && typeof showToast === 'function') {
        showToast('IndexedDB was unavailable, so the app saved using Local Storage fallback.', 'warning', 5000);
      }
      return ok;
    }
  });
  return true;
}

function getJsonByteSize(value) {
  try { return JSON.stringify(value || {}).length * 2; } catch(e) { return 0; }
}

function getStorageBreakdown() {
  const full = getJsonByteSize(AppData);
  const audit = getJsonByteSize(AppData.auditLog || []);
  const undo = getJsonByteSize(AppData.undoStack || []);
  const settings = getJsonByteSize({ settings: AppData.settings || {}, lookups: AppData.lookups || {} });
  const business = Math.max(0, full - audit - undo);
  return { full, business, audit, undo, settings };
}

function getStorageUsage() {
  const reg = getProfilesRegistry();
  let localBytes = 0, legacyProfileBytes = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    const v = localStorage.getItem(k) || '';
    const size = (k.length + v.length) * 2;
    localBytes += size;
    if (k === DB_BASE_KEY || k.startsWith(DB_BASE_KEY + '__')) legacyProfileBytes += size;
  }
  const breakdown = getStorageBreakdown();
  const quota = storageBackend === 'indexedDB' ? null : 5 * 1024 * 1024;
  const pct = quota ? Math.min(100, Math.round(localBytes / quota * 100)) : 0;
  return { appBytes: breakdown.full, localBytes, legacyProfileBytes, quota, pct, reg, breakdown, backend: storageBackend };
}

function getProfileStorageLabel(profileId) {
  if (profileId === activeProfileId && AppData && Object.keys(AppData).length) return fmtBytes(getJsonByteSize(AppData)) + ' active data';
  const raw = localStorage.getItem(dataKey(profileId));
  if (raw) return fmtBytes(raw.length * 2) + ' legacy Local Storage data';
  const migrated = localStorage.getItem(dataKey(profileId) + '__migrated_to_indexeddb');
  if (migrated) return 'Stored in IndexedDB · migrated ' + (fmtDate((migrated || '').slice(0,10)) || 'recently');
  return storageBackend === 'indexedDB' ? 'Stored in IndexedDB' : 'Local Storage fallback';
}

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1024 / 1024).toFixed(2) + ' MB';
}

}

async function loadData() {
  try {
    await ensureStorageReady();
    let stored = await readProfileData(activeProfileId);
    if (!stored && storageBackend === 'indexedDB') {
      stored = await migrateLegacyLocalStorageProfile(activeProfileId);
    }
    if (stored) {
      AppData = stored;
      normalizeLoadedData();
    } else {
      AppData = JSON.parse(JSON.stringify(defaultData));
      seedData();
      normalizeLoadedData();
      await writeProfileData(activeProfileId, AppData);
    }
    migrateData();
    lastBusinessSnapshot = businessSnapshot(AppData);
  } catch(e) {
    console.error('Load failed', e);
    setAuditAction('Reset sample data after load failure');
    AppData = JSON.parse(JSON.stringify(defaultData));
    seedData();
    normalizeLoadedData();
    migrateData();
    lastBusinessSnapshot = businessSnapshot(AppData);
    persistAppData();
    if (typeof showToast === 'function') showToast('Storage load failed; sample data was loaded. Import your backup if needed.', 'error', 7000);
  }
}

function businessSnapshot(data) {
  const clone = JSON.parse(JSON.stringify(data || {}));
  delete clone.auditLog;
  delete clone.undoStack;
  return JSON.stringify(clone);
}

function ensureGovernanceArrays() {
  if (!Array.isArray(AppData.auditLog)) AppData.auditLog = [];
  if (!Array.isArray(AppData.undoStack)) AppData.undoStack = [];
  getPaymentMethods();
}

function setAuditAction(label) {
  pendingAuditAction = label || '';
}

function addAuditLog(action, module='System', recordRef='', beforeValue='', afterValue='') {
  ensureGovernanceArrays();
  const entry = {
    id: genId('aud'),
    timestamp: new Date().toISOString(),
    user: AppData.settings?.currentUser || 'Local User',
    action: action || 'Data Updated',
    module: module || currentPage || 'System',
    recordRef: recordRef || '',
    beforeValue: beforeValue || '',
    afterValue: afterValue || ''
  };
  AppData.auditLog.unshift(entry);
  if (AppData.auditLog.length > 500) AppData.auditLog = AppData.auditLog.slice(0, 500);
}

function pushUndoSnapshot(snapshot, label) {
  ensureGovernanceArrays();
  if (!snapshot) return;
  AppData.undoStack.push({
    id: genId('und'),
    timestamp: new Date().toISOString(),
    label: label || 'Last change',
    snapshot
  });
  if (AppData.undoStack.length > 10) AppData.undoStack = AppData.undoStack.slice(-10);
}

function updateUndoButton() {
  const count = Array.isArray(AppData.undoStack) ? AppData.undoStack.length : 0;
  document.querySelectorAll('.undo-action-btn').forEach(btn => {
    btn.disabled = count === 0;
    btn.title = count ? `Undo last change (${count} available)` : 'No undo action available';
  });
  document.querySelectorAll('.undo-label').forEach(label => {
    label.textContent = 'Undo';
  });
  document.querySelectorAll('.undo-count-badge').forEach(badge => {
    badge.textContent = count;
    badge.style.display = count ? '' : 'none';
  });
}

function renderUndoControl(extraClass='btn-xs') {
  const count = Array.isArray(AppData.undoStack) ? AppData.undoStack.length : 0;
  return `<button class="btn btn-secondary ${extraClass} undo-action-btn" onclick="undoLastAction()" ${count ? '' : 'disabled'} title="${count ? `Undo last change (${count} available)` : 'No undo action available'}">
    ↶ <span class="undo-label">Undo</span><span class="undo-count-badge" style="${count ? '' : 'display:none'}">${count}</span>
  </button>`;
}

function appendUndoTopbarButton() {
  // Undo is intentionally rendered inside each page's operational controls, not isolated in the top-right header.
  updateUndoButton();
}

function undoLastAction() {
  ensureGovernanceArrays();
  const item = AppData.undoStack.pop();
  if (!item) { showToast('Nothing to undo', 'info'); return; }
  try {
    const restoredBusiness = JSON.parse(item.snapshot);
    const currentAudit = AppData.auditLog || [];
    const currentUndo = AppData.undoStack || [];
    AppData = Object.assign({}, restoredBusiness, { auditLog: currentAudit, undoStack: currentUndo });
    suppressAuditUndo = true;
    addAuditLog('Undo: ' + (item.label || 'Last change'), 'System');
    lastBusinessSnapshot = businessSnapshot(AppData);
    persistAppData();
    suppressAuditUndo = false;
      applyTheme();
    navigate(currentPage || 'dashboard');
    updateBadges();
    updateUndoButton();
    showToast('Last change undone', 'success');
  } catch(e) {
    suppressAuditUndo = false;
    showToast('Undo failed: ' + e.message, 'error');
  }
}

function saveData() {
  ensureGovernanceArrays();
  const currentSnapshot = businessSnapshot(AppData);
  if (!lastBusinessSnapshot) lastBusinessSnapshot = currentSnapshot;
  if (!suppressAuditUndo && currentSnapshot !== lastBusinessSnapshot) {
    const label = pendingAuditAction || 'Data updated';
    pushUndoSnapshot(lastBusinessSnapshot, label);
    addAuditLog(label, currentPage || 'System');
    pendingAuditAction = '';
  }
  lastBusinessSnapshot = businessSnapshot(AppData);
  persistAppData();
  updateBadges();
  updateUndoButton();
}

/* ================================================================
   UTILITY FUNCTIONS
================================================================ */
function today() {
  return new Date().toISOString().split('T')[0];
}

function fmt(num, decimals=0) {
  if (num === null || num === undefined || isNaN(num)) return '—';
  return Number(num).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); } catch(e) { return d; }
}

function pad2(n) { return String(n).padStart(2, '0'); }

function nowTimeHHMM() {
  const d = new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function normalizeTimeInput(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  let m = raw.match(/^(\d{1,2})(?::(\d{2}))?(?::(\d{2}))?\s*(am|pm)?$/i);
  if (m) {
    let h = parseInt(m[1], 10);
    const min = parseInt(m[2] || '0', 10);
    const meridiem = (m[4] || '').toLowerCase();
    if (Number.isNaN(h) || Number.isNaN(min) || min < 0 || min > 59) return '';
    if (meridiem === 'pm' && h < 12) h += 12;
    if (meridiem === 'am' && h === 12) h = 0;
    if (h < 0 || h > 23) return '';
    return `${pad2(h)}:${pad2(min)}`;
  }
  const parsed = new Date(raw);
  if (!Number.isNaN(parsed.getTime())) return `${pad2(parsed.getHours())}:${pad2(parsed.getMinutes())}`;
  return '';
}

function fmtTime(t) {
  const val = normalizeTimeInput(t);
  return val || '—';
}

function getYesterdayDate() {
  const d = new Date(today() + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().split('T')[0];
}

function getDailyExpenseTime(r) {
  return normalizeTimeInput(r?.transactionTime || r?.time || '');
}

function getDailyExpenseTimestamp(r) {
  const date = String(r?.date || '').trim();
  if (!date) return 0;
  const time = getDailyExpenseTime(r) || '00:00';
  const parsed = new Date(`${date}T${time}:00`);
  return Number.isNaN(parsed.getTime()) ? 0 : parsed.getTime();
}

function getDailyExpenseFallbackSort(r) {
  const imported = Date.parse(r?.importedAt || r?.createdAt || '');
  if (!Number.isNaN(imported)) return imported;
  const created = Date.parse(r?.createdDate || '');
  if (!Number.isNaN(created)) return created;
  const tx = parseFloat(r?.txnId || 0);
  return Number.isNaN(tx) ? 0 : tx;
}

function renderDailyExpenseDateTimeCell(r) {
  const t = getDailyExpenseTime(r);
  return `<div class="mono">${fmtDate(r.date)}</div><div class="text-muted text-sm mono">${t ? escapeHtml(t) : 'No time'}</div>`;
}

function monthsBetween(d1, d2) {
  const a = new Date(d1), b = new Date(d2);
  return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
}

function addMonths(dateStr, n) {
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + n);
  return d.toISOString().split('T')[0];
}

function isOverdue(dateStr) {
  if (!dateStr) return false;
  return new Date(dateStr) < new Date(today());
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


function getCurrencyOrder() {
  const defaults = (AppData && AppData.lookups && Array.isArray(AppData.lookups.currencies)) ? AppData.lookups.currencies : ['AED','EGP','USD','Other'];
  return defaults.filter(Boolean);
}

function addCurrencyTotal(totals, currency, amount) {
  const cur = String(currency || 'Unspecified').trim() || 'Unspecified';
  const val = parseFloat(amount);
  if (!isFinite(val)) return totals;
  totals[cur] = (totals[cur] || 0) + val;
  return totals;
}

function buildCurrencyTotals(records, amountSelector='amount', currencySelector='currency') {
  const totals = {};
  (records || []).forEach(rec => {
    const amount = typeof amountSelector === 'function' ? amountSelector(rec) : rec?.[amountSelector];
    const currency = typeof currencySelector === 'function' ? currencySelector(rec) : rec?.[currencySelector];
    addCurrencyTotal(totals, currency, amount);
  });
  return totals;
}

function subtractCurrencyTotals(a={}, b={}) {
  const out = {};
  Object.keys(a || {}).forEach(k => addCurrencyTotal(out, k, a[k]));
  Object.keys(b || {}).forEach(k => addCurrencyTotal(out, k, -b[k]));
  Object.keys(out).forEach(k => { if (Math.abs(out[k]) < 0.000001) delete out[k]; });
  return out;
}

function sortedCurrencyEntries(totals={}) {
  const order = getCurrencyOrder();
  return Object.entries(totals)
    .filter(([,v]) => isFinite(parseFloat(v)) && Math.abs(parseFloat(v)) > 0.000001)
    .sort((a,b) => {
      const ai = order.indexOf(a[0]), bi = order.indexOf(b[0]);
      if (ai !== -1 || bi !== -1) return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      return a[0].localeCompare(b[0]);
    });
}

function currencyCount(totals={}) {
  return sortedCurrencyEntries(totals).length;
}

function renderCurrencyBreakdown(totals={}, options={}) {
  const entries = sortedCurrencyEntries(totals);
  const emptyText = options.emptyText || '0';
  const colorClass = options.colorClass || '';
  const compact = options.compact ? ' compact' : '';
  const inline = options.inline ? ' inline' : '';
  const single = entries.length <= 1 ? ' single' : '';
  if (!entries.length) return `<span class="${escapeHtml(colorClass)}">${escapeHtml(emptyText)}</span>`;
  return `<div class="money-breakdown${compact}${inline}${single} ${escapeHtml(colorClass)}">` + entries.map(([cur, val]) => `
    <div class="money-line"><span class="money-currency">${escapeHtml(cur)}</span><span class="money-amount">${fmt(val)}</span></div>`).join('') + `
  </div>`;
}

function renderCurrencyBreakdownPlain(totals={}) {
  const entries = sortedCurrencyEntries(totals);
  if (!entries.length) return '0';
  return entries.map(([cur, val]) => `${cur} ${fmt(val)}`).join(' · ');
}


function divideCurrencyTotals(totals={}, divisor=1) {
  const out = {};
  const safeDivisor = parseFloat(divisor);
  if (!isFinite(safeDivisor) || safeDivisor === 0) return out;
  sortedCurrencyEntries(totals).forEach(([cur, val]) => addCurrencyTotal(out, cur, (parseFloat(val) || 0) / safeDivisor));
  return out;
}

function multiplyCurrencyTotals(totals={}, multiplier=1) {
  const out = {};
  const safeMultiplier = parseFloat(multiplier);
  if (!isFinite(safeMultiplier)) return out;
  sortedCurrencyEntries(totals).forEach(([cur, val]) => addCurrencyTotal(out, cur, (parseFloat(val) || 0) * safeMultiplier));
  return out;
}

function getCategoryCurrencyTotals(records=[]) {
  const byCategory = {};
  (records || []).forEach(r => {
    const category = String(r?.category || 'Other').trim() || 'Other';
    if (!byCategory[category]) byCategory[category] = {};
    addCurrencyTotal(byCategory[category], r?.currency || AppData.settings?.defaultCurrency || 'AED', parseFloat(r?.amount) || 0);
  });
  return byCategory;
}

function getPreferredComparisonCurrency(totals={}) {
  const defaultCurrency = AppData.settings?.defaultCurrency || 'AED';
  if (Object.prototype.hasOwnProperty.call(totals || {}, defaultCurrency)) return defaultCurrency;
  const entries = sortedCurrencyEntries(totals || {});
  return entries.length ? entries[0][0] : defaultCurrency;
}

function getTopCategorySummary(records=[]) {
  const todayTotals = buildCurrencyTotals(records, 'amount', 'currency');
  const comparisonCurrency = getPreferredComparisonCurrency(todayTotals);
  const byCategory = getCategoryCurrencyTotals(records);
  const ranked = Object.entries(byCategory).map(([category, totals]) => {
    const entries = sortedCurrencyEntries(totals);
    const primaryAmount = parseFloat(totals[comparisonCurrency] || (entries[0] ? entries[0][1] : 0)) || 0;
    const totalNumeric = entries.reduce((sum, [, val]) => sum + (parseFloat(val) || 0), 0);
    return { category, totals, primaryAmount, totalNumeric };
  }).filter(x => x.totalNumeric > 0);
  ranked.sort((a,b) => (b.primaryAmount - a.primaryAmount) || (b.totalNumeric - a.totalNumeric) || a.category.localeCompare(b.category));
  return ranked[0] || null;
}

function renderTopCategorySubtitle(topCategory, dayTotals) {
  if (!topCategory) return 'No spending today';
  return `${escapeHtml(renderCurrencyBreakdownPlain(topCategory.totals))} of ${escapeHtml(renderCurrencyBreakdownPlain(dayTotals))} today`;
}

function renderForecastSubtitle(monthRows, monthTotals, avgDailyTotals, remainingDays, isCurrentMonth) {
  if (!monthRows.length) return 'No spending data for this month';
  if (!isCurrentMonth) return 'Completed month total; no projection needed';
  return `Based on ${escapeHtml(renderCurrencyBreakdownPlain(avgDailyTotals))}/day avg · ${remainingDays} day${remainingDays===1?'':'s'} left`;
}


function isPossibleDuplicateDailyExpense(row) {
  return String(row?.possibleDuplicate || row?.possibleduplicate || 'No').toLowerCase() === 'yes';
}

function getDashboardChartCurrency(rows=[], dashboardCurrency='ALL') {
  if (dashboardCurrency && dashboardCurrency !== 'ALL') return dashboardCurrency;
  return getPreferredComparisonCurrency(buildCurrencyTotals(rows, 'amount', 'currency'));
}

function getDashboardChartRows(rows=[], chartCurrency='', includeDuplicates=false) {
  return (rows || []).filter(r => {
    if (!includeDuplicates && isPossibleDuplicateDailyExpense(r)) return false;
    if (chartCurrency && String(r.currency || '') !== chartCurrency) return false;
    return isFinite(parseFloat(r.amount));
  });
}

function getDashboardChartCurrencyNote(allRows=[], chartRows=[], chartCurrency='') {
  const allCurrencies = sortedCurrencyEntries(buildCurrencyTotals(allRows, 'amount', 'currency')).map(([c]) => c);
  const duplicateCount = (allRows || []).filter(isPossibleDuplicateDailyExpense).length;
  const parts = [];
  if (chartCurrency) parts.push(`Charts show ${chartCurrency} records`);
  if (allCurrencies.length > 1) parts.push(`other currencies available: ${allCurrencies.filter(c => c !== chartCurrency).join(', ') || 'none'}`);
  if (duplicateCount) parts.push(`${duplicateCount} possible duplicate${duplicateCount===1?'':'s'} excluded from insights`);
  if (!parts.length) return 'Charts use cleaned daily expense records.';
  return parts.join(' · ');
}

function sumAmounts(rows=[]) {
  return (rows || []).reduce((sum, r) => sum + (parseFloat(r?.amount) || 0), 0);
}

function renderVisualAmount(value, currency='') {
  const amount = fmt(parseFloat(value) || 0);
  return currency ? `${escapeHtml(currency)} ${amount}` : amount;
}

function buildDailySpendSeries(rows=[], month='') {
  const base = month || today().slice(0,7);
  const [yearStr, monthStr] = base.split('-');
  const y = parseInt(yearStr, 10);
  const m = parseInt(monthStr, 10) - 1;
  const days = (!isNaN(y) && !isNaN(m)) ? lastDayOfMonth(y, m) : 31;
  const data = [];
  for (let d = 1; d <= days; d++) {
    const key = `${yearStr}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    data.push({ label: String(d), date: key, amount: 0 });
  }
  (rows || []).forEach(r => {
    if (!r.date || r.date.slice(0,7) !== base) return;
    const day = parseInt(r.date.slice(8,10), 10);
    if (!isNaN(day) && data[day-1]) data[day-1].amount += parseFloat(r.amount) || 0;
  });
  return data;
}

function rankAmountBy(rows=[], keySelector, limit=8) {
  const map = {};
  (rows || []).forEach(r => {
    const key = String(typeof keySelector === 'function' ? keySelector(r) : r?.[keySelector] || 'Other').trim() || 'Other';
    map[key] = (map[key] || 0) + (parseFloat(r.amount) || 0);
  });
  return Object.entries(map)
    .map(([name, amount]) => ({ name, amount }))
    .filter(x => x.amount > 0)
    .sort((a,b) => b.amount - a.amount || a.name.localeCompare(b.name))
    .slice(0, limit);
}

function rankAmountCountBy(rows=[], keySelector, limit=8) {
  const map = {};
  (rows || []).forEach(r => {
    const key = String(typeof keySelector === 'function' ? keySelector(r) : r?.[keySelector] || 'Other').trim() || 'Other';
    if (!map[key]) map[key] = { name: key, amount: 0, count: 0 };
    map[key].amount += parseFloat(r.amount) || 0;
    map[key].count += 1;
  });
  return Object.values(map)
    .filter(x => x.amount > 0)
    .sort((a,b) => b.amount - a.amount || a.name.localeCompare(b.name))
    .slice(0, limit);
}

function buildBalanceSeries(rows=[]) {
  return [...(rows || [])]
    .filter(r => r.balanceAfter !== undefined && r.balanceAfter !== null && String(r.balanceAfter).trim() !== '' && isFinite(parseFloat(String(r.balanceAfter).replace(/,/g,''))))
    .sort((a,b) => getDailyExpenseTimestamp(a) - getDailyExpenseTimestamp(b) || getDailyExpenseFallbackSort(a) - getDailyExpenseFallbackSort(b))
    .map((r, i) => ({ label: getDailyExpenseTime(r) || String(i + 1), amount: parseFloat(String(r.balanceAfter).replace(/,/g,'')) || 0 }));
}

function renderVisualBarList(data=[], currency='', emptyText='No data for the selected period') {
  if (!data.length) return `<div class="visual-chart-empty">${escapeHtml(emptyText)}</div>`;
  const max = Math.max(...data.map(d => parseFloat(d.amount) || 0), 1);
  return `<div class="visual-bar-list">${data.map(d => {
    const pct = Math.max(2, Math.round(((parseFloat(d.amount) || 0) / max) * 100));
    return `<div class="visual-bar-row" title="${escapeHtml(d.name)}: ${escapeHtml(renderVisualAmount(d.amount, currency))}">
      <div class="visual-bar-name">${escapeHtml(d.name)}</div>
      <div class="visual-bar-track"><div class="visual-bar-fill" style="width:${pct}%"></div></div>
      <div class="visual-bar-value">${renderVisualAmount(d.amount, currency)}</div>
    </div>`;
  }).join('')}</div>`;
}

function renderVisualLineChart(data=[], currency='', options={}) {
  if (!data.length || !data.some(d => (parseFloat(d.amount) || 0) !== 0)) return `<div class="visual-chart-empty">${escapeHtml(options.emptyText || 'No trend data for the selected period')}</div>`;
  const w = 720, h = 190, padL = 42, padR = 18, padT = 18, padB = 32;
  const values = data.map(d => parseFloat(d.amount) || 0);
  const minRaw = Math.min(...values), maxRaw = Math.max(...values);
  const min = options.zeroBase === false ? minRaw : Math.min(0, minRaw);
  const max = maxRaw === min ? min + 1 : maxRaw;
  const xStep = data.length > 1 ? (w - padL - padR) / (data.length - 1) : 0;
  const y = val => padT + (max - val) / (max - min) * (h - padT - padB);
  const points = data.map((d, i) => `${padL + i*xStep},${y(parseFloat(d.amount) || 0)}`).join(' ');
  const area = `${padL},${h-padB} ${points} ${w-padR},${h-padB}`;
  const labelStep = Math.max(1, Math.ceil(data.length / 7));
  const lastVal = values[values.length - 1] || 0;
  return `<svg class="visual-svg-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${escapeHtml(options.title || 'Trend chart')}">
    <line class="visual-grid-line" x1="${padL}" y1="${padT}" x2="${w-padR}" y2="${padT}"></line>
    <line class="visual-grid-line" x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}"></line>
    <text class="visual-axis-label" x="0" y="${padT+4}">${escapeHtml(renderVisualAmount(max, currency))}</text>
    <text class="visual-axis-label" x="0" y="${h-padB+4}">${escapeHtml(renderVisualAmount(min, currency))}</text>
    <polygon class="visual-area" points="${area}"></polygon>
    <polyline class="visual-line" points="${points}"></polyline>
    ${data.map((d, i) => {
      const x = padL + i*xStep;
      const yy = y(parseFloat(d.amount) || 0);
      const show = i === 0 || i === data.length - 1 || i % labelStep === 0;
      return `<circle class="visual-point" cx="${x}" cy="${yy}" r="3"><title>${escapeHtml(d.label)}: ${escapeHtml(renderVisualAmount(d.amount, currency))}</title></circle>${show ? `<text class="visual-axis-label" x="${x}" y="${h-10}" text-anchor="middle">${escapeHtml(d.label)}</text>` : ''}`;
    }).join('')}
    <text class="visual-axis-label" x="${w-padR}" y="${padT+4}" text-anchor="end">Latest: ${escapeHtml(renderVisualAmount(lastVal, currency))}</text>
  </svg>`;
}

function renderVisualDonut(data=[], currency='', emptyText='No data for the selected period') {
  const clean = (data || []).filter(d => (parseFloat(d.amount) || 0) > 0);
  if (!clean.length) return `<div class="visual-chart-empty">${escapeHtml(emptyText)}</div>`;
  const total = clean.reduce((s,d) => s + (parseFloat(d.amount) || 0), 0) || 1;
  const palette = ['var(--accent)', 'var(--cyan)', 'var(--green)', 'var(--purple)', 'var(--yellow)', 'var(--red)', 'var(--border-active)', 'var(--text-muted)'];
  let start = 0;
  const gradient = clean.map((d, i) => {
    const end = start + ((parseFloat(d.amount) || 0) / total) * 360;
    const seg = `${palette[i % palette.length]} ${start.toFixed(2)}deg ${end.toFixed(2)}deg`;
    start = end;
    return seg;
  }).join(', ');
  return `<div class="visual-donut-layout">
    <div class="visual-donut" style="background:conic-gradient(${gradient})">
      <div class="visual-donut-center"><strong>${renderVisualAmount(total, currency)}</strong><span>Total</span></div>
    </div>
    <div class="visual-legend">
      ${clean.map((d, i) => {
        const pct = total ? Math.round(((parseFloat(d.amount) || 0) / total) * 100) : 0;
        const countText = d.count ? ` · ${d.count} txn${d.count===1?'':'s'}` : '';
        return `<div class="visual-legend-row">
          <span class="visual-legend-swatch" style="background:${palette[i % palette.length]}"></span>
          <span class="visual-legend-name">${escapeHtml(d.name)} · ${pct}%${escapeHtml(countText)}</span>
          <span class="visual-legend-value">${renderVisualAmount(d.amount, currency)}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderPlannedActualInsight(rows=[], currency='', definitions={}) {
  const planned = parseFloat(rows.find(r => r.kind === 'planned')?.amount || 0) || 0;
  const actual = parseFloat(rows.find(r => r.kind === 'actual')?.amount || 0) || 0;
  const variance = planned - actual;
  const statusLabel = variance >= 0 ? 'Remaining' : 'Over planned';
  const statusAmount = Math.abs(variance);
  const displayRows = [
    { name:'Planned monthly outflow', amount: planned },
    { name:'Actual spending', amount: actual },
    { name: statusLabel, amount: statusAmount }
  ];
  return `<div class="pva-summary-grid">
      <div class="pva-summary-card"><div class="label">Planned</div><div class="value">${renderVisualAmount(planned, currency)}</div><div class="sub">Loan payments due + fixed/planned expenses due this month.</div></div>
      <div class="pva-summary-card"><div class="label">Actual</div><div class="value">${renderVisualAmount(actual, currency)}</div><div class="sub">Recorded payments + clean daily expenses in the selected month.</div></div>
      <div class="pva-summary-card"><div class="label">${escapeHtml(statusLabel)}</div><div class="value">${renderVisualAmount(statusAmount, currency)}</div><div class="sub">${variance >= 0 ? 'Still within the planned monthly outflow.' : 'Actual spending exceeded the planned monthly outflow.'}</div></div>
    </div>
    ${renderVisualBarList(displayRows, currency, 'No planned or actual data for this month')}
    <div class="visual-definition-box">
      <strong>How to read this card:</strong><br>
      <strong>Planned</strong> = loan schedule amounts due this month + planned/fixed expense amounts due this month.<br>
      <strong>Actual</strong> = actual payment records + daily expense records, excluding possible duplicate daily expenses.<br>
      <strong>${escapeHtml(statusLabel)}</strong> = the difference between planned and actual spending for the selected month.
    </div>`;
}

function getCurrencyMixNote(totals={}, singleText='Single currency total', mixedText='Totals grouped by currency') {
  const count = currencyCount(totals);
